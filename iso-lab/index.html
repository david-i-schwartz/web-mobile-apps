<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pegboard Iso Lab</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --bg:#E7EDE8; --mat:rgba(34,86,64,.075); --surface:#F8FAF7; --ink:#17231D; --muted:#55665C;
  --line:#C8D4CB; --accent:#F2C230; --accent-ink:#2A2208; --board:#D8E1E7; --peg:#B4C1CA;
  --guide:rgba(40,62,84,.14); --chip:#EDF2EE; --sel:#17231D; --sel-ink:#F8FAF7;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#132C26; --mat:rgba(255,255,255,.045); --surface:#1A3730; --ink:#E5EEE9; --muted:#9CB3A8;
    --line:#2D4E45; --accent:#F2C230; --accent-ink:#2A2208; --board:#21302F; --peg:#374947;
    --guide:rgba(255,255,255,.085); --chip:#16322B; --sel:#E5EEE9; --sel-ink:#16322B;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#132C26; --mat:rgba(255,255,255,.045); --surface:#1A3730; --ink:#E5EEE9; --muted:#9CB3A8;
  --line:#2D4E45; --accent:#F2C230; --accent-ink:#2A2208; --board:#21302F; --peg:#374947;
  --guide:rgba(255,255,255,.085); --chip:#16322B; --sel:#E5EEE9; --sel-ink:#16322B;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; color:var(--ink); background-color:var(--bg);
  background-image:linear-gradient(var(--mat) 1px,transparent 1px),linear-gradient(90deg,var(--mat) 1px,transparent 1px);
  background-size:20px 20px;
  font-family:"Familjen Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.45;
}
.wrap{max-width:1060px;margin:0 auto;padding:18px 14px 48px}
h1{font-family:"Silkscreen","Courier New",monospace;font-weight:400;font-size:clamp(1.55rem,6vw,2.3rem);line-height:1.05;margin:4px 0 6px;letter-spacing:.01em}
.sub{margin:0 0 16px;color:var(--muted);max-width:58ch}
.layout{display:grid;gap:18px}
@media (min-width:860px){
  .layout{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}
  .boardcol{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
}
.boardbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
#readout{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.95rem}
#board{width:100%;aspect-ratio:1/1;display:block;border-radius:14px;touch-action:manipulation;cursor:crosshair;background:var(--board);box-shadow:inset 0 0 0 1px var(--line)}
#summary{margin:8px 0 0;color:var(--muted);font-size:.92rem}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
button{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 15px;border-radius:999px;cursor:pointer;font-weight:600;font-size:.95rem}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;padding:10px 20px}
.btn:focus-visible,.chip:focus-visible,.tabs button:focus-visible,.editor .c:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px 16px}
.tabs{display:flex;gap:4px;padding:4px;background:var(--chip);border-radius:999px;margin-bottom:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;border:0;background:transparent;padding:8px 12px;border-radius:999px;font-weight:600;cursor:pointer;color:var(--muted);font-size:.9rem;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.row{margin:14px 0 0}
.lab{display:block;font-size:.86rem;color:var(--muted);margin-bottom:6px}
.seg{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1px solid var(--line);background:var(--chip);padding:6px 12px;border-radius:999px;cursor:pointer;font-size:.9rem;font-weight:500;line-height:1.3}
.chip[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.chip.fam{display:inline-flex;align-items:center;gap:7px;padding-left:9px}
.dots{display:inline-flex;padding-left:3px}
.dots i{display:block;width:13px;height:13px;border-radius:50%;margin-left:-3px;box-shadow:0 0 0 1.5px var(--chip)}
.chip[aria-pressed="true"] .dots i{box-shadow:0 0 0 1.5px var(--sel)}
.sw{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:.92rem;margin-left:8px;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--sel)}
.editor{display:grid;gap:3px;touch-action:none;user-select:none;-webkit-user-select:none}
.editor .c{aspect-ratio:1/1;border-radius:50%;border:0;background:var(--peg);padding:0;cursor:pointer;min-width:0}
.editor .c.below{background:transparent;box-shadow:inset 0 0 0 2px var(--muted)}
.slider{display:grid;grid-template-columns:7.5em 1fr 2.2em;align-items:center;gap:10px;margin:6px 0}
.slider span{font-size:.9rem}
.slider output{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.slider input{width:100%;accent-color:var(--sel)}
.seedrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seedrow input{width:7.5em;font:inherit;font-variant-numeric:tabular-nums;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--ink)}
.hint{font-size:.9rem;color:var(--muted);margin:14px 0 0}
details{margin-top:16px;border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:600}
details p{margin:8px 0;max-width:62ch}
.counts{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:4px}
.counts li{display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid var(--line)}
.counts b{font-variant-numeric:tabular-nums;font-weight:600}
#out{margin-top:12px}
#out img{width:100%;max-width:520px;border-radius:12px;display:block}
#out textarea{width:100%;min-height:220px;font:12px/1.35 ui-monospace,Menlo,Consolas,monospace;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px}
#out .cap{font-size:.88rem;color:var(--muted);margin:6px 0}
.labbox textarea{width:100%;min-height:150px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px}
.msg{font-size:.9rem;margin:8px 0 0}
.note{font-size:.88rem;color:var(--muted);margin-top:12px}
</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="PIL">
<meta name="apple-mobile-web-app-capable" content="yes">

<body>
<main class="wrap">
  <h1>Pegboard Iso Lab</h1>
  <p class="sub">Build 3D shapes and tessellate them, grow seeded terrain, tile Truchet pipes, shade distance fields, or import new categories. Every random pattern has a seed number you can reuse.</p>
  <div class="layout">
    <section class="boardcol" aria-label="Pegboard">
      <div class="boardbar">
        <span id="readout">Tap a peg</span>
        <div class="seg" id="boardopts"></div>
      </div>
      <canvas id="board" aria-label="Bead pattern preview"></canvas>
      <p id="summary"></p>
      <div class="actions">
        <button type="button" class="btn primary" id="tessBtn">Tessellate</button>
        <button type="button" class="btn" id="snapBtn">Snapshot</button>
        <button type="button" class="btn" id="textBtn">Pattern as text</button>
      </div>
      <details id="boardpanel" style="margin-top:12px;border-top:0;padding-top:0"><summary id="boardsum">Board</summary><div id="sizeopts" style="margin-top:10px"></div></details>
      <div id="out"></div>
    </section>
    <section class="panel" aria-label="Controls">
      <div class="tabs" role="tablist" id="tabs">
        <button type="button" role="tab" data-tab="shapes">Shapes</button>
        <button type="button" role="tab" data-tab="tess">Tessellate</button>
        <button type="button" role="tab" data-tab="terrain">Terrain</button>
        <button type="button" role="tab" data-tab="truchet">Truchet</button>
        <button type="button" role="tab" data-tab="fields">Fields</button>
        <button type="button" role="tab" data-tab="lab">Lab</button>
        <button type="button" role="tab" data-tab="beads">Beads</button>
      </div>
      <div id="controls"></div>
    </section>
  </div>
</main>
<script>
"use strict";
const BEADS={
  white:["White","#F4F4F1"],lgrey:["Light Grey","#C2C6C9"],grey:["Grey","#8C9195"],dgrey:["Dark Grey","#50555A"],black:["Black","#262729"],
  coral:["Hot Coral","#F2625D"],red:["Red","#C42F37"],cran:["Cranapple","#7B2430"],
  cheddar:["Cheddar","#F6A83A"],orange:["Orange","#E5622A"],rust:["Rust","#9A4529"],
  pyellow:["Pastel Yellow","#F6EB9B"],yellow:["Yellow","#F4CC2D"],butter:["Butterscotch","#C2863A"],
  kiwi:["Kiwi Lime","#A2D04A"],bgreen:["Bright Green","#39A74C"],dgreen:["Dark Green","#1E6338"],
  tooth:["Toothpaste","#ADE3D9"],turq:["Turquoise","#23AEAB"],parrot:["Parrot Green","#12796E"],
  pblue:["Pastel Blue","#9CC7EB"],lblue:["Light Blue","#3D8ED2"],dblue:["Dark Blue","#243E87"],
  lav:["Pastel Lavender","#BAA5DA"],purple:["Purple","#7545A2"],plum:["Plum","#4C2665"],
  lpink:["Light Pink","#F6C5D3"],bubble:["Bubblegum","#E96BA2"],magenta:["Magenta","#AE2777"],
  sand:["Sand","#DCBD8E"],lbrown:["Light Brown","#9B693F"],brown:["Brown","#553625"]
};
// Each family is [top / light, left / mid, right / dark]
const FAM={
  red:{n:"Red",b:["coral","red","cran"]},
  orange:{n:"Orange",b:["cheddar","orange","rust"]},
  yellow:{n:"Yellow",b:["pyellow","yellow","butter"]},
  green:{n:"Green",b:["kiwi","bgreen","dgreen"]},
  teal:{n:"Teal",b:["tooth","turq","parrot"]},
  blue:{n:"Blue",b:["pblue","lblue","dblue"]},
  purple:{n:"Purple",b:["lav","purple","plum"]},
  pink:{n:"Pink",b:["lpink","bubble","magenta"]},
  brown:{n:"Brown",b:["sand","lbrown","brown"]},
  greyL:{n:"Pale greys",b:["white","lgrey","grey"]},
  greyM:{n:"Mid greys",b:["lgrey","grey","dgrey"]},
  greyD:{n:"Dark greys",b:["grey","dgrey","black"]}
};
const MOODS={
  Halloween:["orange","purple","greyD","green"],
  Ocean:["teal","blue","greyL"],
  Sunset:["yellow","orange","red","pink","purple"],
  Forest:["green","brown","yellow","teal"],
  Candy:["pink","purple","teal","yellow"],
  Concrete:["greyL","greyM","greyD","blue"]
};
const SCHEMES={grey:["greyL","greyM","greyD"],rainbow:["red","orange","yellow","green","blue","purple"]};
const CW=15,CH=13,VS=6;
const CUTS={
  bat:[".....X...X.....","X....XXXXX....X","XX..XXXXXXX..XX","XXXXXXXXXXXXXXX",".XXXXXXXXXXXXX.","..XX.XXXXX.XX..","...X..XXX..X..."],
  heart:[".XX...XX.","XXXX.XXXX","XXXXXXXXX","XXXXXXXXX",".XXXXXXX.","..XXXXX..","...XXX...","....X...."],
  star:["....X....","....X....","...XXX...","XXXXXXXXX",".XXXXXXX.","..XXXXX..","..XXXXX..",".XX...XX.","X.......X"],
  ghost:["...XXX...",".XXXXXXX.","XXXXXXXXX","XX.XXX.XX","XX.XXX.XX","XXXXXXXXX","XXXXXXXXX","XXXXXXXXX","XXXXXXXXX","X.XX.XX.X"],
  blank:[]
};
const CUTP=[["bat","Bat"],["heart","Heart"],["star","Star"],["ghost","Ghost"],["blank","Blank"]];
const VOXP=[["cube","Cube"],["cube2","Big cube"],["stairs","Stairs"],["lblock","L-block"],["pyramid","Pyramid"],["arch","Arch"],["frame","Frame"],["penrose","Impossible triangle"],["blank","Blank"]];
const BGS=["white","lgrey","dgrey","black","dblue","plum","pyellow"];

function bitmapFrom(rows){
  const g=Array.from({length:CH},()=>Array(CW).fill(0));
  rows.forEach((r,y)=>[...r].forEach((ch,x)=>{if(ch==="X"&&y<CH&&x<CW)g[y][x]=1;}));
  return g;
}
function vp(name){
  const out=[];const add=(x,y,z)=>out.push(x+","+y+","+z);
  const box=(a,b,c)=>{for(let x=0;x<a;x++)for(let y=0;y<b;y++)for(let z=0;z<c;z++)add(x,y,z);};
  switch(name){
    case "cube":add(0,0,0);break;
    case "cube2":box(2,2,2);break;
    case "stairs":for(let x=0;x<3;x++)for(let y=0;y<2;y++)for(let z=0;z<=x;z++)add(x,y,z);break;
    case "lblock":add(0,0,0);add(1,0,0);add(2,0,0);add(0,0,1);add(0,0,2);break;
    case "pyramid":box(3,3,1);add(1,1,1);break;
    case "arch":for(let y=0;y<2;y++){add(0,y,0);add(0,y,1);add(2,y,0);add(2,y,1);add(0,y,2);add(1,y,2);add(2,y,2);}break;
    case "frame":for(let x=0;x<3;x++)for(let y=0;y<3;y++)for(let z=0;z<3;z++){if([x,y,z].filter(v=>v!==1).length>=2)add(x,y,z);}break;
    case "penrose":for(let x=0;x<6;x++)add(x,0,0);for(let y=1;y<6;y++)add(5,y,0);for(let z=1;z<5;z++)add(5,5,z);break;
    default:break;
  }
  return out;
}
function defaults(){
  return {
    size:29,view:"single",tab:"shapes",mode:"shapes",active:0,tapMode:"move",
    slots:[
      {kind:"vox",vox:vp("cube"),preset:"cube",scale:4,layer:0,bmp:bitmapFrom(CUTS.bat),cpreset:"bat",depth:2,dir:1,family:"blue",pos:[.5,.5],enabled:true,touched:true},
      {kind:"cut",vox:vp("stairs"),preset:"stairs",scale:3,layer:0,bmp:bitmapFrom(CUTS.bat),cpreset:"bat",depth:2,dir:1,family:"purple",pos:[.62,.78],enabled:false,touched:false}
    ],
    tile:{pattern:"A",spacing:"iso",h:8,v:6,shift:4,ox:0,oy:0,colour:"grey",spread:"diag",moods:MOODS.Halloween.slice(),moodName:"Halloween",seed:1,bg:null},
    terrain:{seed:4127,scale:2,height:6,rough:1,water:2,colour:"land",bg:null},
    truchet:{seed:2026,style:"arcs",tile:8,width:1,colour:"one",family:"teal",bg:"dgrey",shadow:true,flips:{}},
    fields:{effect:"pyramid",metric:"square",layout:"lattice",cell:10,ring:1,colour:"rainbow",family:"blue",by:"ring",flip:false,grout:true,bg:"black",seed:77,layers:5,rough:1},
    lab:{active:"opart-bulge",params:{},colour:"grey",family:"greyL",bg:null},
    board:{lattice:"square",outline:"square",n:29,w:29,h:58,d:29,side:16,hw:24,hh:20,hd:29}
  };
}
const KEY="pegiso.v1";
let state=defaults();
try{
  const raw=localStorage.getItem(KEY);
  if(raw){const s=JSON.parse(raw);if(s&&Array.isArray(s.slots)&&s.slots.length===2&&s.tile){const d=defaults();state=Object.assign(d,s,{tile:Object.assign(d.tile,s.tile),terrain:Object.assign(d.terrain,s.terrain||{}),truchet:Object.assign(d.truchet,s.truchet||{}),fields:Object.assign(d.fields,s.fields||{}),lab:Object.assign(d.lab,s.lab||{}),board:Object.assign(d.board,{n:s.size||29},s.board||{})});}}
}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}

/* ---------- geometry ---------- */
function normalize(cells){
  if(!cells.size)return{w:0,h:0,cells:[]};
  let mx=Infinity,my=Infinity,Mx=-Infinity,My=-Infinity;const arr=[];
  cells.forEach((r,k)=>{const [x,y]=k.split(",").map(Number);arr.push([x,y,r]);mx=Math.min(mx,x);my=Math.min(my,y);Mx=Math.max(Mx,x);My=Math.max(My,y);});
  return{w:Mx-mx+1,h:My-my+1,cells:arr.map(([x,y,r])=>[x-mx,y-my,r])};
}
function inside(poly,x,y){
  let pos=false,neg=false;
  for(let i=0;i<poly.length;i++){
    const a=poly[i],b=poly[(i+1)%poly.length];
    const c=(b[0]-a[0])*(y-a[1])-(b[1]-a[1])*(x-a[0]);
    if(c>0)pos=true;else if(c<0)neg=true;
    if(pos&&neg)return false;
  }
  return true;
}
// Block (x,y,z) projects to column s*(x-y), row s*(x+y)/2 - s*z. Draw order x+y+z = painter's algorithm.
// Quarter turns about the vertical axis: (x, y) -> (-y, x)
function turn(x,y,r){for(let i=0;i<r;i++){const t=x;x=-y;y=t;}return[x,y];}
function voxSprite(keys,s,rot){return voxRaster(keys.map(k=>{const [x,y,z]=k.split(",").map(Number);const [a,b]=turn(x,y,rot||0);return[a,b,z];}),s,null);}
// vox items are [x,y,z,family?]; with families the cells hold bead ids, otherwise face roles 0/1/2
function voxRaster(list,s,withFam){
  const vox=list.slice().sort((a,b)=>(a[0]+a[1]+a[2])-(b[0]+b[1]+b[2])||a[2]-b[2]);
  const P=(X,Y,Z)=>[s*(X-Y),s*(X+Y)/2-s*Z];
  const cells=new Map();
  for(const [x,y,z,f] of vox){
    const faces=[
      [0,[P(x,y,z+1),P(x+1,y,z+1),P(x+1,y+1,z+1),P(x,y+1,z+1)]],
      [1,[P(x,y+1,z+1),P(x+1,y+1,z+1),P(x+1,y+1,z),P(x,y+1,z)]],
      [2,[P(x+1,y,z+1),P(x+1,y+1,z+1),P(x+1,y+1,z),P(x+1,y,z)]]
    ];
    for(const [role,poly] of faces){
      const xs=poly.map(p=>p[0]),ys=poly.map(p=>p[1]);
      const x0=Math.floor(Math.min(...xs)),x1=Math.ceil(Math.max(...xs)),y0=Math.floor(Math.min(...ys)),y1=Math.ceil(Math.max(...ys));
      for(let py=y0;py<y1;py++)for(let px=x0;px<x1;px++){if(inside(poly,px+.5,py+.5))cells.set(px+","+py,withFam?FAM[f].b[role]:role);}
    }
  }
  return normalize(cells);
}
function cutSprite(bmp,depth,dir){
  const pts=[];bmp.forEach((row,y)=>row.forEach((v,x)=>{if(v)pts.push([x,y]);}));
  const cells=new Map();
  for(let i=depth;i>=1;i--){const role=i===1?1:2;for(const [x,y] of pts)cells.set((x+dir*i)+","+(y+i),role);}
  for(const [x,y] of pts)cells.set(x+","+y,0);
  return normalize(cells);
}
function sprites(){return state.slots.map(sl=>sl.kind==="vox"?voxSprite(sl.vox,sl.scale,sl.rot):cutSprite(sl.bmp,sl.depth,sl.dir));}
function usesB(){return state.slots[1].enabled&&state.tile.pattern!=="A";}
function applySpacing(sp){
  const t=state.tile;if(t.spacing==="custom")return;
  const list=usesB()?[sp[0],sp[1]]:[sp[0]];
  const W=Math.max(1,...list.map(s=>s.w)),H=Math.max(1,...list.map(s=>s.h));
  if(t.spacing==="iso"){if(isHex()){t.h=Math.max(1,W-1);t.v=Math.max(1,Math.floor(.75*(H-1)));t.shift=Math.round((W-1)/2);}else{t.h=W;t.v=Math.max(1,Math.round(H*.75));t.shift=Math.round(W/2);}}
  else{t.h=W+1;t.v=H+1;t.shift=0;}
}
function hash(i,j,s){let h=Math.imul((i*73856093)^(j*19349663)^(s*83492791),2654435761);h^=h>>>15;h=Math.imul(h,2246822519);h^=h>>>13;return h>>>0;}
function famFor(i,j,slot){
  const t=state.tile;
  if(t.colour==="shape")return state.slots[slot].family;
  const L=t.colour==="mood"?(t.moods.length?t.moods:["greyM"]):SCHEMES[t.colour];
  let k;
  switch(t.spread){
    case "same":k=slot;break;case "rows":k=j;break;case "cols":k=i;break;
    case "diag":k=i+j;break;case "checker":k=(i+j)&1;break;default:k=hash(i,j,t.seed);
  }
  return L[((k%L.length)+L.length)%L.length];
}
/* ---------- seeded generators ---------- */
const rnd=(i,j,s)=>hash(i,j,s)/4294967296;
function vnoise(x,y,s){
  const i=Math.floor(x),j=Math.floor(y),fx=x-i,fy=y-j,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);
  const a=rnd(i,j,s),b=rnd(i+1,j,s),c=rnd(i,j+1,s),d=rnd(i+1,j+1,s);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
}

  for(let y=0;y<G;y++)for(let x=0;x<G;x++)vals.push(fbm(x*f+.5,y*f+.5,T.seed));

function hexTerrain(H){

// Hex faces, named by where they sit around a ring: R, UR, UL, L, DL, DR
function hexLight(da,db,kind){
  const A=Math.abs(da),Bb=Math.abs(db),C=Math.abs(da-db),m=Math.max(A,Bb,C);if(!m)return 0;
  const face=A===m?(da>0?"R":"L"):Bb===m?(db>0?"UR":"DL"):(da-db>0?"DR":"UL");
  if(kind==="pyramid")return face==="UL"||face==="UR"?0:face==="L"||face==="R"?1:2;
  return face==="UL"||face==="UR"||face==="L"?0:2;
}
function hexFields(H){
  const F=state.fields,list=famList(F.colour,F.family),L=list.length,ramp=rampOf(list),g=new Array(H.pegs.length).fill(F.bg||null);
  if(F.effect==="atmos"){
    const n=F.layers,fr=[.07,.12,.2][F.rough],span=H.maxy-H.miny;
    for(let k=0;k<n;k++){let idx=n===1?0:Math.round(k*(ramp.length-1)/(n-1));if(F.flip)idx=ramp.length-1-idx;
      const base=H.miny+span*(.3+.58*k/Math.max(1,n-1)),amp=span*.17;
      for(const q of H.pegs){if(q.y>=base-amp*(fbm((q.x-H.minx)*fr+.3,k*5.17+.3,F.seed)-.5)*2)g[q.i]=ramp[idx];}}
    return g;
  }
  const round=F.metric==="round",single=F.layout==="single",c=H.center,k=Math.max(2,Math.round(F.cell/2));
  const real=(da,db)=>[da*SQ3,da/2-db],dist=(da,db)=>round?Math.hypot(da*SQ3,da/2-db):hexDist(da,db);
  let R=round?k*SQ3:k;
  if(single){R=0;for(const q of H.pegs)R=Math.max(R,dist(q.a-c.a,q.b-c.b));R+=.5;}
  for(const q of H.pegs){
    const pa=q.a-c.a,pb=q.b-c.b;let best=Infinity,second=Infinity,bi=0,bj=0,bda=0,bdb=0;
    const consider=(ca,cb,I,J)=>{const da=pa-ca,db=pb-cb,d=dist(da,db);if(d<best-1e-9){second=best;best=d;bi=I;bj=J;bda=da;bdb=db;}else if(d<second)second=d;};
    if(single)consider(0,0,0,0);
    else{const fi=Math.round((pa+pb)/(3*k)),fj=Math.round((pa-2*pb)/(3*k));for(let x=-1;x<=1;x++)for(let y=-1;y<=1;y++){const I=fi+x,J=fj+y;consider(2*k*I+k*J,k*I-k*J,I,J);}}
    if(!single&&F.grout&&second-best<1e-6){g[q.i]=F.bg||"black";continue;}
    const r=Math.floor(best/F.ring+1e-9),kk=bi+bj;
    const fam=F.by==="ring"?list[r%L]:F.by==="cell"?list[((kk%L)+L)%L]:list[hash(bi,bj,F.seed)%L];
    const light=kind=>round?fieldLight("round",...real(bda,bdb),kind):hexLight(bda,bdb,kind);
    let bead;
    if(F.effect==="rings"){const role=(L===1||F.by!=="ring")?r%3:1;bead=FAM[fam].b[role];}
    else if(F.effect==="pyramid"){let role=light("pyramid");if(F.flip)role=2-role;bead=FAM[fam].b[role];}
    else if(F.effect==="bevel"){const edge=best>=R-F.ring-1e-9;let role=edge?light("bevel"):1;if(edge&&F.flip)role=2-role;bead=FAM[fam].b[role];}
    else{const rr=F.by==="ring"?ramp:FAM[fam].b;let idx=Math.floor(Math.min(best/R,.9999)*rr.length);if(F.flip)idx=rr.length-1-idx;bead=rr[idx];}
    g[q.i]=bead;

}
// Hex Truchet: three arcs per hexagon, centred on alternate corners, radius half an edge
function hexTruchet(H){
  const R=state.truchet,k=Math.max(2,Math.round(R.tile/2)),w=k*[.36,.5,.64][R.width],c=H.center,list=famList(R.colour,R.family),Lx=-.45,Ly=-.89;
  const g=new Array(H.pegs.length).fill(R.bg||null),band=new Uint8Array(H.pegs.length);
  const V=[[0,-1],[SQ3,-.5],[SQ3,.5],[0,1],[-SQ3,.5],[-SQ3,-.5]].map(([x,y])=>[x*k,y*k]);
  for(const q of H.pegs){
    const [I,J,da,db]=hexCellOf(q.a-c.a,q.b-c.b,k),key="h"+I+","+J,o=key in R.flips?R.flips[key]:(hash(I,J,R.seed)&1);
    const fam=FAM[list[hash(I,J,R.seed+7)%list.length]].b,dx=da*SQ3,dy=da/2-db;let role=-1;
    for(let v=o;v<6;v+=2){const ex=dx-V[v][0],ey=dy-V[v][1],d=Math.hypot(ex,ey),u=d-k/2;

function composeHex(){
  const H=hexBoard();
  if(state.mode==="terrain")return hexTerrain(H);
  if(state.mode==="truchet")return hexTruchet(H);
  if(state.mode==="fields")return hexFields(H);
  if(state.mode==="lab")return labGrid(null,H);
  return hexShapes(H);
}
function compose(){
  if(isHex())return composeHex();
  const g=composeSquare(),m=sqMask();
  if(m)for(let i=0;i<g.length;i++)if(!m[i])g[i]=null;
  return g;
}
function composeSquare(){
  const N=state.size;
  if(state.mode==="fields")return fieldsGrid(N);
  if(state.mode==="lab")return labGrid(N);
  if(state.mode==="terrain")return terrainGrid(N);
  if(state.mode==="truchet")return truchetGrid(N);
  const g=new Array(N*N).fill(state.tile.bg||null);
  const sp=sprites();applySpacing(sp);
  const stamp=(s,x0,y0,f)=>{const b=FAM[f].b;for(const [dx,dy,r] of s.cells){const x=x0+dx,y=y0+dy;if(x>=0&&y>=0&&x<N&&y<N)g[y*N+x]=b[r];}};
  if(state.view==="single"){
    const items=[0,1].filter(i=>state.slots[i].enabled).map(i=>{const s=sp[i],p=state.slots[i].pos;return{i,s,x:Math.round(p[0]*N-s.w/2),y:Math.round(p[1]*N-s.h/2)};});
    items.sort((a,b)=>(a.y+a.s.h)-(b.y+b.s.h));
    items.forEach(o=>stamp(o.s,o.x,o.y,state.slots[o.i].family));

    const t=state.tile,H=Math.max(1,t.h),V=Math.max(1,t.v),ub=usesB();
    const ox=((t.ox%H)+H)%H,oy=((t.oy%(2*V))+2*V)%(2*V);
    const mW=Math.max(sp[0].w,ub?sp[1].w:0),mH=Math.max(sp[0].h,ub?sp[1].h:0);
    const i0=-Math.ceil((mW+t.shift+ox)/H)-1,j0=-Math.ceil((mH+oy)/V)-1;

      for(let i=i0;i*H+ox+(odd?t.shift:0)<N;i++){
        let slot=0;
        if(ub)slot=t.pattern==="checker"?(((i+j)%2)+2)%2:(odd?1:0);
        stamp(sp[slot],ox+i*H+(odd?t.shift:0),oy+j*V,famFor(i,j,slot));
      }
    }
  }
  return g;
}

/* ---------- drawing ---------- */
const $=s=>document.querySelector(s);
const cv=$("#board");
let LAY={pad:0,c:1},lastGrid=[],hover=null;
function cssv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function paint(ctx,W,grid,N,mark,mask){
  const pad=W*.02,c=(W-2*pad)/N,board=cssv("--board"),peg=cssv("--peg");
  ctx.fillStyle=board;ctx.fillRect(0,0,W,W);
  ctx.strokeStyle=cssv("--guide");ctx.lineWidth=1;ctx.beginPath();
  for(let k=5;k<N;k+=5){const p=Math.round(pad+k*c)+.5;ctx.moveTo(p,pad);ctx.lineTo(p,W-pad);ctx.moveTo(pad,p);ctx.lineTo(W-pad,p);}
  ctx.stroke();
  if(N>29&&N%29===0){ctx.strokeStyle=cssv("--muted");ctx.lineWidth=2;ctx.beginPath();for(let k=29;k<N;k+=29){const p=pad+k*c;ctx.moveTo(p,pad);ctx.lineTo(p,W-pad);ctx.moveTo(pad,p);ctx.lineTo(W-pad,p);}ctx.stroke();}
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){

    const cx=pad+(x+.5)*c,cy=pad+(y+.5)*c,b=grid[y*N+x];

      if(c>=9){ctx.beginPath();ctx.fillStyle=board;ctx.arc(cx,cy,c*.16,0,Math.PI*2);ctx.fill();}
    }else{ctx.fillStyle=peg;ctx.arc(cx,cy,Math.max(1,c*.13),0,Math.PI*2);ctx.fill();}
  }
  if(mark){ctx.beginPath();ctx.strokeStyle=cssv("--ink");ctx.lineWidth=2;ctx.arc(pad+(mark[0]+.5)*c,pad+(mark[1]+.5)*c,c*.55,0,Math.PI*2);ctx.stroke();}

}
function paintHex(ctx,W,grid,mark){
  const H=hexBoard(),pad=W*.03,bw=H.maxx-H.minx+1,bh=H.maxy-H.miny+1,c=Math.min((W-2*pad)/bw,(W-2*pad)/bh);
  const ox=(W-bw*c)/2+c/2-H.minx*c,oy=(W-bh*c)/2+c/2-H.miny*c,board=cssv("--board"),peg=cssv("--peg");
  ctx.fillStyle=board;ctx.fillRect(0,0,W,W);

    const X=ox+q.x*c,Y=oy+q.y*c,b=grid[q.i];ctx.beginPath();
    if(b){ctx.fillStyle=BEADS[b][1];ctx.arc(X,Y,c*.47,0,Math.PI*2);ctx.fill();if(c>=9){ctx.beginPath();ctx.fillStyle=board;ctx.arc(X,Y,c*.16,0,Math.PI*2);ctx.fill();}}

function draw(){

let raf=0;function schedule(){cancelAnimationFrame(raf);raf=requestAnimationFrame(draw);}
function updateReadout(){

  if(!hover&&state.mode==="fields"){el.textContent=state.fields.effect==="atmos"||state.fields.by==="random"?"Seed "+state.fields.seed:"Tap a peg to read it";return;}
  if(!hover&&state.mode==="lab"){const d=PLUGINS[state.lab.active];el.textContent=d?d.name:"Pick a category";return;}
  if(!hover){el.textContent=state.mode==="terrain"?"Seed "+state.terrain.seed:state.mode==="truchet"?"Seed "+state.truchet.seed+". Tap a tile to turn it":state.view==="single"?"Tap the board to place Shape "+(state.active?"B":"A"):"Tap the board to slide the pattern";return;}

function countBeads(g){const m={};g.forEach(b=>{if(b)m[b]=(m[b]||0)+1;});return Object.entries(m).sort((a,b)=>b[1]-a[1]);}
function updateBeads(){

}
function pegAt(e){

cv.addEventListener("pointermove",e=>{if(e.pointerType!=="mouse")return;const p=pegAt(e);if(p&&hover&&JSON.stringify(p)===JSON.stringify(hover))return;hover=p;schedule();});

  }else{
    h+=`<div class="row"><span class="lab">Start from</span><div class="seg">${CUTP.map(([k,l])=>chip("cpreset",k,l,sl.cpreset===k)).join("")}</div></div>`;
    h+=`<div class="row"><span class="lab">Depth in pegs</span><div class="seg">${[1,2,3,4].map(n=>chip("depth",n,String(n),sl.depth===n)).join("")}</div></div>`;
    h+=`<div class="row"><span class="lab">Extrude toward</span><div class="seg">${chip("dir",1,"Down-right",sl.dir===1)}${chip("dir",-1,"Down-left",sl.dir===-1)}</div></div>`;
    h+=`<div class="row"><span class="lab">Tap or drag to draw the face. Holes let the side show through.</span><div class="editor" id="editor" style="grid-template-columns:repeat(${CW},1fr);max-width:440px"></div><div class="seg" style="margin-top:10px">${action("clearAll","Clear")}</div></div>`;
  }
  h+=`<div class="row"><span class="lab">Colour (top, left, right)</span><div class="seg">${Object.keys(FAM).map(f=>famChip("family",f,sl.family===f)).join("")}</div></div>`;
  h+=`<details><summary>How the 3D mapping works</summary>
  <p>Peg (0, 0) is the top-left, and y counts downward, the same as pixels on a screen.</p>
  <p>A block at (x, y, z) lands at column s × (x − y) and row s × (x + y) ÷ 2 − s × z, where s is the block size. That ÷ 2 is what makes the 2-across, 1-up isometric edges.</p>
  <p>Blocks are drawn in order of x + y + z, so nearer blocks cover farther ones. That ordering is the whole hidden-layer trick, and it’s why the arch and frame read as solid objects with gaps.</p>
  <p>Each face takes one bead from the colour family: light on top, mid on the left, dark on the right, as if lit from the upper left.</p></details>`;
  return h;
}

    h+=`<div class="row"><span class="lab">Change colour by</span><div class="seg">${chip("fby","ring","Ring",F.by==="ring")}${chip("fby","cell","Cell, diagonally",F.by==="cell")}${chip("fby","random","Cell, randomly",F.by==="random")}</div></div>`;

function fillEditor(){
  const ed=$("#editor");if(!ed)return;
  const sl=cur(),vox=sl.kind==="vox",cols=vox?VS:CW,rows=vox?VS:CH,set=vox?new Set(sl.vox):null;

  let h="";
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    const isOn=vox?set.has(x+","+y+","+sl.layer):!!sl.bmp[y][x];
    const below=vox&&!isOn&&sl.layer>0&&set.has(x+","+y+","+(sl.layer-1));
    h+=`<button type="button" class="c${below?" below":""}" data-x="${x}" data-y="${y}" aria-label="x ${x}, y ${y}${isOn?", filled":""}" aria-pressed="${isOn}"${isOn?` style="background:${on}"`:""}></button>`;
  }
  ed.innerHTML=h;
}
function setCell(x,y,val){
  const sl=cur();
  if(sl.kind==="vox"){
    const k=x+","+y+","+sl.layer,has=sl.vox.includes(k);
    if(val&&!has)sl.vox.push(k);else if(!val&&has)sl.vox=sl.vox.filter(v=>v!==k);else return;
    sl.preset=null;
  }else{
    if(!!sl.bmp[y][x]===val)return;
    sl.bmp[y][x]=val?1:0;sl.cpreset=null;
  }
  fillEditor();schedule();
}
let painting=null;
const controls=$("#controls");
controls.addEventListener("pointerdown",e=>{
  const c=e.target.closest(".editor .c");if(!c)return;
  e.preventDefault();
  const x=+c.dataset.x,y=+c.dataset.y,sl=cur();
  const isOn=sl.kind==="vox"?sl.vox.includes(x+","+y+","+sl.layer):!!sl.bmp[y][x];
  painting=!isOn;setCell(x,y,painting);
});
window.addEventListener("pointermove",e=>{
  if(painting===null)return;
  const el=document.elementFromPoint(e.clientX,e.clientY);
  const c=el&&el.closest?el.closest(".editor .c"):null;
  if(c)setCell(+c.dataset.x,+c.dataset.y,painting);
});
window.addEventListener("pointerup",()=>{if(painting!==null){painting=null;save();renderLayerDots();}});

function renderLayerDots(){if(state.tab==="shapes"&&cur().kind==="vox"){const y=window.scrollY;renderPanel();window.scrollTo(0,y);}}

function handle(act,val){
  const sl=cur(),t=state.tile;
  switch(act){
    case "tapMode":state.tapMode=val;break;
    case "size":state.size=+val;state.board.n=+val;hover=null;break;
    case "blat":{const B=state.board;B.lattice=val;if(val==="hex"&&B.outline==="square")B.outline="hex";if(val==="square"&&B.outline==="hex")B.outline="square";syncSize();hover=null;break;}
    case "bout":state.board.outline=val;syncSize();hover=null;break;
    case "slot":state.active=+val;if(+val===1&&!state.slots[1].touched){state.slots[1].enabled=true;state.slots[1].touched=true;}break;
    case "kind":sl.kind=val;break;
    case "vpreset":sl.vox=vp(val);sl.preset=val;sl.layer=0;if(val==="penrose")sl.scale=2;break;
    case "scale":sl.scale=+val;break;
    case "rot":sl.rot=+val;break;
    case "trot":state.terrain.rot=+val;break;
    case "layer":sl.layer=+val;break;
    case "clearLayer":sl.vox=sl.vox.filter(k=>!k.endsWith(","+sl.layer));sl.preset=null;break;
    case "clearAll":if(sl.kind==="vox"){sl.vox=[];sl.preset="blank";sl.layer=0;}else{sl.bmp=bitmapFrom([]);sl.cpreset="blank";}break;
    case "cpreset":sl.bmp=bitmapFrom(CUTS[val]);sl.cpreset=val;break;
    case "depth":sl.depth=+val;break;
    case "dir":sl.dir=+val;break;
    case "family":sl.family=val;break;
    case "pattern":t.pattern=val;if(val!=="A"){state.slots[1].enabled=true;state.slots[1].touched=true;}break;
    case "spacing":t.spacing=val;break;
    case "colour":t.colour=val;break;
    case "mood":t.moods=MOODS[val].slice();t.moodName=val;break;
    case "moodfam":t.moods=t.moods.includes(val)?t.moods.filter(f=>f!==val):t.moods.concat(val);t.moodName=null;break;
    case "spread":t.spread=val;break;
    case "newSeed":{const n=Math.floor(Math.random()*1000000);if(val==="fields")state.fields.seed=n;else if(val==="lab"){const d=PLUGINS[state.lab.active];if(d)labParams(d).seed=n;}else if(val==="terrain")state.terrain.seed=n;else if(val==="truchet"){state.truchet.seed=n;state.truchet.flips={};}else t.seed=n;break;}
    case "tscale":state.terrain.scale=+val;break;
    case "feffect":state.fields.effect=val;break;
    case "fmetric":state.fields.metric=val;break;
    case "flayout":state.fields.layout=val;break;
    case "fring":state.fields.ring=+val;break;
    case "fby":state.fields.by=val;break;
    case "frough":state.fields.rough=+val;break;
    case "fcolour":state.fields.colour=val;break;
    case "ffamily":state.fields.family=val;break;
    case "fbg":state.fields.bg=val==="none"?null:val;break;
    case "lcat":state.lab.active=val;break;
    case "lcolour":state.lab.colour=val;break;
    case "lfamily":state.lab.family=val;break;
    case "lbg":state.lab.bg=val==="none"?null:val;break;
    case "lpc":{const d=PLUGINS[state.lab.active];if(d){const [k,v]=val.split("|");labParams(d)[k]=v;}break;}
    case "lremove":{const id=state.lab.active;if(!BUILTIN.has(id)){delete PLUGINS[id];removeSaved(id);state.lab.active=Object.keys(PLUGINS)[0]||null;}break;}
    case "trough":state.terrain.rough=+val;break;

$("#tabs").addEventListener("click",e=>{

const out=$("#out");
$("#snapBtn").addEventListener("click",()=>{
  const N=state.size,W=isHex()?1100:Math.min(1600,N*26),c=document.createElement("canvas");c.width=W;c.height=W;
  if(isHex())paintHex(c.getContext("2d"),W,lastGrid,null);else paint(c.getContext("2d"),W,lastGrid,N,null,sqMask());
  out.innerHTML=`<p class="cap">Press and hold (or right-click) the image to save it.</p><img alt="Snapshot of the bead pattern" src="${c.toDataURL("image/png")}"><div class="actions"><button type="button" class="btn" id="closeOut">Close</button></div>`;
  $("#closeOut").onclick=()=>{out.innerHTML="";};
});
function patternText(){
  const N=state.size,g=lastGrid,counts=countBeads(g),letters="ABCDEFGHJKLMNPQRSTUVWXYZabdefghjkmnpqrstuvwxyz",map={};
  counts.forEach(([b],i)=>{map[b]=letters[i]||"?";});
  if(isHex()){
    const H=hexBoard(),rows=new Map();H.pegs.forEach(q=>{const k=Math.round(q.y*2);if(!rows.has(k))rows.set(k,new Map());rows.get(k).set(q.a,q);});
    let t="Pegboard Iso Lab, "+boardLabel()+". Each line is half a peg lower than the one above, and each character is one column; a dot is an empty peg.\n\n";
    [...rows.keys()].sort((x,y)=>x-y).forEach(k=>{const by=rows.get(k);let line="";for(let a=H.mina;a<=H.maxa;a++){const q=by.get(a);line+=q?(g[q.i]?map[g[q.i]]:"."):" ";}t+=line.replace(/\s+$/,"")+"\n";});
    return t+"\n"+counts.map(([b,n])=>map[b]+" = "+BEADS[b][0]+" ("+n+")").join("\n");
  }
  let s="Pegboard Iso Lab, "+N+"×"+N+". Row 0 is the top; a dot is an empty peg.\n\n";
  for(let y=0;y<N;y++){s+=String(y).padStart(2," ")+"  "+g.slice(y*N,y*N+N).map(b=>b?map[b]:".").join(" ")+"\n";}
  s+="\n"+counts.map(([b,n])=>map[b]+" = "+BEADS[b][0]+" ("+n+")").join("\n");
  return s;
}
$("#textBtn").addEventListener("click",()=>{
  const txt=patternText();
  out.innerHTML=`<p class="cap" id="copyCap">Pattern as text, one letter per peg.</p><textarea readonly aria-label="Pattern as text"></textarea><div class="actions"><button type="button" class="btn" id="copyOut">Copy</button><button type="button" class="btn" id="closeOut">Close</button></div>`;
  const ta=out.querySelector("textarea");ta.value=txt;
  $("#closeOut").onclick=()=>{out.innerHTML="";};
  $("#copyOut").onclick=()=>{
    const done=()=>{$("#copyCap").textContent="Copied.";};
    const fallback=()=>{ta.focus();ta.select();try{document.execCommand("copy");done();}catch(e){$("#copyCap").textContent="Select the text and copy it.";}};
    try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,fallback);else fallback();}catch(e){fallback();}
  };
});

const PKEY="pegiso.plugins";
function savedPlugins(){try{return JSON.parse(localStorage.getItem(PKEY)||"{}")||{};}catch(e){return{};}}
function removeSaved(id){try{const m=savedPlugins();delete m[id];localStorage.setItem(PKEY,JSON.stringify(m));}catch(e){}}
function inject(src){
  lastRegistered=null;let err=null;
  const onErr=ev=>{err=ev.message||"The code has an error.";ev.preventDefault&&ev.preventDefault();};
  window.addEventListener("error",onErr);
  try{const el=document.createElement("script");el.textContent=src;document.head.appendChild(el);el.remove();}catch(e){err=e.message;}
  window.removeEventListener("error",onErr);
  return{id:lastRegistered,err};
}
function installFrom(src){
  const msg=t=>{const m=$("#labMsg");if(m)m.textContent=t;};
  if(!src||!src.trim()){msg("Paste a category first, or press Show template.");return;}
  const r=inject(src);
  if(!r.id){msg(r.err?"Not installed: "+r.err:"Not installed: the code didn’t call PegLab.register. If it did, this page may be blocking imported code; add the category in Code instead.");return;}
  if(BUILTIN.has(r.id)){msg("Not installed: "+r.id+" is a built-in category. Give yours a different id.");return;}
  try{const m=savedPlugins();m[r.id]=src;localStorage.setItem(PKEY,JSON.stringify(m));}catch(e){}
  state.lab.active=r.id;state.labOpen=false;save();renderPanel();draw();
  msg("Installed "+PLUGINS[r.id].name+".");
}
// Built-in example, written with the same API an imported category uses
PegLab.register({
  id:"opart-bulge",name:"Op-art bulge",family:"Line fields",
  description:"Stripes magnified around a hidden sphere, so the middle seems to swell toward you.",
  params:[
    {key:"width",label:"Stripe width",type:"range",min:1,max:4,value:2},
    {key:"strength",label:"Bulge",type:"range",min:0,max:12,value:5},
    {key:"size",label:"Bulge size",type:"range",min:3,max:24,value:10},
    {key:"dir",label:"Stripes",type:"choice",value:"h",options:[["h","Horizontal"],["v","Vertical"],["rings","Rings"],["check","Checks"]]}
  ],
  generate(ctx){
    const {p}=ctx,B=ctx.bounds,cx=(B.minx+B.maxx)/2,cy=(B.miny+B.maxy)/2,f=ctx.colours,a=ctx.bead(f[0],0),b=ctx.bead(f[f.length-1],2);
    for(const q of ctx.pegs){
      const dx=q.x-cx,dy=q.y-cy,m=1+p.strength/4*Math.exp(-(dx*dx+dy*dy)/(p.size*p.size));
      const band=t=>Math.floor(t/m/p.width+1000)%2;
      const on=p.dir==="h"?band(dy):p.dir==="v"?band(dx):p.dir==="rings"?band(Math.hypot(dx,dy)):band(dx)^band(dy);
      ctx.setPeg(q.i,on?a:b);
    }
  }
});
BUILTIN.add("opart-bulge");

try{window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);}catch(e){}
