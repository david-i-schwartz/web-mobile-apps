# Audit: the deterministic checks every change must pass before the site updates.
# Every action is pinned to a full commit SHA (the version is in the comment) and every tool to an exact version.
# Dependabot (.github/dependabot.yml) proposes updates after a 7-day wait.
name: audit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  site:
    name: Site in step, phones, house rules
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install Playwright and Chromium
        run: |
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Built folders match src/, site.json and tools/
        run: |
          node tools/cli.js site site.json .
          git status --short
          git diff --quiet && test -z "$(git status --porcelain)"
      - name: Phone and tablet checks
        run: python3 tools/tests/phones.py .
      - name: House rules (Pegboard Iso Lab)
        run: python3 tools/tests/house_rules.py . iso-lab

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript,python
          build-mode: none
          config: |
            paths:
              - src
              - tools
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

  secrets-and-workflows:
    name: Gitleaks and zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.24"
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install Gitleaks and zizmor
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          python -m pip install zizmor==1.32.0
      - name: Gitleaks (secrets in the full history)
        run: ~/go/bin/gitleaks git --redact --verbose .
      - name: zizmor (workflow security)
        run: zizmor --offline .
