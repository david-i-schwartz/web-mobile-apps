<!--
  Miko Finds Hazel — v0.4, 2026-11-27
  A cosy castle game: Miko the cat climbs an old castle to find Hazel, another cat.
  Game idea by Sam, Beth and Dave. Inspired by the feel of an old NES castle game they loved
  (Milon's Secret Castle, Hudson Soft, 1986). No code, pictures, sounds, music or levels come
  from that game or any other: every picture is drawn and every sound is made by this file.

<style>
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);

--pad:rgba(34,29,44,.9);--padInk:#f3ecfa;--padLine:rgba(243,236,250,.45);--bg:#16131f;--jump:#d99a12;--act:#4f86b8}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{position:fixed;inset:0;font:17px/1.45 var(--font);color:var(--ink)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid #2563eb;outline-offset:2px}
@media (prefers-color-scheme:dark){:focus-visible{outline-color:#93c5fd}}
.hide{visibility:hidden}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:0}

#hud{position:fixed;left:0;right:0;top:0;z-index:3;display:flex;align-items:center;gap:8px;max-width:640px;margin:0 auto;
padding:calc(8px + var(--sat)) calc(10px + var(--sar)) 6px calc(10px + var(--sal))}
.ib{flex:none;width:48px;height:48px;border-radius:15px;border:2px solid var(--padLine);background:var(--pad);color:var(--padInk);display:grid;place-items:center;padding:0}
#stats{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;background:var(--pad);border:2px solid var(--padLine);border-radius:15px;min-height:48px;padding:4px 8px;color:var(--padInk);font-weight:800;font-size:16px;line-height:1}
#hearts{display:flex;gap:1px;flex-wrap:wrap;max-width:118px}
#hearts svg{width:15px;height:15px}
.st{display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.st svg{width:20px;height:20px;flex:none}
#sKey[hidden],#sBell[hidden]{display:none}
.ib svg{display:block}

/* touch controls: a thumbstick that stays put in the bottom-left corner, and round buttons on the right */
#touch{position:fixed;inset:0;pointer-events:none;z-index:3;display:none}
body.touch.playing #touch{display:block}
#joyZone{position:absolute;left:0;bottom:0;width:min(50%,250px);height:calc(230px + var(--sab));pointer-events:auto;touch-action:none}
.joy{position:absolute;border-radius:50%;pointer-events:none}
#joyBase{width:124px;height:124px;margin:-62px 0 0 -62px;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.45);box-shadow:0 0 0 1px rgba(0,0,0,.18)}
#joyBase::before,#joyBase::after{content:"";position:absolute;top:50%;width:14px;height:14px;margin-top:-7px;border:solid rgba(255,255,255,.75);border-width:0 0 4px 4px;border-radius:2px}
#joyBase::before{left:14px;transform:rotate(45deg)}
#joyBase::after{right:14px;transform:rotate(-135deg)}
#joyKnob{width:58px;height:58px;margin:-29px 0 0 -29px;background:rgba(255,255,255,.6);border:2px solid rgba(42,35,56,.35);box-shadow:0 2px 10px rgba(0,0,0,.3)}
#joyZone.idle .joy{opacity:.6}
.tb{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;
font-weight:900;font-size:17px;line-height:1.05;box-shadow:0 4px 14px rgba(0,0,0,.35)}
#bJ{right:calc(16px + var(--sar));bottom:calc(26px + var(--sab));width:100px;height:100px;background:rgba(251,191,36,.92);color:#2a2338;border:3px solid rgba(255,255,255,.75);font-size:19px}
#bA{right:calc(126px + var(--sar));bottom:calc(14px + var(--sab));width:80px;height:80px;background:rgba(165,216,255,.92);color:#10233a;border:3px solid rgba(255,255,255,.7)}
.tb.down{transform:scale(.92);filter:brightness(1.15)}
#hint,#talk{position:fixed;left:0;right:0;z-index:4;margin:0 auto;max-width:520px;padding:0 calc(10px + var(--sar)) 0 calc(10px + var(--sal));pointer-events:none}
#hint[hidden],#talk[hidden]{display:none}
.bub{background:var(--panel);color:var(--ink);border:2px solid var(--padLine);border-radius:18px;padding:10px 14px;box-shadow:0 8px 24px rgba(0,0,0,.35);font-size:17px;line-height:1.35}

#talkWho{font-weight:900;color:var(--accent);margin:0}

#toast.on{opacity:1}
#toast small{display:block;font-size:16px;font-weight:800}

#overlay{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;
padding:calc(12px + var(--sat)) calc(14px + var(--sar)) calc(12px + var(--sab)) calc(14px + var(--sal));pointer-events:none}
#overlay[hidden]{display:none}
#overlay.low{align-items:flex-end}
.panel{pointer-events:auto;background:var(--panel);color:var(--ink);border-radius:22px;width:100%;max-width:470px;max-height:100%;overflow:auto;-webkit-overflow-scrolling:touch;
touch-action:pan-y;padding:20px 18px 16px;box-shadow:0 22px 60px rgba(0,0,0,.5);outline:none;-webkit-user-select:text;user-select:text}

p{margin:0 0 12px}
.lead{font-size:18px}

.row{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 12px}
.b{flex:1 1 140px;min-height:52px;border-radius:16px;border:2px solid var(--btn);background:transparent;color:var(--ink);font-weight:800;font-size:18px;padding:8px 14px}

details{border-top:1px solid var(--line)}

details>div{padding:0 0 8px}
ul{margin:0 0 12px;padding-left:22px}
li{margin:0 0 7px}
.coats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:0 0 12px}
.coat{min-height:48px;border-radius:14px;border:2px solid var(--line);background:transparent;display:flex;align-items:center;gap:8px;padding:6px 10px;text-align:left;font-weight:700;font-size:16px}
.coat[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.sw{width:26px;height:26px;border-radius:50%;flex:none;border:2px solid rgba(0,0,0,.35)}
#prev{display:block;width:100%;max-width:300px;height:96px;margin:4px auto 10px;border-radius:14px}
.shop{list-style:none;padding:0;margin:0 0 12px}

.shop b{display:block}
.shop .b{flex:0 0 auto;min-height:48px;font-size:16px;padding:6px 12px}
.map{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:6px;margin:0 0 12px}
.cell{min-height:44px;border-radius:12px;border:2px solid var(--line);padding:4px 6px;font-size:13px;line-height:1.2;font-weight:700;display:flex;flex-direction:column;justify-content:center}

.stats{list-style:none;padding:0;margin:0 0 14px}

.links{list-style:none;padding:0;margin:0 0 12px}

#rot[hidden]{display:none}

<canvas id="c" role="img" aria-label="Miko the cat in a castle."></canvas>

<div id="hud" class="hide">
  <button class="ib" id="bP" aria-label="Pause"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="4" y="3" width="5" height="16" rx="1.5" fill="currentColor"/><rect x="13" y="3" width="5" height="16" rx="1.5" fill="currentColor"/></svg></button>
  <div id="stats">
    <span id="hearts" role="img" aria-label="Hearts"></span>
    <span class="st" id="sBell" hidden role="img" aria-label="Bell collar on"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3c-3 0-5 2.4-5 5.6V12l-1.5 2h13L15 12V8.6C15 5.4 13 3 10 3Z" fill="#f2c230" stroke="#7a5a10" stroke-width="1.4"/><circle cx="10" cy="15.5" r="1.8" fill="#7a5a10"/></svg></span>
    <span class="st" role="img" id="sFish" aria-label="Fish: 0"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2.5 10c2.6-4 8-5 12-1.6L18 6v8l-3.5-2.4C10.5 15 5.1 14 2.5 10Z" fill="#7fb6d9" stroke="#2c4a63" stroke-width="1.3" stroke-linejoin="round"/><circle cx="6.6" cy="9.2" r="1" fill="#2c4a63"/></svg><span id="nFish">0</span></span>
    <span class="st" role="img" id="sPie" aria-label="Pies: 0 of 10"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2.5 11h15l-1.6 4.5H4.1Z" fill="#b9b2c2" stroke="#4a4256" stroke-width="1.2" stroke-linejoin="round"/><path d="M2.5 11c0-4 3.4-6 7.5-6s7.5 2 7.5 6Z" fill="#e7a64e" stroke="#8a5420" stroke-width="1.3"/><path d="M6 9.3h8M7.4 7.2l1.4 3.6m3.8-3.6-1.4 3.6" stroke="#8a5420" stroke-width="1.1" stroke-linecap="round"/></svg><span id="nPie">0/10</span></span>
    <span class="st" id="sKey" hidden role="img" aria-label="You have this room's key"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="6" cy="10" r="3.6" fill="none" stroke="#d9a516" stroke-width="2.4"/><path d="M9.5 10H18M15 10v3M17.4 10v2.4" stroke="#d9a516" stroke-width="2.4" stroke-linecap="round"/></svg></span>

<noscript><p style="position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center">This game needs JavaScript. Open it in a web browser.</p></noscript>

<script>
(() => {
'use strict';
/* ---------- engine: rooms, tiles and Miko's movement (no DOM here, so it can be tested) ---------- */
const TS = 16;                       // one tile is 16 units
const PH = {                          // movement, in units per frame at 60 frames a second
  G: 0.36, MAXFALL: 6.4,
  RUN: 1.75, ACC_G: 0.32, DEC_G: 0.42, ACC_A: 0.22,
  JUMP: 6.35, CUT: 2.6, DJUMP: 5.3,
  WSLIDE: 1.25, WJ_V: 6.0, WJ_VX: 2.5, WLOCK: 9, CLIMB: 4.7,
  SPRING: 8.7, COYOTE: 7, BUF: 7,
  W: 12, H: 12
};
// tile codes
const E_ = 0, STONE = 1, SHELF = 2, CRUMB = 3, CUSH = 4, WATER = 5;
const solidCode = c => c === STONE || c === CRUMB || c === CUSH;

/* Map legend (one character per tile):
   #  stone            =  shelf (jump up through it)   c  cushion (bouncy)   ~  water (cats hate it)
   %  cracked block    1 cracked + key   2 cracked + pie   3 cracked + fish   4 cracked + catnip
   5  cracked + surprise   6 cracked + secret door
   D  door   L  locked door (needs this room's key)
   K  key   P  pie   F  fish   N  catnip   ?  sign
   S  start   H  Hazel   R  Pierre   O  Olive the owl
   b  dust bunny   m  toy mouse   g  sheet ghost   v  vacuum bot   j  drip
   t  candle   w  window   y  books   x  picture   u  plant            */
function parseRoom(def) {
  const rows = def.map, h = rows.length, w = rows[0].length;
  const r = { id: def.id, name: def.name, theme: def.theme, w, h, tiles: new Uint8Array(w * h), hold: {}, items: [], doors: [], signs: [],
    foes: [], decor: [], start: null, hazel: null, pierre: null, owl: null, drips: [] };
  let di = 0, si = 0, ii = 0;
  for (let y = 0; y < h; y++) {
    if (rows[y].length !== w) throw new Error(def.id + ' row ' + y + ' is ' + rows[y].length + ' wide, not ' + w);
    for (let x = 0; x < w; x++) {
      const ch = rows[y][x], k = y * w + x;
      const item = kind => r.items.push({ id: ii++, kind, tx: x, ty: y, hidden: false });
      switch (ch) {
        case '#': r.tiles[k] = STONE; break;
        case '=': r.tiles[k] = SHELF; break;
        case 'c': r.tiles[k] = CUSH; break;
        case '~': r.tiles[k] = WATER; break;
        case '%': r.tiles[k] = CRUMB; break;
        case '1': case '2': case '3': case '4': case '5': {
          r.tiles[k] = CRUMB;
          const kind = { 1: 'key', 2: 'pie', 3: 'fish', 4: 'catnip', 5: 'surprise' }[ch];
          r.items.push({ id: ii++, kind, tx: x, ty: y, hidden: true });
          r.hold[k] = r.items.length - 1;
          break;
        }
        case '6': r.tiles[k] = CRUMB; r.doors.push({ id: di++, tx: x, ty: y, kind: 'secret' }); break;
        case 'D': r.doors.push({ id: di++, tx: x, ty: y, kind: 'door' }); break;
        case 'L': r.doors.push({ id: di++, tx: x, ty: y, kind: 'locked' }); break;
        case 'K': item('key'); break;
        case 'P': item('pie'); break;
        case 'F': item('fish'); break;
        case 'N': item('catnip'); break;
        case '?': r.signs.push({ id: si++, tx: x, ty: y }); break;
        case 'S': r.start = { tx: x, ty: y }; break;
        case 'H': r.hazel = { tx: x, ty: y }; break;
        case 'R': r.pierre = { tx: x, ty: y }; break;
        case 'O': r.owl = { tx: x, ty: y }; break;
        case 'b': case 'm': case 'g': case 'v': r.foes.push({ kind: ch, tx: x, ty: y }); break;
        case 'j': r.drips.push({ tx: x, ty: y }); break;
        case 't': case 'w': case 'y': case 'x': case 'u': r.decor.push({ kind: ch, tx: x, ty: y }); break;
        case '.': break;
        default: throw new Error(def.id + ': unknown map letter "' + ch + '" at ' + x + ',' + y);
      }
    }
  }
  (def.doors || []).forEach((d, i) => { if (r.doors[i]) Object.assign(r.doors[i], d); });
  (def.signs || []).forEach((t, i) => { if (r.signs[i]) r.signs[i].text = t; });
  if (r.doors.length !== (def.doors || []).length) throw new Error(def.id + ': ' + r.doors.length + ' doors on the map, ' + (def.doors || []).length + ' listed');
  if (r.signs.length !== (def.signs || []).length) throw new Error(def.id + ': ' + r.signs.length + ' signs on the map, ' + (def.signs || []).length + ' listed');
  return r;
}
function tileAt(r, tx, ty) {
  if (tx < 0 || tx >= r.w) return STONE;
  if (ty < 0) return STONE;
  if (ty >= r.h) return STONE;
  return r.tiles[ty * r.w + tx];
}
function solidAt(r, tx, ty) { return solidCode(tileAt(r, tx, ty)); }
function boxSolid(r, x, y, w, h) {
  const x0 = Math.floor(x / TS), x1 = Math.floor((x + w - 0.001) / TS), y0 = Math.floor(y / TS), y1 = Math.floor((y + h - 0.001) / TS);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) if (solidAt(r, tx, ty)) return true;
  return false;
}
function newMiko(tx, ty) {
  // stands on the floor of tile (tx, ty), centred in it
  return { x: tx * TS + (TS - PH.W) / 2, y: (ty + 1) * TS - PH.H, w: PH.W, h: PH.H, vx: 0, vy: 0, onGround: true, coyote: 0, buf: 0,
    canDouble: true, wall: 0, lock: 0, face: 1, spring: false, lastWall: 0 };
}
/* One frame of movement. inp: {l, r, jump (held), jumpHit (pressed this frame)}. Returns a list of events. */
function stepMiko(m, inp, r) {
  const ev = [];
  // arrows give -1 or 1; a thumb stick gives anything between, and a small push walks slowly
  let ax = (inp.r ? 1 : 0) - (inp.l ? 1 : 0);
  if (typeof inp.ax === 'number' && Math.abs(inp.ax) > Math.abs(ax)) ax = inp.ax;
  const dir = ax > 0.2 ? 1 : ax < -0.2 ? -1 : 0;
  const speed = dir ? PH.RUN * Math.min(1, 0.4 + Math.abs(ax) * 0.75) : 0;
  if (m.lock > 0) m.lock--;
  else {
    if (dir) {
      const acc = m.onGround ? PH.ACC_G : PH.ACC_A;
      m.vx += Math.max(-acc, Math.min(acc, dir * speed - m.vx));
      m.face = dir;
    } else if (m.onGround) {
      m.vx = Math.abs(m.vx) <= PH.DEC_G ? 0 : m.vx - Math.sign(m.vx) * PH.DEC_G;
    } else {
      m.vx *= 0.96;
    }
  }
  if (inp.jumpHit) m.buf = PH.BUF;
  if (m.buf > 0) {
    if (m.onGround || m.coyote > 0) {
      m.vy = -PH.JUMP; m.onGround = false; m.coyote = 0; m.buf = 0; m.spring = false; ev.push('jump');
    } else if (m.wall && dir === m.wall) {      // claws in: climb up the wall
      m.vy = -PH.CLIMB; m.vx = 0; m.canDouble = true; m.buf = 0; m.spring = true; ev.push('climb');
    } else if (m.wall) {                         // spring off the wall
      m.vy = -PH.WJ_V; m.vx = -m.wall * PH.WJ_VX; m.lock = PH.WLOCK; m.face = -m.wall; m.canDouble = true; m.buf = 0; m.spring = false; ev.push('walljump');
    } else if (inp.jumpHit && m.canDouble) {
      m.vy = -PH.DJUMP; m.canDouble = false; m.buf = 0; m.spring = false; ev.push('double');
    } else m.buf--;
  }

    else if (m.vx < 0) m.x = (Math.floor(m.x / TS) + 1) * TS;
    m.vx = 0;

  const prevBottom = m.y + m.h;

    }

    if (boxSolid(r, m.x, m.y, m.w, m.h)) { m.y = (Math.floor(m.y / TS) + 1) * TS; m.vy = 0.5; ev.push('bonk'); }
  }

  m.wall = 0;

/* a calm little tune, made up for this game, played softly in a loop */
const TUNE = {
  bpm: 92,
  // [midi note, beats]; 0 = rest
  mel: [[76, .5], [79, .5], [81, 1], [79, .5], [76, .5], [74, 1], [72, .5], [74, .5], [76, .5], [79, .5], [76, 2],
        [74, .5], [76, .5], [79, 1], [81, .5], [79, .5], [76, 1], [74, .5], [72, .5], [74, .5], [76, .5], [72, 2],
        [81, 1], [84, .5], [81, .5], [79, 1], [76, 1], [79, .5], [81, .5], [79, .5], [76, .5], [74, 2],
        [76, .5], [79, .5], [81, 1], [79, .5], [76, .5], [74, 1], [76, .5], [74, .5], [72, 1], [0, 2]],
  bass: [48, 43, 45, 40, 41, 48, 43, 48]

const music = {
  next: 0, i: 0, bar: 0, beat: 0, on: false,
  tick() {
    if (!A.ctx || !musicOn || document.hidden) return;
    const c = A.ctx, spb = 60 / TUNE.bpm;
    if (this.next < c.currentTime - 0.5) this.next = c.currentTime + 0.05;
    while (this.next < c.currentTime + 0.4) {
      const [n, b] = TUNE.mel[this.i];
      const f = n ? 440 * Math.pow(2, (n - 69) / 12) : 0;
      if (f) this.note(f, b * spb * 0.9, 'triangle', 0.5, this.next);
      if (this.beat % 4 === 0) { const bn = TUNE.bass[this.bar % TUNE.bass.length]; this.note(440 * Math.pow(2, (bn - 69) / 12), spb * 3.6, 'sine', 0.55, this.next); }
      this.beat += b; while (this.beat >= 4) { this.beat -= 4; this.bar++; }
      this.next += b * spb; this.i = (this.i + 1) % TUNE.mel.length;
    }
  },
  note(f, d, type, vol, t) {
    const c = A.ctx, o = c.createOscillator(), gn = c.createGain();
    o.type = type; o.frequency.value = f;
    gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(vol, t + 0.03); gn.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(gn); gn.connect(A.mus); o.start(t); o.stop(t + d + 0.05);
  }
};

function loadRoom(id, doorAt) {
  const def = ROOMS_BY_ID[id];
  R = parseRoom(def);
  const broke = list(SAVE.broke, id), got = list(SAVE.got, id), opened = list(SAVE.opened, id);
  broke.forEach(i => { if (i < R.tiles.length && R.tiles[i] === CRUMB) R.tiles[i] = E_; });
  W = { foes: [], items: [], drops: [], parts: [], shots: [], props: [], pierre: null, owl: null, bonus: null, splat: 0, butterfly: null, startle: 0, mew: 120 };
  R.items.forEach((it, i) => {
    const k = it.ty * R.w + it.tx;
    if (got.includes(it.id)) {
      if (it.kind === 'surprise') { const s = SURPRISES[id + ':' + it.tx + ',' + it.ty]; if (s === 'cucumber' || s === 'box' || s === 'yarn') addProp(s, it.tx, it.ty); }
      return;
    }
    if (it.kind === 'pie' && SAVE.pies.includes(id)) return;
    W.items.push({ ...it, vis: !it.hidden || R.tiles[k] !== CRUMB, pop: 0, bob: hash(i + id.length) * 6.28 });
  });
  R.doors.forEach(d => { d.open = d.kind !== 'locked' || opened.includes(d.id); });
  R.foes.forEach((f, i) => W.foes.push(makeFoe(f, i)));
  R.drips.forEach((d, i) => W.drops.push({ tx: d.tx, ty: d.ty, t: 40 + i * 37, drop: null }));
  if (R.pierre) W.pierre = { x: R.pierre.tx * TS - 5, y: (R.pierre.ty + 1) * TS - 26, w: 22, h: 26, dir: -1, st: SAVE.pierreDone ? 'happy' : pierreMet ? 'walk' : 'wait', t: 0, throws: 0, hp: 3 - SAVE.pierre, wind: 0, talked: false };
  if (R.owl) W.owl = { x: R.owl.tx * TS + 8, y: (R.owl.ty + 1) * TS };
  if (id === 'bonus') W.bonus = { t: 0, on: true, spawn: 0, caught: 0 };
  // where Miko arrives
  let tx, ty;
  const d = doorAt >= 0 ? R.doors[doorAt] : null;
  if (d) { tx = d.tx; ty = d.ty; if (d.kind === 'secret') { const k = d.ty * R.w + d.tx; if (R.tiles[k] === CRUMB) { R.tiles[k] = E_; if (!broke.includes(k)) broke.push(k); } } }
  else { tx = R.start ? R.start.tx : 2; ty = R.start ? R.start.ty : R.h - 3; }
  // the block above a secret door goes too, so the door can be seen
  R.doors.forEach(dd => { if (dd.kind === 'secret' && R.tiles[dd.ty * R.w + dd.tx] !== CRUMB) { const k = (dd.ty - 1) * R.w + dd.tx; if (R.tiles[k] === CRUMB) { R.tiles[k] = E_; if (!broke.includes(k)) broke.push(k); } } });

  M.face = tx > R.w / 2 ? -1 : 1;
  SAVE.room = id; SAVE.door = doorAt;
  if (!SAVE.visited.includes(id)) SAVE.visited.push(id);
  trail = [];
  for (let i = 0; i < 30; i++) trail.push({ x: M.x, y: M.y, face: M.face, pose: 'stand' });
  snapCam();
  cv.setAttribute('aria-label', 'Miko the cat in the ' + R.name.replace(/^The /, '') + '.');
  roomBanner = 150;
  if (W.pierre && SAVE.pierreDone) pierreLoot(false);
  save();
  updateHud();
}
function makeFoe(f, i) {
  const base = { kind: f.kind, i, hx: f.tx * TS, hy: f.ty * TS, vx: 0, vy: 0, dir: i % 2 ? 1 : -1, t: hash(i * 3.1) * 400, stun: 0, gone: false, poof: 0 };
  const size = { b: [12, 11, 0.42], m: [12, 8, 0.95], g: [13, 14, 0], v: [26, 10, 0.62] }[f.kind];
  return Object.assign(base, { w: size[0], h: size[1], sp: size[2], x: f.tx * TS + (TS - size[0]) / 2, y: (f.ty + 1) * TS - size[1] });
}
function addProp(kind, tx, ty) {

  if (kind === 'yarn') { p.w = 9; p.h = 9; p.y = (ty + 1) * TS - 9; p.x = tx * TS + 3; }
  if (kind === 'box') { p.w = 16; p.h = 11; p.x = tx * TS; p.y = (ty + 1) * TS - 11; }

/* ---------- items, blocks and surprises ---------- */
function breakBlock(tx, ty) {
  const k = ty * R.w + tx;
  if (R.tiles[k] !== CRUMB) return;
  R.tiles[k] = E_;
  const br = list(SAVE.broke, R.id); if (!br.includes(k)) br.push(k);
  sfx.crack(); cam.shake = 6;
  const th = THEMES[R.theme];
  for (let i = 0; i < 10; i++) W.parts.push({ k: 'crumb', x: tx * TS + rnd(2, 14), y: ty * TS + rnd(2, 14), vx: rnd(-1.6, 1.6), vy: rnd(-3.2, -0.6), life: 50, max: 50, c: i % 2 ? th.stone : th.sd, s: rnd(2, 3.6), rot: rnd(0, 6) });
  // what was inside?
  const it = W.items.find(i => i.tx === tx && i.ty === ty && i.hidden && !i.vis);
  if (it) {
    it.vis = true; it.pop = 1;
    if (it.kind === 'surprise') { surprise(it); }
    else sparkle(tx * TS + 8, ty * TS + 8, 8, '#fff6a8');
  }
  const d = R.doors.find(dd => dd.kind === 'secret' && dd.tx === tx && dd.ty === ty);
  if (d) {
    const above = (ty - 1) * R.w + tx; if (R.tiles[above] === CRUMB) breakBlock(tx, ty - 1);
    toast('A secret door!'); sfx.surprise(); sparkle(tx * TS + 8, ty * TS, 16, '#ffe27a');
  }
  saveDirty = true;
}
function collect(it) {
  it.got = true;
  const got = list(SAVE.got, R.id);
  if (!it.drop && !got.includes(it.id)) got.push(it.id);
  const cx = it.tx * TS + 8, cy = it.ty * TS + 8;
  if (it.kind === 'fish') {
    const n = it.hidden ? 3 : 1;
    SAVE.fish += n; sfx.fish(); floatText(cx, cy - 4, '+' + n); sparkle(cx, cy, 5, '#bfe6ff');
    say(n + (n === 1 ? ' fish' : ' fish') + '. You have ' + SAVE.fish + '.');
  } else if (it.kind === 'pie') {
    gotPie(R.id, cx, cy);
  } else if (it.kind === 'key') {
    SAVE.keys[R.id] = true; sfx.key(); sparkle(cx, cy, 12, '#ffd34d');
    toast('You found the key!', 'Now find the door with the lock.');
  } else if (it.kind === 'catnip') {
    SAVE.max = Math.min(9, SAVE.max + 1); M.hearts = SAVE.max; sfx.catnip(); sparkle(cx, cy, 14, '#9be37a');
    toast('Catnip!', 'Miko can take one more bump now.');
  }
  save(); updateHud();
}
function gotPie(roomId, cx, cy) {

function updatePierre() {

    if (f.kind === 'g') {
      f.x = f.hx + Math.sin(f.t * 0.018) * 26; f.y = f.hy - 2 + Math.sin(f.t * 0.05) * 6;

      `<div class="hh-btns">${prompt?`<button type="button" class="hh-b hh-go" data-hh="install">Install ${e(code)}</button>`:''}${s.copy&&url?'<button type="button" class="hh-b" data-hh="copy">Copy link</button>':''}${withTitle?'<button type="button" class="hh-b" data-hh="later">Not now</button>':''}<span class="hh-msg" aria-live="polite"></span></div>`;
  }

`#hh{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:9999;max-width:520px;margin:0 auto;background:var(--panel,#fff);color:var(--ink,#1b1f24);border:1px solid var(--edge,#c3c9d2);border-radius:16px;box-shadow:0 10px 32px rgba(0,0,0,.28);padding:12px 14px 10px;font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
