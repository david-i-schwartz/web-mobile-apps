<title>Five O'Clock Shadow of the Colossus</title>
<!--
  Five O'Clock Shadow of the Colossus — v1.0, 2026-11-16
  An unofficial parody for a "add one word to a known game" challenge.
  One self-contained file: no outside code, fonts, pictures or sounds. All art is drawn
  and all sound is synthesized in the browser. Made by Claude for Dave Schwartz.
-->
<style>
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--panel:#fff7ea;--ink:#2a1d14;--muted:#6d5b4b;--accent:#b8432b;--btn:#2a1d14;--btnInk:#fff7ea;--line:rgba(42,29,20,.2);--chip:#f1e3cc}
@media (prefers-color-scheme:dark){:root{--panel:#211b26;--ink:#f4eadf;--muted:#c2b1a2;--accent:#ff9068;--btn:#f4eadf;--btnInk:#211b26;--line:rgba(244,234,223,.22);--chip:#2e2735}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#241a2a;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
canvas{position:fixed;inset:0;display:block}
@media (min-width:900px){#overlay{justify-content:flex-start!important;padding-left:5vw!important}}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(12px + var(--sat)) 14px calc(12px + var(--sab));pointer-events:none;z-index:4}
.panel{pointer-events:auto;background:var(--panel);color:var(--ink);border-radius:20px;width:100%;max-width:500px;max-height:100%;overflow:auto;padding:22px 20px 18px;box-shadow:0 24px 70px rgba(0,0,0,.5);animation:pop .35s ease-out}
@keyframes pop{from{transform:translateY(14px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.kicker{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:800;margin:0 0 8px}
h1,h2{font-family:Georgia,"Times New Roman",serif;font-weight:700;letter-spacing:.05em;line-height:1.05;margin:0 0 12px}
h1{font-size:clamp(30px,9vw,46px)}
h1 .five{display:block;font-size:.48em;letter-spacing:.2em;color:var(--accent);margin-bottom:4px}
h1 .of{display:block;font-size:.38em;letter-spacing:.34em;font-style:italic;font-weight:400;margin:6px 0 4px;color:var(--muted)}
h2{font-size:clamp(26px,7.5vw,38px)}
.num{font-family:Georgia,serif;letter-spacing:.3em;color:var(--accent);font-weight:700;margin:0 0 4px}
.epithet{font-family:Georgia,serif;font-style:italic;color:var(--muted);margin:-6px 0 12px;font-size:19px}
.lore{color:var(--muted);margin:0 0 10px}
.row{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 4px}
button{font:700 16px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:44px;min-width:44px;padding:10px 18px;border-radius:12px;border:0;background:var(--btn);color:var(--btnInk);cursor:pointer}
button.alt{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
button:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.fine{font-size:13px;color:var(--muted);margin:12px 0 0}
details{margin-top:8px;font-size:14px;color:var(--muted)}
summary{cursor:pointer;min-height:36px;display:flex;align-items:center;font-weight:700;color:var(--ink)}
details p,details ul{margin:4px 0 8px}
ul.how{padding-left:20px;margin:6px 0 10px} ul.how li{margin:4px 0}
.stats{display:grid;grid-template-columns:1fr auto;gap:4px 16px;margin:12px 0;padding:12px 14px;border-radius:12px;background:var(--chip)}
.stats b{text-align:right}
kbd{font:700 13px ui-monospace,Menlo,Consolas,monospace;background:var(--chip);border-radius:6px;padding:1px 6px;box-shadow:inset 0 -1px 0 var(--line)}
#topbtns{position:fixed;top:calc(8px + var(--sat));right:8px;display:flex;gap:8px;z-index:5}
#topbtns button{width:44px;height:44px;padding:0;border-radius:12px;background:rgba(24,16,28,.55);color:#fff;font-size:17px}
#bPause{display:none}
body.playing #bPause{display:block}
#touch{position:fixed;inset:0;pointer-events:none;z-index:3;display:none}
body.touch.playing #touch{display:block}
#joyZone{position:absolute;left:0;bottom:0;width:56%;height:64%;pointer-events:auto}
.joy{position:absolute;border-radius:50%;pointer-events:none}
#joyBase{width:124px;height:124px;margin:-62px 0 0 -62px;background:rgba(255,255,255,.10);border:2px solid rgba(255,255,255,.4)}
#joyKnob{width:58px;height:58px;margin:-29px 0 0 -29px;background:rgba(255,255,255,.55);box-shadow:0 2px 10px rgba(0,0,0,.3)}
#joyZone.idle .joy{opacity:.55}
.tb{position:absolute;pointer-events:auto;border-radius:50%;color:#fff;font:800 14px system-ui,-apple-system,sans-serif;letter-spacing:.06em;padding:0;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.35)}
#bShave{right:18px;bottom:calc(34px + var(--sab));width:100px;height:100px;background:rgba(190,62,40,.84);border:3px solid rgba(255,255,255,.7)}
#bJump{right:130px;bottom:calc(18px + var(--sab));width:76px;height:76px;background:rgba(36,58,110,.8);border:3px solid rgba(255,255,255,.6)}
.tb.on{transform:scale(.92);filter:brightness(1.25)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

</div>

  <div id="joyZone" class="idle"><div id="joyBase" class="joy"></div><div id="joyKnob" class="joy"></div></div>

<script>
'use strict';
const VERSION='1.0', VDATE='16 Nov 2026';
const $=id=>document.getElementById(id);
const cv=$('c'), ctx=cv.getContext('2d');
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, rnd=(a,b)=>a+Math.random()*(b-a);
const ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const lerpP=(a,b,t)=>({x:lerp(a.x,b.x,t),y:lerp(a.y,b.y,t)});
function hex(h){const n=parseInt(h.slice(1),16);return [n>>16&255,n>>8&255,n&255];}
function mixc(a,b,t){const A=hex(a),B=hex(b);t=clamp(t,0,1);return 'rgb('+Math.round(lerp(A[0],B[0],t))+','+Math.round(lerp(A[1],B[1],t))+','+Math.round(lerp(A[2],B[2],t))+')';}
function shade(h,k=0.76){const A=hex(h);return 'rgb('+A.map(v=>Math.round(v*k)).join(',')+')';}

/* ---------- storage (best effort, keys start with fivo:) ---------- */
const store={
  get(k,d){try{const v=localStorage.getItem('fivo:'+k);return v===null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){try{localStorage.setItem('fivo:'+k,JSON.stringify(v));return true;}catch(e){return false;}}
};
const storeOK=store.set('probe',1);
let reached=clamp(parseInt(store.get('reached',0),10)||0,0,2);
let bestTotal=Number(store.get('best',0))||0;

/* ---------- screen ---------- */
let W=0,H=0,DPR=1,SAT=0,SAB=0;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';
  const cs=getComputedStyle(document.documentElement);
  SAT=parseFloat(cs.getPropertyValue('--sat'))||0;SAB=parseFloat(cs.getPropertyValue('--sab'))||0;
  placeJoyIdle();
}
addEventListener('resize',resize);

/* ---------- the colossi ---------- */
const LEVELS=[
{numeral:'I',name:'GARY',short:'Gary',epithet:'of Accounts Payable',
 blurb:'Has a performance review at five. Has not shaved since Tuesday.',
 winLine:'Gary strides into his review looking like a man who balances things.',
 loseLine:'Gary’s review notes say “seems… shadowy.” He is eleven storeys tall, so nobody pushes it.',
 startMin:0,secPerMin:2.4,growSecs:48,tickle:0.0045,swat:0,stomp:0,pace:0,stache:false,voice:92,
 headRx:118,headRy:136,torsoHW:150,torsoHH:170,legLen:390,neckLen:50,neckR:44,L1:185,L2:175,
 skin:'#eab48b',skinD:'#c88a63',suit:'#7a5a3c',shirt:'#f4efe2',tie:'#d9a227',pants:'#5b4633',shoes:'#2c211b',hair:'#4a3424',
 hairStyle:'combover',glasses:true,pens:true},
{numeral:'II',name:'DESMOND',short:'Desmond',epithet:'Who Has a Date',
 blurb:'Dinner reservation at five. Wants to look “effortless.” It will take effort. He swats, and he stomps.',
 winLine:'Desmond arrives smooth as a saxophone solo. His date is impressed.',
 loseLine:'His date calls the look “rugged.” He was going for “brunch.”',
 startMin:5,secPerMin:2.4,growSecs:40,tickle:0.0055,swat:1,swatEvery:[6,8.5],windup:0.95,stomp:1,stompDelay:1.1,pace:0,stache:false,voice:104,
 headRx:112,headRy:140,torsoHW:140,torsoHH:180,legLen:420,neckLen:56,neckR:40,L1:195,L2:180,
 skin:'#c98d62',skinD:'#a46e48',suit:'#2f4c7a',shirt:'#f6c6d0',tie:'#7a2f5c',pants:'#273b5c',shoes:'#3a2014',hair:'#1f1712',
 hairStyle:'pompadour',rose:true},
{numeral:'III',name:'LORD REGINALD',short:'Reginald',epithet:'the Mustachioed',
 blurb:'His wedding is at five. Shave everything. Do NOT touch the mustache. He paces, swats and stomps.',
 winLine:'Reginald walks down the aisle, mustache magnificent, chin immaculate.',
 loseLine:'The vicar asks which of the two shadows is the groom.',
 startMin:10,secPerMin:2.6,growSecs:36,tickle:0.006,swat:1,swatEvery:[4.5,6.5],windup:0.82,stomp:1,stompDelay:0.75,pace:1,stache:true,voice:80,
 headRx:124,headRy:142,torsoHW:160,torsoHH:182,legLen:420,neckLen:52,neckR:46,L1:200,L2:185,
 skin:'#f0c4a4',skinD:'#cf9a78',suit:'#26262e',shirt:'#fbfaf6',tie:'#1a1a1f',pants:'#202028',shoes:'#121216',hair:'#9a6230',
 hairStyle:'tophat',bowtie:true,flower:true}
];
const OUT='#2a1a12';
const CLIMB=104,RUN=150,JUMPV=360,GRAV=900,RAZOR=14,SMOOTH_T=0.3,GOAL=0.95,WORLDX=950;

/* ---------- transforms and shapes ---------- */
function mkT(x,y,a){return {x,y,a,c:Math.cos(a),s:Math.sin(a)};}
function apply(T,lx,ly){return {x:T.x+T.c*lx-T.s*ly,y:T.y+T.s*lx+T.c*ly};}
function toLocal(T,x,y){const dx=x-T.x,dy=y-T.y;return {x:T.c*dx+T.s*dy,y:-T.s*dx+T.c*dy};}
function insideShape(s,x,y,m=0){
  if(s.k==='cap'){const dx=s.bx-s.ax,dy=s.by-s.ay,l2=dx*dx+dy*dy||1;let t=((x-s.ax)*dx+(y-s.ay)*dy)/l2;t=t<0?0:t>1?1:t;
    const px=s.ax+dx*t-x,py=s.ay+dy*t-y,r=s.r+m;return px*px+py*py<=r*r;}
  if(s.k==='ell'){const u=(x-s.cx)/(s.rx+m),v=(y-s.cy)/(s.ry+m);return u*u+v*v<=1;}
  const qx=Math.abs(x-s.cx)-(s.hw-s.r),qy=Math.abs(y-s.cy)-(s.hh-s.r);
  return Math.hypot(Math.max(qx,0),Math.max(qy,0))+Math.min(Math.max(qx,qy),0)-s.r<=m;
}
function shapeCenter(s){return s.k==='cap'?{x:(s.ax+s.bx)/2,y:(s.ay+s.by)/2}:{x:s.cx,y:s.cy};}
function insidePart(pt,x,y,m=0){const l=toLocal(pt.T,x,y);return insideShape(pt.s,l.x,l.y,m);}
function partAt(x,y,m=0){for(const pt of G.order){if(insidePart(pt,x,y,m))return pt;}return null;}

/* ---------- the giant ---------- */
let G=null;
function makeGiant(Lv){
  const g={L:Lv,x:0,t:0,bob:0,sway:0,headRot:0,jit:0,jx:0,jy:0,agit:0,shake:null,dazed:0,angryT:0,stacheCD:0,mood:'calm',
    blinkT:rnd(1.5,4),blink:0,hipY:-(Lv.legLen+30),paceT:0,swatCD:Lv.swat?rnd(4,6):0,stompT:0,blushT:0,blushSide:1,
    arms:[{side:-1,mode:'rest',t:0,hand:null},{side:1,mode:'rest',t:0,hand:null}],
    legs:[{side:-1,mode:'rest',t:0,lift:0,fx:0},{side:1,mode:'rest',t:0,lift:0,fx:0}],
    parts:{},order:[],plats:{}};
  g.legs.forEach(l=>{l.fx=l.side*Lv.torsoHW*0.48;l.baseFx=l.fx;});
  pose(g);pose(g);
  return g;
}
function setPlat(g,key,part,ax,ay,bx,by){g.plats[key]={key,part,a:apply(part.T,ax,ay),b:apply(part.T,bx,by)};}
function solveIK(S,Tg,L1,L2,side){
  const dx=Tg.x-S.x,dy=Tg.y-S.y,d=Math.hypot(dx,dy)||1;
  const dd=clamp(d,Math.abs(L1-L2)+20,L1+L2-2),base=Math.atan2(dy,dx);
  const A=Math.acos(clamp((L1*L1+dd*dd-L2*L2)/(2*L1*dd),-1,1));
  let best=null,bs=-1e9;
  for(const sg of [1,-1]){const a=base+sg*A,E={x:S.x+Math.cos(a)*L1,y:S.y+Math.sin(a)*L1};
    const sc=side*(E.x-S.x)+0.35*(E.y-S.y);if(sc>bs){bs=sc;best={a,E};}}
  const Wt={x:S.x+dx/d*dd,y:S.y+dy/d*dd},af=Math.atan2(Wt.y-best.E.y,Wt.x-best.E.x);
  return {E:best.E,W:{x:best.E.x+Math.cos(af)*L2,y:best.E.y+Math.sin(af)*L2},aU:best.a-Math.PI/2,aF:af-Math.PI/2};
}
function pose(g){
  const Lv=g.L,Pp=g.parts,hw=Lv.torsoHW,hh=Lv.torsoHH;
  const tT=mkT(g.x+g.jx,g.hipY+g.bob+g.jy,g.sway);
  Pp.torso={k:'torso',T:tT,s:{k:'box',cx:0,cy:-hh,hw,hh,r:46}};
  const nb=apply(tT,0,-2*hh+14),nT=mkT(nb.x,nb.y,g.sway+g.headRot*0.35);
  Pp.neck={k:'neck',T:nT,s:{k:'cap',ax:0,ay:12,bx:0,by:-Lv.neckLen,r:Lv.neckR}};
  const hb=apply(nT,0,-Lv.neckLen),hT=mkT(hb.x,hb.y,g.sway+g.headRot),hcy=-Lv.headRy+18;
  Pp.head={k:'head',T:hT,s:{k:'ell',cx:0,cy:hcy,rx:Lv.headRx,ry:Lv.headRy}};
  const top=hcy-Lv.headRy;g.headTop=top;
  if(Lv.hairStyle==='pompadour')Pp.hat={k:'hat',T:hT,s:{k:'ell',cx:10,cy:top-4,rx:Lv.headRx*0.82,ry:42}};
  else if(Lv.hairStyle==='tophat')Pp.hat={k:'hat',T:hT,s:{k:'box',cx:6,cy:top-50,hw:72,hh:64,r:8}};
  for(const lg of g.legs){
    const hj=apply(tT,lg.side*hw*0.44,-6),ax=g.x+lg.fx,ay=-30-lg.lift;
    const dx=ax-hj.x,dy=ay-hj.y,len=Math.hypot(dx,dy),a=Math.atan2(dy,dx)-Math.PI/2;
    const k=lg.side<0?'legL':'legR',sk=lg.side<0?'shoeL':'shoeR';
    Pp[k]={k,T:mkT(hj.x,hj.y,a),s:{k:'cap',ax:0,ay:0,bx:0,by:len,r:54}};
    Pp[sk]={k:sk,T:mkT(ax+lg.side*14,ay+14,0),s:{k:'box',cx:0,cy:0,hw:66,hh:20,r:18}};
    lg.footX=ax+lg.side*14;
  }
  for(const arm of g.arms){
    const S=apply(tT,arm.side*(hw-14),-2*hh+40);
    arm.S=S;arm.rest=apply(tT,arm.side*(hw+34),-2*hh+40+(Lv.L1+Lv.L2+22)*0.9);
    if(!arm.hand)arm.hand={x:arm.rest.x,y:arm.rest.y-22};
    const ik=solveIK(S,arm.hand,Lv.L1,Lv.L2,arm.side),sf=arm.side<0?'L':'R';
    Pp['up'+sf]={k:'up'+sf,T:mkT(S.x,S.y,ik.aU),s:{k:'cap',ax:0,ay:0,bx:0,by:Lv.L1,r:36}};
    Pp['fore'+sf]={k:'fore'+sf,T:mkT(ik.E.x,ik.E.y,ik.aF),s:{k:'cap',ax:0,ay:0,bx:0,by:Lv.L2,r:31}};
    Pp['hand'+sf]={k:'hand'+sf,T:mkT(ik.W.x,ik.W.y,ik.aF),s:{k:'ell',cx:0,cy:22,rx:38,ry:44}};
    arm.fdir={x:-Math.sin(ik.aF),y:Math.cos(ik.aF)};
    arm.palm=apply(Pp['hand'+sf].T,0,22);
  }
  g.order=[Pp.handL,Pp.handR,Pp.foreL,Pp.foreR,Pp.upL,Pp.upR];
  if(Pp.hat)g.order.push(Pp.hat);
  g.order.push(Pp.head,Pp.neck,Pp.torso,Pp.shoeL,Pp.shoeR,Pp.legL,Pp.legR);
  setPlat(g,'shL',Pp.torso,-hw+48,-2*hh,-Lv.neckR+2,-2*hh);
  setPlat(g,'shR',Pp.torso,Lv.neckR-2,-2*hh,hw-48,-2*hh);
  if(Lv.hairStyle==='combover'){const h=8,w=Lv.headRx*Math.sqrt(1-((Lv.headRy-h)/Lv.headRy)**2);setPlat(g,'top',Pp.head,-w,top+h,w,top+h);}
  else if(Lv.hairStyle==='pompadour'){const s=Pp.hat.s,h=7,w=s.rx*Math.sqrt(1-((s.ry-h)/s.ry)**2);setPlat(g,'top',Pp.hat,s.cx-w,s.cy-s.ry+h,s.cx+w,s.cy-s.ry+h);}
  else{const s=Pp.hat.s;setPlat(g,'top',Pp.hat,s.cx-s.hw+8,s.cy-s.hh,s.cx+s.hw-8,s.cy-s.hh);
    setPlat(g,'brimL',Pp.hat,s.cx-s.hw-32,s.cy+s.hh-4,s.cx-s.hw,s.cy+s.hh-4);setPlat(g,'brimR',Pp.hat,s.cx+s.hw,s.cy+s.hh-4,s.cx+s.hw+32,s.cy+s.hh-4);}
}
function headCenter(){const h=G.parts.head;return apply(h.T,0,h.s.cy);}

/* ---------- stubble ---------- */
let hairs=[];
function stacheZone(u,v){const au=Math.abs(u);if(au>0.47)return false;const vc=0.33-0.9*Math.max(0,au-0.16)**2*2.2,th=0.068-0.075*au;return Math.abs(v-vc)<th;}
function stubbleZone(u,v){
  if(v<-0.14)return false;
  if(!(v>0.16||(Math.abs(u)>0.58)))return false;
  if((u/0.34)**2+((v-0.48)/0.08)**2<1)return false;
  if(Math.abs(u)<0.17&&v<0.24)return false;
  return true;
}
function mkHair(p,x,y,prot,u){
  let a=prot?(u<0?Math.PI:0)+rnd(-0.25,0.25)+(u<0?-0.25:0.25):Math.PI/2+u*0.7+rnd(-0.35,0.35);
  return {p,x,y,prot,len:rnd(0.78,1),gr:rnd(0.8,1.2),dx:Math.cos(a),dy:Math.sin(a)};
}
function makeHairs(g){
  const Lv=g.L,hs=[],rx=Lv.headRx,ry=Lv.headRy,cy=g.parts.head.s.cy,sp=7.6;
  let row=0;
  for(let ly=cy-ry;ly<=cy+ry;ly+=sp*0.87,row++)for(let lx=-rx;lx<=rx;lx+=sp){
    const x=lx+(row%2?sp/2:0)+rnd(-1.6,1.6),y=ly+rnd(-1.6,1.6),u=x/rx,v=(y-cy)/ry;
    if(u*u+v*v>0.93)continue;
    if(Lv.stache&&stacheZone(u,v))continue;
    if(!stubbleZone(u,v))continue;
    hs.push(mkHair('head',x,y,false,u));
  }
  if(Lv.stache){row=0;const s2=4.4;for(let ly=cy;ly<=cy+ry*0.5;ly+=s2*0.87,row++)for(let lx=-rx*0.5;lx<=rx*0.5;lx+=s2){
    const x=lx+(row%2?s2/2:0),y=ly,u=x/rx,v=(y-cy)/ry;if(stacheZone(u,v))hs.push(mkHair('head',x,y,true,u));}}
  const nk=g.parts.neck,hd=g.parts.head,ts=g.parts.torso;row=0;
  for(let ly=-Lv.neckLen-30;ly<=14;ly+=sp*0.87,row++)for(let lx=-Lv.neckR;lx<=Lv.neckR;lx+=sp){
    const x=lx+(row%2?sp/2:0)+rnd(-1.4,1.4),y=ly+rnd(-1.4,1.4),w=apply(nk.T,x,y);
    if(!insideShape(nk.s,x,y,-3))continue;if(insidePart(hd,w.x,w.y,5))continue;if(insidePart(ts,w.x,w.y,4))continue;

}
function smoothness(){let n=0,s=0;for(const h of hairs){if(h.prot)continue;n++;if(h.len<SMOOTH_T)s++;}return n?s/n:1;}
function stacheIntact(){let n=0,s=0;for(const h of hairs){if(!h.prot)continue;n++;if(h.len>=SMOOTH_T)s++;}return n?s/n:1;}

let P=null;
function makePlayer(){return {x:-300,y:-8,vx:0,vy:0,mode:'ground',part:null,lx:0,ly:0,plat:null,pt:0,grip:1,stun:0,cool:0,flat:0,face:1,anim:0,shaving:false,cutRate:0,nearHair:false,nearStache:false,spin:0};}
function attach(pt,x,y){const p=P;p.mode='cling';p.part=pt.k;p.plat=null;const l=toLocal(pt.T,x,y);p.lx=l.x;p.ly=l.y;p.x=x;p.y=y;}
function knock(dir,k=1){const p=P;p.mode='air';p.part=null;p.plat=null;p.vx=dir*380*k;p.vy=-220*k;p.stun=0.9;p.cool=1.0;}
function toLedge(key,t){const p=P;p.mode='ledge';p.plat=key;p.pt=clamp(t,0,1);p.part=null;SFX.grab();}
function platNear(x,y){
  for(const k in G.plats){const pl=G.plats[k],dx=pl.b.x-pl.a.x;if(Math.abs(dx)<1)continue;const t=(x-pl.a.x)/dx;
    if(t<-0.02||t>1.02)continue;const py=lerp(pl.a.y,pl.b.y,t);if(Math.abs(py-(y+8))<15)return {key:k,t};}
  return null;
}
function climbMove(dx,dy){
  const p=P,cur=G.parts[p.part];
  const rot=a=>{const c=Math.cos(a),s=Math.sin(a);return [dx*c-dy*s,dx*s+dy*c];};
  const tries=[[dx,dy]];
  // blocked? look sideways for a spot where the wanted direction is open, and slide that way
  const sg=slideSide(dx,dy);
  if(sg)for(const a of [0.45,0.9,1.35,1.5708])tries.push(rot(a*sg));
  else for(const a of [0.45,-0.45,0.9,-0.9])tries.push(rot(a));
  for(const [mx,my] of tries){
    if(Math.abs(mx)<1e-6&&Math.abs(my)<1e-6)continue;const nx=p.x+mx,ny=p.y+my;
    if(insidePart(cur,nx,ny,-1.5)){attach(cur,nx,ny);return;}
    const o=partAt(nx,ny,-1.5);if(o){attach(o,nx,ny);return;}
    const pl=platNear(nx,ny);if(pl&&(my<0||Math.abs(mx)>0)){toLedge(pl.key,pl.t);return;}
  }
}
function slideSide(dx,dy){
  const p=P,L_=Math.hypot(dx,dy)||1,ux=dx/L_,uy=dy/L_,px=-uy,py=ux;
  if(partAt(p.x+ux*3,p.y+uy*3,-1.5)||platNear(p.x+ux*3,p.y+uy*3))return 0;
  for(let d=3;d<=120;d+=3)for(const sg of [1,-1]){const x=p.x+px*d*sg,y=p.y+py*d*sg;
    if(!partAt(x,y,-1.5))continue;if(partAt(x+ux*6,y+uy*6,-1.5))return sg;}
  return 0;
}
function pullInside(pt){
  const p=P;let l={x:p.lx,y:p.ly};const c=shapeCenter(pt.s);
  for(let i=0;i<14&&!insideShape(pt.s,l.x,l.y,-1.5);i++)l=lerpP(l,c,0.22);
  p.lx=l.x;p.ly=l.y;const w=apply(pt.T,l.x,l.y);p.x=w.x;p.y=w.y;
}

let AC=null,master=null,noiseBuf=null,razorG=null,droneG=null,muted=!!store.get('muted',false);
function audioInit(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;return;}
  master=AC.createGain();master.gain.value=muted?0:0.55;master.connect(AC.destination);
  const n=AC.sampleRate;noiseBuf=AC.createBuffer(1,n,n);const d=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  const ns=AC.createBufferSource();ns.buffer=noiseBuf;ns.loop=true;
  const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=4300;bp.Q.value=0.9;
  razorG=AC.createGain();razorG.gain.value=0;ns.connect(bp);bp.connect(razorG);razorG.connect(master);ns.start();
  droneG=AC.createGain();droneG.gain.value=0;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=300;
  [55,82.4,110.3].forEach((f,i)=>{const o=AC.createOscillator();o.type=i===2?'sine':'triangle';o.frequency.value=f;o.detune.value=(i-1)*7;o.connect(lp);o.start();});
  lp.connect(droneG);droneG.connect(master);
}
function tone(f,dur,type='sine',vol=0.3,to=null,delay=0,lpf=0){
  if(!AC||muted)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  let node=o;if(lpf){const f2=AC.createBiquadFilter();f2.type='lowpass';f2.frequency.value=lpf;o.connect(f2);node=f2;}
  node.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.05);
}
function noise(dur,vol,type='highpass',freq=1000,delay=0){
  if(!AC||muted)return;const t=AC.currentTime+delay,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=noiseBuf;f.type=type;f.frequency.value=freq;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.006);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random()*0.5);s.stop(t+dur+0.05);
}
const SFX={
  tick(v){noise(0.03,v,'highpass',3200);},
  jump(){tone(380,0.13,'square',0.04,720);},
  grab(){noise(0.05,0.09,'bandpass',1700);},
  land(){noise(0.07,0.1,'lowpass',500);},
  slap(){noise(0.18,0.55,'highpass',800);tone(260,0.12,'triangle',0.2,110);},
  thump(){tone(95,0.28,'sine',0.35,48);noise(0.12,0.16,'lowpass',380);},
  boom(){tone(72,0.8,'sine',0.6,26);noise(0.6,0.38,'lowpass',240);},
  grumble(b=95){tone(b,0.6,'sawtooth',0.13,b*0.72,0,420);tone(b*1.5,0.5,'sawtooth',0.06,b*1.15,0.06,420);},
  ow(){tone(420,0.4,'sawtooth',0.08,190,0.05,1400);},
  bell(delay=0){[1,2,2.76,4.07,5.4].forEach((m,i)=>tone(147*m,3.2-i*0.45,'sine',0.24/(i+1),null,delay));},
  win(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,0.4,'triangle',0.14,null,i*0.1));},
  penalty(){tone(220,0.45,'square',0.1,90,0,1200);},
  ding(){tone(1568,0.6,'sine',0.12);tone(2093,0.7,'sine',0.08,null,0.07);},

/* ---------- giant behaviour ---------- */
function trySwat(g){
  const p=P,target={x:p.x,y:p.y};let best=null,bd=1e9;
  for(const arm of g.arms){
    if(arm.mode!=='rest')continue;if(p.mode==='cling'&&onArm(p.part,arm.side))continue;
    const d=Math.hypot(target.x-arm.S.x,target.y-arm.S.y);if(d>g.L.L1+g.L.L2+18)continue;
    const sc=d-(Math.sign(target.x-g.x)===arm.side?90:0);if(sc<bd){bd=sc;best=arm;}
  }
  if(!best)return false;
  const a=best;a.mode='wind';a.t=0;a.wdur=g.L.windup;a.from={...a.palm};a.target=target;
  a.windPos={x:target.x+a.side*120,y:target.y-80};
  const pk=p.mode==='cling'?p.part:(p.mode==='ledge'&&G.plats[p.plat]?G.plats[p.plat].part.k:'');
  a.selfT=['head','neck','hat'].includes(pk);
  SFX.whoosh();return true;
}
function resolveSwat(g,arm){
  const p=P,palm=arm.palm,d=Math.hypot(p.x-palm.x,p.y-palm.y);
  if(d<52&&p.mode!=='ground'){knock(Math.sign(p.x-arm.S.x)||arm.side,1);SFX.slap();shakeAmt=9;stats.smacked++;popup('SMACK!',p.x,p.y-22,'#fff',22);}
  else if(arm.selfT){g.dazed=3.2;g.blushT=6;g.blushSide=arm.side;g.agit=0;g.shake=null;SFX.slap();SFX.ow();shakeAmt=11;stats.selfSlaps++;
    popup('SLAP!',palm.x,palm.y-50,'#ffe08a',34);showBanner(`${g.L.short} slapped himself.`,'He’s dazed. Shave fast!',2);announce(`${g.L.short} slapped himself and is dazed.`);
    for(let i=0;i<10;i++)particles.push({k:'spark',x:palm.x+rnd(-40,40),y:palm.y+rnd(-40,40),vx:rnd(-80,80),vy:rnd(-80,20),life:0.7,t:0});}
  else{SFX.thump();shakeAmt=4;popup('thump',palm.x,palm.y-50,'#fff',16);if(p.mode==='cling')p.grip=Math.max(0,p.grip-0.06);}
}
function stompImpact(g,lg){
  const p=P,fx=lg.footX;SFX.boom();shakeAmt=13;
  for(let i=0;i<18;i++)particles.push({k:'dust',x:fx+rnd(-90,90),y:-4,vx:rnd(-160,160),vy:rnd(-120,-20),life:rnd(0.6,1.2),t:0,r:rnd(8,18)});
  if(p.mode==='ground'){const d=Math.abs(p.x-fx);
    if(d<76){p.flat=1.6;p.stun=1.6;stats.stomped++;popup('SQUISH',p.x,p.y-26,'#fff',20);SFX.slap();}
    else if(d<280){p.mode='air';p.vy=-240;p.vx=Math.sign(p.x-fx)*200;p.stun=0.35;p.cool=0.4;}}
  else if(p.mode==='cling'&&(p.part===(lg.side<0?'legL':'legR')||p.part===(lg.side<0?'shoeL':'shoeR')))p.grip=Math.max(0,p.grip-0.15);
}
function updGiant(dt){
  const g=G,Lv=g.L,playing=state==='play';
  g.t+=dt;g.blinkT-=dt;if(g.blinkT<=0){g.blink=0.13;g.blinkT=rnd(2,5);}if(g.blink>0)g.blink-=dt;
  if(g.dazed>0)g.dazed-=dt;if(g.blushT>0)g.blushT-=dt;if(g.angryT>0)g.angryT-=dt;if(g.stacheCD>0)g.stacheCD-=dt;
  g.agit=Math.max(0,g.agit-dt*0.1);
  g.bob=Math.sin(g.t*1.4)*3;g.sway=Math.sin(g.t*0.45)*0.012+(g.dazed>0?Math.sin(g.t*2.4)*0.035:0);
  g.jit=0;
  if(playing&&!g.shake&&g.agit>=1&&g.dazed<=0){g.shake={t:0,warn:0.7,dur:1.7};SFX.grumble(Lv.voice);const hc=headCenter();popup('?!',hc.x,hc.y-Lv.headRy-40,'#fff',34);}
  if(g.shake&&!playing)g.shake=null;
  if(g.shake){const s=g.shake;s.t+=dt;
    if(s.t<s.warn)g.headRot=lerp(g.headRot,Math.sin(s.t*34)*0.03,0.5);
    else{const k=(s.t-s.warn)/s.dur,e=Math.sin(Math.min(1,k)*Math.PI);g.headRot=Math.sin((s.t-s.warn)*19)*0.21*e;g.jit=6*e;if(k>=1){g.shake=null;g.agit=0.2;}}}
  else{const look=clamp((P.x-g.x)/2500,-0.04,0.04),want=Math.sin(g.t*0.6)*0.03+look+(g.dazed>0?Math.sin(g.t*3.1)*0.09:0)+(state==='win'?Math.sin(g.t*5)*0.05:0)+(state==='lose'?0.08:0);
    g.headRot+=(want-g.headRot)*Math.min(1,dt*3);}
  g.jx=g.jit?rnd(-g.jit,g.jit):0;g.jy=g.jit?rnd(-g.jit,g.jit)*0.5:0;
  g.mood=state==='win'?'happy':state==='lose'?'sad':g.dazed>0?'dazed':g.angryT>0?'angry':g.shake?'tickled':g.agit>0.65?'twitch':'calm';
  const legsBusy=g.legs.some(l=>l.mode!=='rest');let walking=false;
  if(Lv.pace&&playing&&!legsBusy&&g.dazed<=0){g.paceT+=dt;const nx=Math.sin(g.paceT*0.23)*200;walking=true;g.x=nx;}
  const armsRest=g.arms.every(a=>a.mode==='rest');
  if(Lv.swat&&playing&&g.dazed<=0&&!g.shake&&(P.mode==='cling'||P.mode==='ledge')&&armsRest){g.swatCD-=dt;if(g.swatCD<=0)g.swatCD=trySwat(g)?rnd(Lv.swatEvery[0],Lv.swatEvery[1]):0.8;}
  if(Lv.stomp&&playing&&g.dazed<=0&&!legsBusy&&P.mode==='ground'&&P.flat<=0){
    let near=null,nd=1e9;for(const lg of g.legs){const d=Math.abs(P.x-lg.footX);if(d<nd){nd=d;near=lg;}}
    if(nd<190){g.stompT+=dt;if(g.stompT>Lv.stompDelay){near.mode='lift';near.t=0;near.baseFx=near.side*Lv.torsoHW*0.48;g.stompT=0;SFX.grumble(Lv.voice*0.75);}}
    else g.stompT=Math.max(0,g.stompT-dt);
  }
  // arms
  for(const arm of g.arms){
    arm.t+=dt;let goal;
    if(arm.mode==='rest')goal={x:arm.rest.x+Math.sin(g.t*1.1+arm.side)*6,y:arm.rest.y};
    else if(arm.mode==='wind'){goal=lerpP(arm.from,arm.windPos,ease(arm.t/arm.wdur));if(arm.t>=arm.wdur){arm.mode='strike';arm.t=0;}}
    else if(arm.mode==='strike'){const k=clamp(arm.t/0.13,0,1);goal=lerpP(arm.windPos,arm.target,k*k);if(arm.t>=0.13){arm.mode='hold';arm.t=0;arm.resolveNext=true;}}
    else if(arm.mode==='hold'){goal=arm.target;if(arm.t>0.35){arm.mode='back';arm.t=0;arm.from={...arm.palm};}}
    else{goal=lerpP(arm.from,arm.rest,ease(arm.t/0.75));if(arm.t>=0.75)arm.mode='rest';}
    const wr={x:goal.x-arm.fdir.x*22,y:goal.y-arm.fdir.y*22};
    if(arm.mode==='rest'){arm.hand.x+=(wr.x-arm.hand.x)*Math.min(1,dt*8);arm.hand.y+=(wr.y-arm.hand.y)*Math.min(1,dt*8);}
    else{arm.hand.x=wr.x;arm.hand.y=wr.y;}
  }
  // legs
  for(const lg of g.legs){
    lg.t+=dt;
    if(lg.mode==='lift'){lg.lift=ease(lg.t/0.6)*150;if(lg.t<0.45){const want=clamp(P.x-g.x-lg.side*14,lg.baseFx-130,lg.baseFx+130);lg.fx+=(want-lg.fx)*Math.min(1,dt*6);}if(lg.t>=0.75){lg.mode='slam';lg.t=0;}}
    else if(lg.mode==='slam'){lg.lift=150*(1-clamp(lg.t/0.1,0,1));if(lg.t>=0.1){lg.lift=0;lg.mode='recover';lg.t=0;lg.impactNext=true;}}
    else if(lg.mode==='recover'){if(lg.t>0.5)lg.fx=lerp(lg.fx,lg.baseFx,Math.min(1,dt*3));if(lg.t>1.2){lg.fx=lg.baseFx;lg.mode='rest';}}
    else{const w=walking?Math.max(0,Math.sin(g.paceT*2.4+(lg.side<0?0:Math.PI)))*24:0;lg.lift+=(w-lg.lift)*Math.min(1,dt*8);}
  }

  for(const lg of g.legs)if(lg.impactNext){lg.impactNext=false;if(state==='play')stompImpact(g,lg);}
}

/* ---------- player update ---------- */
function updPlayer(dt){
  const p=P;p.anim+=dt;
  if(p.stun>0)p.stun-=dt;if(p.cool>0)p.cool-=dt;if(p.flat>0)p.flat-=dt;
  const free=state==='play'&&p.stun<=0&&p.flat<=0;
  const ix=free?input.x:0,iy=free?input.y:0,jump=free&&input.jumpPressed,up=free&&input.upPressed&&!touchUI;
  if(Math.abs(ix)>0.2)p.face=Math.sign(ix);
  p.shaving=false;p.nearHair=false;p.nearStache=false;
  if(p.mode==='ground'){
    p.vx=lerp(p.vx,ix*RUN,Math.min(1,dt*12));p.x=clamp(p.x+p.vx*dt,-WORLDX,WORLDX);p.y=-8;
    p.grip=Math.min(1,p.grip+dt*0.5);
    if(jump||up){p.mode='air';p.vy=-JUMPV;p.vx=ix*RUN;SFX.jump();}
  }else if(p.mode==='ledge'){
    const pl=G.plats[p.plat];if(!pl){p.mode='air';p.vy=0;return;}
    const len=Math.hypot(pl.b.x-pl.a.x,pl.b.y-pl.a.y)||1;p.pt+=ix*RUN*0.7*dt/len;
    const pos=lerpP(pl.a,pl.b,clamp(p.pt,0,1));p.x=pos.x;p.y=pos.y-8;
    if(p.pt<0||p.pt>1){const ex=lerpP(pl.a,pl.b,p.pt);p.x=ex.x;p.y=ex.y-8;const o=partAt(p.x,p.y+4);
      if(o&&p.grip>0.05)attach(o,p.x,p.y+4);else{p.mode='air';p.vx=ix*RUN*0.7;p.vy=0;p.cool=0.15;}return;}
    if(iy>0.6){const o=partAt(p.x,p.y+14);if(o){attach(o,p.x,p.y+14);return;}}
    if(jump||up){p.mode='air';p.vy=-JUMPV;p.vx=ix*RUN*0.8;p.cool=0.25;SFX.jump();return;}
    p.grip=Math.min(1,p.grip+dt*0.45);
    if(G.shake&&G.shake.t>G.shake.warn+0.2&&(pl.part.k==='head'||pl.part.k==='hat')){knock(Math.random()<0.5?-1:1,0.7);popup('Whoa!',p.x,p.y-20);}
  }else if(p.mode==='cling'){
    const part=G.parts[p.part];if(!part){p.mode='air';p.vy=0;return;}
    let w=apply(part.T,p.lx,p.ly);p.x=w.x;p.y=w.y;
    if(!insidePart(part,p.x,p.y,0.5)){const o=partAt(p.x,p.y);if(o)attach(o,p.x,p.y);else pullInside(part);}
    if(jump){p.mode='air';p.part=null;p.vx=ix*230;p.vy=iy>0.4?40:-300;p.cool=iy>0.4?0.9:0.3;SFX.jump();return;}
    if(ix||iy)climbMove(ix*CLIMB*dt,iy*CLIMB*dt);
    if(p.mode!=='cling')return;
    scanHair();
    if(free&&input.shave){p.shaving=true;doShave(dt);}
    let drain=1/16;
    if(G.shake&&G.shake.t>G.shake.warn)drain*=['head','neck','hat'].includes(p.part)?5:2;
    else if(G.jit>1)drain*=1.8;
    const arm=G.arms.find(a=>onArm(p.part,a.side));if(arm&&arm.mode!=='rest')drain*=1.6;
    if(state!=='play')drain=0;
    p.grip-=drain*dt;
    if(p.grip<=0){p.grip=0;p.mode='air';p.part=null;p.vx=0;p.vy=0;p.cool=0.6;stats.falls++;popup('Lost grip!',p.x,p.y-20,'#ffd1c4');SFX.whoosh();}
  }else{
    p.vy=Math.min(p.vy+GRAV*dt,760);
    if(p.stun<=0){p.vx+=ix*520*dt;p.vx=clamp(p.vx,-260,260);}
    p.vx*=1-Math.min(1,dt*0.6);
    const y0=p.y;p.x=clamp(p.x+p.vx*dt,-WORLDX,WORLDX);p.y+=p.vy*dt;
    if(p.vy>0)for(const k in G.plats){const pl=G.plats[k],dx=pl.b.x-pl.a.x;if(Math.abs(dx)<1)continue;const t=(p.x-pl.a.x)/dx;if(t<0||t>1)continue;
      const py=lerp(pl.a.y,pl.b.y,t);if(y0+8<=py+6&&p.y+8>=py){p.vy=0;toLedge(k,t);p.y=py-8;return;}}
    if(p.y>=-8){p.y=-8;if(p.vy>640&&p.stun<=0){p.stun=0.6;popup('Oof',p.x,p.y-22);}if(p.vy>200)SFX.land();p.vy=0;p.mode='ground';return;}
    if(p.cool<=0&&p.stun<=0&&p.grip>0.12&&state==='play'){const o=partAt(p.x,p.y);if(o){attach(o,p.x,p.y);SFX.grab();}}
  }
}
function scanHair(){
  const p=P,hl=toLocal(G.parts.head.T,p.x,p.y),nl=toLocal(G.parts.neck.T,p.x,p.y);
  for(const h of hairs){const l=h.p==='head'?hl:nl,dx=h.x-l.x,dy=h.y-l.y,d2=dx*dx+dy*dy;
    if(h.prot){if(d2<30*30)p.nearStache=true;}else if(h.len>=SMOOTH_T&&d2<44*44)p.nearHair=true;}
}
function doShave(dt){
  const p=P,rx=p.x+p.face*2,ry=p.y,R2=RAZOR*RAZOR;

      if(h.len>0.12){cut++;if(h.prot&&h.len>SMOOTH_T)stache++;
        if(particles.length<260&&Math.random()<0.4){const w=apply(G.parts[h.p].T,h.x,h.y);particles.push({k:'hair',x:w.x,y:w.y,vx:rnd(-40,40),vy:rnd(-50,10),life:rnd(0.8,1.4),t:0,a:rnd(0,TAU)});}}
      h.len=0;}}

    showBanner('NOT THE MUSTACHE!','The clock jumps 3 minutes.',2,'#ffb3a1');announce('Not the mustache! The clock jumps three minutes.');}

/* ---------- main update ---------- */
let lastSmooth=0;
function update(dt){
  stT+=dt;
  if(state==='play'){
    clock+=dt/L.secPerMin;
    const left=60-clock;lastTick+=dt;const iv=left<5?0.5:1;
    if(lastTick>=iv){lastTick=0;SFX.tick(left<5?0.16:0.05);}
    if(left<=5&&!hintT.five){hintT.five=1;showBanner('4:55','Five minutes to five!',1.8,'#ffd27a');}
  }
  updGiant(dt);
  if(state==='play'||state==='win'||state==='lose')updPlayer(dt);
  // stubble growth
  if(state==='play'){const prog=clamp(clock/60,0,1),rate=SMOOTH_T/L.growSecs*(1+1.5*prog*prog);
    for(const h of hairs)if(h.len<1)h.len=Math.min(1,h.len+rate*dt*h.gr*(h.prot?1.4:1));}
  else if(state==='lose'){for(const h of hairs)h.len=Math.min(1.6,h.len+dt*(0.5+Math.random()*0.5));}
  if(state==='play'){
    lastSmooth=smoothness();
    if(lastSmooth>=GOAL)doWin();else if(clock>=60)doLose();
  }
  if(state==='win'&&stT>3&&!hintT.shown){hintT.shown=1;showResult(true);}
  if(state==='lose'){if(stT>3.6&&!hintT.lb){hintT.lb=1;showBanner('FIVE O’CLOCK SHADOW','',3,'#ffcf9a');}if(stT>5.6&&!hintT.shown){hintT.shown=1;showResult(false);}}
  if(state!=='win'&&state!=='lose')hintT.shown=hintT.lb=0;
  if(state!=='play')hintT.five=0;
  // particles
  for(const q of particles){q.t+=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;
    if(q.k==='hair'){q.vy+=380*dt;q.a+=dt*6;if(q.y>-1){q.y=-1;q.vy=0;q.vx*=0.8;}}
    else if(q.k==='dust'){q.vy+=120*dt;q.vx*=1-dt*1.5;}
    else if(q.k==='foam'){q.vy+=60*dt;}
    else if(q.k==='spark'){q.vy+=20*dt;}}
  particles=particles.filter(q=>q.t<q.life);
  for(const u of popups){u.t+=dt;u.y-=dt*28;}popups=popups.filter(u=>u.t<1.2);
  if(banner){banner.t+=dt;if(banner.t>banner.dur)banner=null;}
  shakeAmt=Math.max(0,shakeAmt-dt*30);
  updCam(dt);
  if(AC&&razorG){const want=(P&&P.shaving&&!muted)?0.025+Math.min(0.22,P.cutRate*0.004):0;razorG.gain.setTargetAtTime(want,AC.currentTime,0.03);
    droneG.gain.setTargetAtTime(muted?0:(state==='play'?0.025+0.06*clamp(clock/60,0,1):0.018),AC.currentTime,0.5);}
}
function updCam(dt){
  let tx,ty,tvh;const gh=giantHeight();
  if(state==='menu'||state==='intro'){tx=G.x;ty=-gh/2;tvh=gh*1.25;}
  else if(state==='win'||state==='lose'){const hc=headCenter();tx=lerp(P.x,hc.x,0.6);ty=lerp(P.y,hc.y,0.6)+40;tvh=720;}
  else if(P.mode==='ground'){tx=lerp(P.x,G.x,0.4);ty=P.y-120;tvh=760;}
  else{tx=P.x;ty=P.y+(touchUI?80:30);tvh=520;}
  cam.vh+=(tvh-cam.vh)*Math.min(1,dt*2);
  const minW=(state==='play'&&P.mode==='ground')?720:380;
  cam.s=Math.min(H/cam.vh,W/minW);
  if(panelOpen&&W>=900)tx-=W*0.2/cam.s;
  const k=Math.min(1,dt*(state==='play'?5:2.5));cam.x+=(tx-cam.x)*k;cam.y+=(ty-cam.y)*k;
  const vh=H/cam.s,maxY=vh*(touchUI&&state==='play'?0.34:0.24)-vh/2;if(cam.y>maxY)cam.y=maxY;
}

/* ---------- drawing helpers ---------- */
function rr(x,y,w,h,r){ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function pathShape(s){
  ctx.beginPath();
  if(s.k==='cap'){const a=Math.atan2(s.by-s.ay,s.bx-s.ax);ctx.arc(s.bx,s.by,s.r,a-Math.PI/2,a+Math.PI/2);ctx.arc(s.ax,s.ay,s.r,a+Math.PI/2,a+Math.PI*1.5);ctx.closePath();}
  else if(s.k==='ell')ctx.ellipse(s.cx,s.cy,s.rx,s.ry,0,0,TAU);
  else rr(s.cx-s.hw,s.cy-s.hh,s.hw*2,s.hh*2,s.r);
}
function withT(T,fn){ctx.save();ctx.translate(T.x,T.y);ctx.rotate(T.a);fn();ctx.restore();}
function lightOff(T){const wx=10,wy=-7,c=Math.cos(-T.a),s=Math.sin(-T.a);return [wx*c-wy*s,wx*s+wy*c];}
function drawPart(pt,base,dark,extra,after){
  withT(pt.T,()=>{
    const s=pt.s,[ox,oy]=lightOff(pt.T);
    pathShape(s);ctx.fillStyle=dark;ctx.fill();

/* ---------- background ---------- */
const mesa=[];(function(){let x=0;while(x<1800){const w=rnd(90,260),h=rnd(40,140);mesa.push([x,0],[x+w*0.12,h],[x+w*0.88,h*rnd(0.85,1)],[x+w,0]);x+=w+rnd(-30,60);}})();
const ruins=[];(function(){let x=0;while(x<2400){const t=Math.random();ruins.push({x,t:t<0.4?'arch':t<0.75?'col':'broken',w:rnd(30,70),h:rnd(60,150)});x+=rnd(140,320);}})();
const rocks=[];for(let i=0;i<90;i++)rocks.push({x:rnd(-2600,2600),y:rnd(4,90),w:rnd(4,16),h:rnd(3,8)});
const birds=[];for(let i=0;i<5;i++)birds.push({x:Math.random(),y:rnd(0.15,0.45),sp:rnd(0.004,0.01),ph:rnd(0,TAU)});
function skyColors(p){
  return {top:mixc('#6fb3e4',p<0.7?'#7a6fb4':'#3c2b62',p<0.7?p/0.7*0.55:0.55+(p-0.7)/0.3*0.45),
    mid:mixc('#bfe0ef','#ff9a5c',p),hor:mixc('#fff0c8','#ffc070',p),far:mixc('#b6a8c4','#7b4e78',p),mid2:mixc('#9b8aa6','#5b3557',p),
    sand:mixc('#d9b57a','#c98b57',p),sand2:mixc('#b88f58','#8d5a3e',p)};
}
function drawBackground(prog){
  const p=clamp(prog,0,1.15),C=skyColors(Math.min(1,p));
  const gy=H/2+(0-cam.y)*cam.s;
  const bgY=H*0.8+(gy-H*0.8)*0.33;
  const g=ctx.createLinearGradient(0,bgY-H*1.5,0,bgY);g.addColorStop(0,C.top);g.addColorStop(0.65,C.mid);g.addColorStop(1,C.hor);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(p>1){ctx.fillStyle=`rgba(30,10,40,${(p-1)*3})`;ctx.fillRect(0,0,W,H);}
  // sun
  const sx=W*0.8,sy=bgY-lerp(H*0.62,H*0.05,Math.min(1,p)),sr=Math.max(26,Math.min(W,H)*0.06);
  const sg=ctx.createRadialGradient(sx,sy,sr*0.3,sx,sy,sr*5);sg.addColorStop(0,'rgba(255,240,200,0.9)');sg.addColorStop(0.2,'rgba(255,210,140,0.35)');sg.addColorStop(1,'rgba(255,200,120,0)');
  ctx.fillStyle=sg;ctx.fillRect(0,0,W,H);

  // birds
  ctx.strokeStyle='rgba(40,25,40,0.55)';ctx.lineWidth=1.6;

  for(let rep=-1;rep<2;rep++){ctx.beginPath();ctx.moveTo(-off1+rep*1800,bgY+2);for(const [x,h] of mesa)ctx.lineTo(-off1+rep*1800+x,bgY-h*k*0.7);ctx.lineTo(-off1+rep*1800+1800,bgY+2);ctx.fill();}

    else if(r.t==='broken'){ctx.moveTo(x,bgY);ctx.lineTo(x,bgY-h*0.6);ctx.lineTo(x+w*0.2,bgY-h*0.5);ctx.lineTo(x+w*0.4,bgY-h*0.7);ctx.lineTo(x+w*0.4,bgY);}
    else{ctx.rect(x,bgY-h,w*0.28,h);ctx.rect(x+w*1.2,bgY-h,w*0.28,h);ctx.rect(x,bgY-h-w*0.3,w*1.48,w*0.3);}
    ctx.fill();}
  // haze and far plain
  const hz=ctx.createLinearGradient(0,bgY-60,0,bgY+10);hz.addColorStop(0,'rgba(255,230,190,0)');hz.addColorStop(1,`rgba(255,215,170,${0.35})`);

function drawGround(prog){

  ctx.fillStyle='rgba(60,35,25,0.25)';for(const r of rocks){ctx.beginPath();ctx.ellipse(r.x,r.y,r.w,r.h,0,0,TAU);ctx.fill();}

}

function drawStubble(which){
  const buckets=[[],[],[],[],[]];
  for(const h of hairs){if(h.p!==which||h.prot||h.len<0.12)continue;const L_=h.len;buckets[L_<0.35?0:L_<0.6?1:L_<0.85?2:L_<1.1?3:4].push(h);}
  const al=[0.06,0.12,0.19,0.27,0.36];
  for(let b=0;b<5;b++){if(!buckets[b].length)continue;ctx.beginPath();for(const h of buckets[b]){ctx.moveTo(h.x+4.9,h.y);ctx.arc(h.x,h.y,4.9,0,TAU);}ctx.fillStyle=`rgba(50,62,92,${al[b]})`;ctx.fill();}
  ctx.beginPath();
  for(const h of hairs){if(h.p!==which||h.prot||h.len<0.2)continue;const k=1+Math.min(h.len,1.6)*3.3;ctx.moveTo(h.x,h.y);ctx.lineTo(h.x+h.dx*k,h.y+h.dy*k);}
  ctx.strokeStyle='rgba(30,22,22,0.85)';ctx.lineWidth=1.15;ctx.lineCap='round';ctx.stroke();
  if(which==='head'&&G.L.stache){
    ctx.beginPath();for(const h of hairs){if(!h.prot||h.len<0.15)continue;const r=1.6+2.8*Math.min(h.len,1.1);ctx.moveTo(h.x+r,h.y);ctx.arc(h.x,h.y,r,0,TAU);}
    ctx.fillStyle=G.L.hair;ctx.fill();
    ctx.beginPath();for(const h of hairs){if(!h.prot||h.len<0.3)continue;const k=2+Math.min(h.len,1.3)*5;ctx.moveTo(h.x,h.y);ctx.lineTo(h.x+h.dx*k,h.y+h.dy*k);}
    ctx.strokeStyle=shade(G.L.hair,0.62);ctx.lineWidth=1.3;ctx.lineCap='round';ctx.stroke();
    ctx.beginPath();for(const h of hairs){if(!h.prot||h.len<0.6||h.y>G.parts.head.s.cy+G.L.headRy*0.3)continue;ctx.moveTo(h.x-1.5,h.y-1.5);ctx.lineTo(h.x+h.dx*4,h.y-2);}
    ctx.strokeStyle='rgba(255,230,190,0.45)';ctx.lineWidth=1;ctx.stroke();
  }
}

    return(withTitle?`<div class="hh-t"><span>Put ${e(code)} on your Home Screen</span><button type="button" class="hh-x" aria-label="Close">×</button></div>`:'')+
      `<p class="hh-lead">${s.lead}</p>`+(s.list.length?`<ol class="hh-steps">${s.list.map(l=>`<li>${l}</li>`).join('')}</ol>`:'')+(s.note?`<p class="hh-note">${s.note}</p>`:'')+
      `<div class="hh-btns">${prompt?`<button type="button" class="hh-b hh-go" data-hh="install">Install ${e(code)}</button>`:''}${s.copy&&url?'<button type="button" class="hh-b" data-hh="copy">Copy link</button>':''}${withTitle?'<button type="button" class="hh-b" data-hh="later">Not now</button>':''}<span class="hh-msg" aria-live="polite"></span></div>`;
  }
  if(!d.getElementById('hh-style')){const st=d.createElement('style');st.id='hh-style';st.textContent=
`#hh{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:9999;max-width:520px;margin:0 auto;background:var(--panel,#fff);color:var(--ink,#1b1f24);border:1px solid var(--edge,#c3c9d2);border-radius:16px;box-shadow:0 10px 32px rgba(0,0,0,.28);padding:12px 14px 10px;font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}

.hh-note,.hh-msg{color:var(--muted,#5b6470);font-size:13px;margin:4px 0}.hh-btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.hh-b{min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--edge,#c3c9d2);background:var(--chip,#e9edf2);color:inherit;font:inherit;font-weight:600;cursor:pointer}
.hh-go{background:var(--accent,#0E7C7B);color:var(--accent-ink,#fff);border-color:transparent}

@media (prefers-color-scheme:dark){#hh{background:var(--panel,#1d2229);color:var(--ink,#e8ebef);border-color:var(--edge,#3a424d)}.hh-i,.hh-b{background:var(--chip,#2a313a)}}`;
    d.head.appendChild(st)}
  const phone=where==='ios'||where==='ios-app'||where==='android'||where==='android-app';
  let later=0;try{later=+localStorage.getItem(key)||0}catch(x){}
  let card=null;
  function wire(box){box.addEventListener('click',async ev=>{
    const b=ev.target.closest('[data-hh],.hh-x');if(!b)return;const m=box.querySelector('.hh-msg'),act=b.dataset.hh||'later';
    if(act==='install'&&prompt){prompt.prompt();try{const r=await prompt.userChoice;if(r&&r.outcome==='accepted')hide()}catch(x){}prompt=null;draw()}
    else if(act==='copy'){try{await navigator.clipboard.writeText(url);if(m)m.textContent='Link copied.'}catch(x){if(m)m.textContent=url}}
    else if(act==='later'){try{localStorage.setItem(key,String(Date.now()))}catch(x){}hide()}
  })}
  function hide(){if(card){card.remove();card=null}}
  function draw(){
    if(cfg.mount){cfg.mount.innerHTML=html(false);if(!cfg.mount.dataset.hh){cfg.mount.dataset.hh='1';wire(cfg.mount)}}
    if(card)card.innerHTML=html(true);
  }
  if(phone&&Date.now()-later>30*864e5){card=d.createElement('div');card.id='hh';card.setAttribute('role','dialog');card.setAttribute('aria-label','Put '+code+' on your Home Screen');d.body.appendChild(card);wire(card)}
  window.addEventListener('beforeinstallprompt',ev=>{ev.preventDefault();prompt=ev;draw()});
  window.addEventListener('appinstalled',()=>{hide()});
  draw();
  return where;
}
