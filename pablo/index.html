<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#2f6f3e">
<title>Pablo vs. Oakley</title>
<!--
  Pablo vs. Oakley — v0.2, 2026-11-27
  Game idea by Sam: Pablo, who is 14, runs a spike course with 3 lives, puts Oakley the dinosaur
  to sleep with sleepy darts, and rescues the man Oakley grabbed.
  One self-contained file: no outside code, fonts, pictures or sounds. All art is drawn
  and all sound is made in the browser. Built by Claude with Dave Schwartz. GPL-3.0.
-->
<style>
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
--panel:#fffaf0;--ink:#1f2a1c;--muted:#5b6656;--accent:#c2410c;--btn:#1f2a1c;--btnInk:#fffaf0;--line:rgba(31,42,28,.22);
--pad:rgba(255,250,240,.93);--padInk:#1f2a1c;--padLine:rgba(31,42,28,.45);--bg:#7cc4f5;
--font:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root{--panel:#1c211b;--ink:#eef3e8;--muted:#b9c4b2;--accent:#fdba74;--btn:#eef3e8;--btnInk:#1c211b;--line:rgba(238,243,232,.24);
--pad:rgba(30,36,29,.93);--padInk:#eef3e8;--padLine:rgba(238,243,232,.45);--bg:#0b1635}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{position:fixed;inset:0;font:17px/1.45 var(--font);color:var(--ink)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid #2563eb;outline-offset:2px}
@media (prefers-color-scheme:dark){:focus-visible{outline-color:#93c5fd}}
.hide{visibility:hidden}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:0}

#hud{position:fixed;left:0;right:0;top:0;z-index:3;display:flex;align-items:center;gap:10px;max-width:560px;margin:0 auto;
padding:calc(8px + var(--sat)) calc(10px + var(--sar)) 6px calc(10px + var(--sal))}
.ib{flex:none;width:48px;height:48px;border-radius:15px;border:2px solid var(--padLine);background:var(--pad);color:var(--padInk);display:grid;place-items:center;padding:0}
#prog{flex:1;min-width:0}
#progLbl{margin:0 0 4px;font-weight:800;font-size:15px;line-height:1;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.75);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar{height:16px;border-radius:10px;background:rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.85);overflow:hidden}
#fill{height:100%;width:0;background:linear-gradient(90deg,#fde047,#fb923c);border-radius:8px}
#bar.sleepy #fill{background:linear-gradient(90deg,#c4b5fd,#7c3aed)}
#hearts{flex:none;display:flex;gap:3px;padding:6px 8px;border-radius:14px;background:rgba(0,0,0,.32)}
#hearts svg{display:block}
#hearts .off{opacity:.28}

/* touch controls, as in Five O'Clock Shadow of the Colossus: a thumbstick that appears where the thumb lands, and round buttons */
#touch{position:fixed;inset:0;z-index:3;pointer-events:none;display:none}
body.touch #touch:not(.hide){display:block}
#joyZone{position:absolute;left:0;bottom:0;width:55%;height:62%;pointer-events:auto;touch-action:none}
.joy{position:absolute;border-radius:50%;pointer-events:none}
#joyBase{width:124px;height:124px;margin:-62px 0 0 -62px;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.6)}
#joyBase::before,#joyBase::after{content:"";position:absolute;top:50%;margin-top:-9px;border:9px solid transparent}
#joyBase::before{left:9px;border-left:0;border-right:12px solid rgba(255,255,255,.7)}
#joyBase::after{right:9px;border-right:0;border-left:12px solid rgba(255,255,255,.7)}
#joyKnob{width:58px;height:58px;margin:-29px 0 0 -29px;background:rgba(255,255,255,.75);box-shadow:0 2px 10px rgba(0,0,0,.35)}
#joyZone.idle .joy{opacity:.6}
.tb{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px;letter-spacing:.04em;box-shadow:0 4px 14px rgba(0,0,0,.35)}
#bJ{right:calc(16px + var(--sar));bottom:calc(30px + var(--sab));width:100px;height:100px;background:rgba(251,191,36,.92);color:#2b1d12;border:3px solid rgba(255,255,255,.8)}
#bD{right:calc(128px + var(--sar));bottom:calc(14px + var(--sab));width:80px;height:80px;background:rgba(167,139,250,.92);color:#1e1240;border:3px solid rgba(255,255,255,.7)}
.tb.on{transform:scale(.92);filter:brightness(1.15)}
#bD.hot{animation:hot .5s ease-in-out infinite alternate}
@keyframes hot{to{transform:scale(1.07);border-color:#fde047}}
.ib svg{display:block;pointer-events:none}
.tb span{pointer-events:none}
#safe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
@media (orientation:landscape) and (max-height:520px){#hud{max-width:620px}}

#overlay{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;
padding:calc(12px + var(--sat)) calc(14px + var(--sar)) calc(12px + var(--sab)) calc(14px + var(--sal));pointer-events:none}
#overlay[hidden]{display:none}
#overlay.top{align-items:flex-start;padding-top:calc(18px + var(--sat))}
.panel{pointer-events:auto;background:var(--panel);color:var(--ink);border-radius:22px;width:100%;max-width:460px;max-height:100%;overflow:auto;-webkit-overflow-scrolling:touch;
touch-action:pan-y;padding:20px 18px 16px;box-shadow:0 22px 60px rgba(0,0,0,.5);outline:none;-webkit-user-select:text;user-select:text}
h1,h2{margin:0 0 8px;font-weight:900;line-height:1.08;letter-spacing:.01em}
h1{font-size:clamp(30px,9.5vw,42px);color:var(--accent)}
h2{font-size:clamp(26px,8vw,34px)}
p{margin:0 0 12px}
.lead{font-size:18px}
.muted{color:var(--muted);font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 12px}
.b{flex:1 1 140px;min-height:52px;border-radius:16px;border:2px solid var(--btn);background:transparent;color:var(--ink);font-weight:800;font-size:18px;padding:8px 14px}
.b.go{background:var(--btn);color:var(--btnInk);font-size:21px;min-height:60px}
details{border-top:1px solid var(--line)}
summary{min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:800;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:24px;font-weight:700;color:var(--muted);width:24px;text-align:center}
details[open]>summary::after{content:"\2212"}
details>div{padding:0 0 6px}
ul{margin:0 0 12px;padding-left:22px}
li{margin:0 0 7px}
@media (prefers-reduced-motion:reduce){#bD.hot{animation:none;border-color:#fde047}}
</style>

<body>
<canvas id="c" role="img" aria-label="Pablo's spike course, with Oakley the dinosaur's den at the end."></canvas>

<div id="hud" class="hide">
  <button class="ib" id="bP" aria-label="Pause"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="4" y="3" width="5" height="16" rx="1.5" fill="currentColor"/><rect x="13" y="3" width="5" height="16" rx="1.5" fill="currentColor"/></svg></button>
  <div id="prog">
    <p id="progLbl">Spike Course</p>
    <div id="bar" role="progressbar" aria-label="How far along the course" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="fill"></div></div>
  </div>
  <div id="hearts" role="img" aria-label="Lives: 3"></div>
</div>

<div id="touch" class="hide" aria-hidden="true">
  <div id="joyZone" class="idle"><div id="joyBase" class="joy"></div><div id="joyKnob" class="joy"></div></div>
  <button id="bD" class="tb" type="button" tabindex="-1"><span>DART</span></button>
  <button id="bJ" class="tb" type="button" tabindex="-1"><span>JUMP</span></button>
</div>
<div id="safe"></div>

<div id="overlay"><div class="panel" id="panel" tabindex="-1"></div></div>
<p id="live" class="sr" aria-live="polite"></p>
<noscript><p style="position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center">This game needs JavaScript. Open it in a web browser.</p></noscript>

<script>
(() => {
'use strict';
const VERSION = '0.2', DATE = '27 November 2026';

/* ---------- things that are easy to change ---------- */
const CONFIG = {
  LIVES: 3,          // lose them all and Pablo goes back to the very beginning (Sam's rule)
  SLEEPY_DARTS: 10,  // sleepy darts it takes to put Oakley to sleep
  SHAKE_EVERY: 3,    // after this many darts Oakley shakes it off, roars and charges
  DART_WAIT: 0.45    // seconds between sleepy darts
};

/* ---------- how Pablo moves (world units; 1 unit is about 1 screen pixel on a phone) ---------- */
const RUN = 220, ACC = 2600, AIR = 1600, GRAV = 2300, JUMPV = 880, MAXFALL = 1100, COYOTE = 0.1, BUFFER = 0.15;
const VIEW_W = 380, DEN_VIEW = 600, VIEW_H = 340;   // the least of the world every screen shows (zooms out for Oakley's den)
const START_X = 80;
const ARENA_L = 5000, ARENA_W = 560, ARENA_R = ARENA_L + ARENA_W, CAGE_W = 72, CAGE_L = ARENA_R - 80;
const OAK_MIN = ARENA_L + 90, OAK_MAX = CAGE_L - 90, ARENA_SPAWN = ARENA_L + 46;   // a charge goes right up to the wall

/* ---------- the course ---------- */
const LV = {
  ground: [[-400, 860], [960, 1900], [2020, 2300], [2580, 3500], [3620, 4100], [4300, ARENA_R + 400]],
  plats: [{ x: 1450, y: 80, w: 140 }, { x: 2790, y: 90, w: 80 }, { x: 2940, y: 140, w: 90 }],
  movers: [{ x: 2330, y: 40, w: 90, ax: 120, ay: 0, per: 3.6 }, { x: 4165, y: 30, w: 70, ax: 0, ay: 70, per: 2.6 }],
  spikes: [{ x: 420, w: 40 }, { x: 640, w: 60 }, { x: 1100, w: 40 }, { x: 1220, w: 40 }, { x: 1400, w: 230 }, { x: 2760, w: 280 },
    { x: 4480, w: 40 }, { x: 4600, w: 40 }, { x: 4720, w: 40 }],
  balls: [{ x: 2150, r: 18, h: 150, per: 1.5, ph: 0 }, { x: 3740, r: 18, h: 150, per: 1.3, ph: 0.5 }],
  pops: [{ x: 3300, w: 80, per: 2.0, ph: 0 }, { x: 3880, w: 90, per: 1.8, ph: 0.3 }],
  flags: [1760, 3150, 4790],
  signs: [{ x: 300, t: 'Jump the spikes!' }, { x: 790, t: 'Jump the gap!' }, { x: 1330, t: 'Hop up!' }, { x: 2075, t: 'Wait for it…' },
    { x: 2235, t: 'Ride the log!' }, { x: 3220, t: 'Spikes pop up!' }, { x: 4890, t: 'DANGER: DINO!', red: true }]
};
const CPS = [START_X].concat(LV.flags);

const $ = id => document.getElementById(id);
const cv = $('c'), g = cv.getContext('2d');
const FONT = 'ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const mqDark = matchMedia('(prefers-color-scheme: dark)');
let dark = mqDark.matches;
if (mqDark.addEventListener) mqDark.addEventListener('change', e => { dark = e.matches; });

/* ---------- storage (best effort; every key starts with "pablo:") ---------- */
const store = {
  ok: true,
  get(k) { try { return localStorage.getItem('pablo:' + k); } catch (e) { this.ok = false; return null; } },
  set(k, v) { try { localStorage.setItem('pablo:' + k, String(v)); } catch (e) { this.ok = false; } }
};
store.set('v', VERSION);
let best = parseFloat(store.get('best')); if (!(best > 5 && best < 36000)) best = 0;   // fastest rescue, in seconds
let soundOn = store.get('sound') !== '0';
let fold = { how: true, facts: false, about: false, credits: false };
try { const f = JSON.parse(store.get('fold') || '{}'); for (const k in fold) if (typeof f[k] === 'boolean') fold[k] = f[k]; } catch (e) {}

/* ---------- sound: everything is made here, nothing is loaded ---------- */
const A = {
  ctx: null, master: null,
  init() {
    try {
      if (!this.ctx) {
        const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
        this.ctx = new C(); this.master = this.ctx.createGain(); this.master.gain.value = 0.55; this.master.connect(this.ctx.destination);
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) { this.ctx = null; }
  },
  tone(f0, f1, dur, type, vol, delay) {
    if (!soundOn || !this.ctx) return;
    try {
      const c = this.ctx, t = c.currentTime + (delay || 0), o = c.createOscillator(), gn = c.createGain();
      o.type = type || 'sine'; o.frequency.setValueAtTime(f0, t);
      if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
      gn.gain.setValueAtTime(0.0001, t); gn.gain.linearRampToValueAtTime(vol || 0.3, t + 0.012); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(gn); gn.connect(this.master); o.start(t); o.stop(t + dur + 0.04);
    } catch (e) {}
  },
  noise(dur, vol, freq, delay) {
    if (!soundOn || !this.ctx) return;
    try {
      const c = this.ctx, t = c.currentTime + (delay || 0), n = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const s = c.createBufferSource(), f = c.createBiquadFilter(), gn = c.createGain();
      s.buffer = buf; f.type = 'lowpass'; f.frequency.value = freq || 1000; gn.gain.value = vol || 0.3;
      s.connect(f); f.connect(gn); gn.connect(this.master); s.start(t);
    } catch (e) {}
  }
};
const sfx = {
  jump() { A.tone(320, 700, 0.15, 'square', 0.1); },
  land() { A.noise(0.05, 0.1, 500); },
  pew() { A.tone(1300, 500, 0.09, 'triangle', 0.22); A.noise(0.06, 0.1, 2500); },
  zz() { A.tone(620, 300, 0.25, 'sine', 0.3); A.tone(420, 220, 0.3, 'sine', 0.2, 0.12); },
  ouch() { A.tone(700, 180, 0.35, 'square', 0.13); },
  boing() { A.tone(220, 660, 0.2, 'sine', 0.32); },
  roar(k) { k = k || 1; A.noise(0.9 * k, 0.45, 380); A.tone(130, 70, 0.9 * k, 'sawtooth', 0.2); A.tone(196, 90, 0.8 * k, 'sawtooth', 0.12, 0.05); },
  chomp() { A.noise(0.06, 0.5, 1400); A.tone(160, 80, 0.12, 'square', 0.22); A.noise(0.05, 0.4, 1400, 0.09); },
  stomp() { A.tone(90, 45, 0.12, 'sine', 0.4); A.noise(0.08, 0.2, 200); },
  bonk() { A.tone(160, 60, 0.3, 'triangle', 0.5); A.noise(0.25, 0.35, 600); },
  yawn() { A.tone(330, 140, 1.1, 'sine', 0.25); A.tone(250, 110, 1.0, 'triangle', 0.1, 0.1); },
  snore() { A.noise(0.7, 0.12, 260); A.tone(85, 70, 0.7, 'sine', 0.16); },
  flag() { A.tone(660, 660, 0.12, 'triangle', 0.25); A.tone(990, 990, 0.2, 'triangle', 0.25, 0.12); },
  key() { [1320, 1760, 2093].forEach((f, i) => A.tone(f, f, 0.12, 'sine', 0.18, i * 0.07)); },
  clang() { A.tone(300, 180, 0.4, 'square', 0.1); A.noise(0.3, 0.3, 3000); },
  open() { A.noise(0.3, 0.2, 1800); A.tone(400, 800, 0.3, 'triangle', 0.2); },
  win() { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => A.tone(f, f, 0.22, 'triangle', 0.3, i * 0.13)); },
  over() { [392, 330, 262].forEach((f, i) => A.tone(f, f * 0.98, 0.3, 'triangle', 0.25, i * 0.22)); },
  go() { A.tone(880, 880, 0.12, 'sine', 0.16); },
  help() { A.tone(700, 900, 0.12, 'sine', 0.07); A.tone(900, 700, 0.14, 'sine', 0.07, 0.13); }
};

/* ---------- layout ---------- */
let W = 0, H = 0, DPR = 1, S = 1, vw = VIEW_W, hudB = 60, groundY = 600, wide = false, safeB = 0, safeL = 0, touchUI = false;
function layout() {
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  hudB = $('hud').getBoundingClientRect().bottom || 60;
  wide = W > H && H < 520;
  const sf = getComputedStyle($('safe'));
  safeB = parseFloat(sf.paddingBottom) || 0; safeL = parseFloat(sf.paddingLeft) || 0;
  if (!touchUI) groundY = H - 36 - safeB;          // keyboard: no buttons on screen
  else if (wide) groundY = H - 30 - safeB;         // sideways: the controls sit in the corners, over the ground
  else groundY = H - 150 - safeB;                  // upright: thumbs rest on the ground below Pablo
  placeJoyIdle();
  fitZoom();
  if (G && G.state !== 'menu') G.cam = camGoal();
}
let zoomW = VIEW_W;
function fitZoom() { S = clamp(Math.min(W / zoomW, (groundY - hudB) / VIEW_H), 0.55, 2.2); vw = W / S; }
function zoomGoal() { return G && G.state !== 'menu' && (G.arena || P.x > ARENA_L - 260) ? DEN_VIEW : VIEW_W; }
const sx = x => (x - G.cam) * S, sy = y => groundY - y * S;

/* ---------- moving things: all follow the clock, so they're the same every time ---------- */
function moverAt(m, t) { const k = 0.5 - 0.5 * Math.cos(2 * Math.PI * t / m.per); return { x: m.x + m.ax * k, y: m.y + m.ay * k }; }
function ballY(b, t) { return b.r + b.h * Math.abs(Math.sin(Math.PI * (t / b.per + b.ph))); }
function popK(p, t) {                    // 0 = hidden, 1 = all the way up
  const ph = (((t / p.per + p.ph) % 1) + 1) % 1;
  if (ph < 0.08) return ph / 0.08;
  if (ph < 0.5) return 1;
  if (ph < 0.58) return 1 - (ph - 0.5) / 0.08;
  if (ph > 0.84) return 0.16;            // the tips peek out first, as a warning
  return 0;
}

/* ---------- Pablo's movement and what hurts him (also used by the test bot) ---------- */
function newPablo(x) { return { x, y: 0, vx: 0, vy: 0, py: 0, onG: true, plat: -1, coy: 0, jb: 0, f: 1, lo: -20, hi: CAGE_L - 12, jumped: false, landed: false }; }
function movePablo(s, inp, dt, t) {
  let want = (inp.r ? 1 : 0) - (inp.l ? 1 : 0);
  if (inp.x) want = clamp(want + inp.x, -1, 1);          // the thumbstick: the farther, the faster
  if (want) s.f = want > 0 ? 1 : -1;
  const tv = want * RUN, a = (s.onG ? ACC : AIR) * dt;
  s.vx = s.vx < tv ? Math.min(tv, s.vx + a) : Math.max(tv, s.vx - a);
  if (s.onG && s.plat >= 0) { const m = LV.movers[s.plat], a0 = moverAt(m, t - dt), a1 = moverAt(m, t); s.x += a1.x - a0.x; s.y = a1.y; }
  s.jb = inp.j ? BUFFER : Math.max(0, s.jb - dt);
  s.coy = s.onG ? COYOTE : Math.max(0, s.coy - dt);
  s.jumped = false;
  if (s.jb > 0 && s.coy > 0) { s.vy = JUMPV; s.coy = 0; s.jb = 0; s.onG = false; s.plat = -1; s.jumped = true; }
  const py = s.y; s.py = py;
  s.vy = Math.max(-MAXFALL, s.vy - GRAV * dt);
  s.x += s.vx * dt; s.y += s.vy * dt;
  if (s.x < s.lo) { s.x = s.lo; if (s.vx < 0) s.vx = 0; }
  if (s.x > s.hi) { s.x = s.hi; if (s.vx > 0) s.vx = 0; }
  const wasG = s.onG; s.onG = false; s.plat = -1;
  if (s.vy <= 0) {
    const f0 = s.x - 11, f1 = s.x + 11;
    if (py >= -14 && s.y <= 0) for (const gs of LV.ground) if (f1 > gs[0] && f0 < gs[1]) { s.y = 0; s.vy = 0; s.onG = true; break; }
    if (!s.onG) for (const p of LV.plats) if (py >= p.y - 6 && s.y <= p.y && f1 > p.x && f0 < p.x + p.w) { s.y = p.y; s.vy = 0; s.onG = true; break; }
    if (!s.onG) for (let i = 0; i < LV.movers.length; i++) {
      const m = LV.movers[i], a1 = moverAt(m, t), a0 = moverAt(m, t - dt);
