<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IPAR: Image, Preserve, Analyze, Report</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a cork case board (left) beside a case-file panel (right); stacks on phones. Heritage: the 2015 IPAR teal frame around a tan cork board. */
:root{
  --bg:#e9efed; --chrome:#f5f8f7; --chrome-2:#d6e1de; --line:#c3d1cd;
  --ink:#16272a; --ink-2:#4a5f62; --ink-3:#6d8184;
  --teal:#0d6b6f; --teal-ink:#0a5356; --teal-soft:#d4ebe9;
  --cork:#c69a69; --cork-2:#b9895a; --cork-dot:#a87b4e; --frame:#6e4c2d;
  --string:#b3261e; --contra:#2457a6; --thread:#5b4330;
  --good:#2d7a39; --good-soft:#dcefdc; --warn:#9a6200; --warn-soft:#f6e7c8; --bad:#b3261e; --bad-soft:#f6d9d5;
  --card-ink:#231f1a; --card-ink-2:#5d5448;
  --f-display:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --f-ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1517; --chrome:#11201f; --chrome-2:#1c3133; --line:#29433f;
  --ink:#e3eeec; --ink-2:#a7bbb8; --ink-3:#7f9592;
  --teal:#56c2bd; --teal-ink:#8fe0da; --teal-soft:#16393a;
  --cork:#8d6a46; --cork-2:#7e5e3d; --cork-dot:#6f5234; --frame:#3a2918;
  --string:#e8584c; --contra:#73a0ee; --thread:#2b1f14;
  --good:#71cf7c; --good-soft:#173321; --warn:#e3aa3e; --warn-soft:#3a2c10; --bad:#f06b5f; --bad-soft:#3d1916;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0b1517; --chrome:#11201f; --chrome-2:#1c3133; --line:#29433f;
  --ink:#e3eeec; --ink-2:#a7bbb8; --ink-3:#7f9592;
  --teal:#56c2bd; --teal-ink:#8fe0da; --teal-soft:#16393a;
  --cork:#8d6a46; --cork-2:#7e5e3d; --cork-dot:#6f5234; --frame:#3a2918;
  --string:#e8584c; --contra:#73a0ee; --thread:#2b1f14;
  --good:#71cf7c; --good-soft:#173321; --warn:#e3aa3e; --warn-soft:#3a2c10; --bad:#f06b5f; --bad-soft:#3d1916;
  color-scheme:dark;}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-ui);}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.app{display:grid;grid-template-rows:auto 1fr;grid-template-columns:minmax(0,1fr);height:100%;min-height:0}
/* header */
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--chrome);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font:700 22px/1 var(--f-display);letter-spacing:.06em;color:var(--teal-ink)}
.brand span{font:600 14px/1.2 var(--f-display);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phases{display:flex;gap:4px;flex:1 1 auto;justify-content:center;min-width:0;overflow-x:auto;scrollbar-width:none}
.phase{border:1px solid transparent;background:none;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);display:flex;gap:6px;align-items:center;white-space:nowrap}
.phase[aria-current="true"]{background:var(--teal);color:var(--chrome)}
.phase.done:not([aria-current="true"]){color:var(--teal-ink)}
.phase:disabled{cursor:not-allowed;opacity:.55}
.phase .n{font:600 11px var(--f-mono);opacity:.75}
.status{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--chrome);white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.chip.good{color:var(--good);background:var(--good-soft);border-color:transparent}
.chip.warn{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.chip.bad{color:var(--bad);background:var(--bad-soft);border-color:transparent}
.btn{border:1px solid var(--line);background:var(--chrome);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600}
.btn:hover{border-color:var(--teal)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--chrome)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* stage */
.stage{display:grid;grid-template-columns:minmax(0,1fr) 420px;min-height:0}
.boardwrap{position:relative;display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--frame);padding:10px}
.boardhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 4px 8px;color:#f4e9da}
.boardhead h2{margin:0;font:600 15px/1.2 var(--f-display);letter-spacing:.03em}
.boardhead h2 small{font:500 12px var(--f-ui);opacity:.75;margin-left:8px;letter-spacing:0}
.boardctl{display:flex;gap:4px}
.boardctl button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:#f4e9da;border-radius:6px;min-width:34px;height:32px;font-size:13px;font-weight:600;padding:0 8px}
.boardctl button[aria-pressed="true"]{background:#f4e9da;color:#3a2918}
#board{flex:1 1 auto;min-height:0;width:100%;border-radius:6px;touch-action:none;user-select:none;-webkit-user-select:none;background:var(--cork);display:block}
.boardlist{flex:1 1 auto;overflow:auto;background:var(--cork);border-radius:6px;padding:12px;display:grid;gap:8px;align-content:start}
.boardlist button{display:flex;gap:10px;align-items:flex-start;text-align:left;background:#fbf7ec;color:var(--card-ink);border:1px solid rgba(0,0,0,.15);border-radius:6px;padding:10px 12px}
.boardlist .k{font:600 11px var(--f-mono);text-transform:uppercase;color:var(--card-ink-2);min-width:76px}
/* panel */
.panel{display:flex;flex-direction:column;min-height:0;background:var(--chrome);border-left:1px solid var(--line)}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 8px}
.tab{flex:1;border:0;background:none;padding:12px 6px 10px;font-size:13px;font-weight:600;color:var(--ink-3);border-bottom:2px solid transparent;position:relative}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--teal)}
.tab .dot{position:absolute;top:8px;margin-left:3px;width:7px;height:7px;border-radius:50%;background:var(--string)}
.panelbody{flex:1 1 auto;overflow:auto;padding:18px 20px 28px;min-height:0}
.kicker{font:600 11px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.ptitle{font:600 23px/1.2 var(--f-display);margin:4px 0 10px;text-wrap:balance}
.pbody{color:var(--ink-2);margin:0 0 12px}
.prompt{font-weight:600;margin:14px 0 10px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:26px 1fr;gap:8px;text-align:left;border:1px solid var(--line);background:var(--chrome);border-radius:8px;padding:10px 12px;line-height:1.4}
.opt:hover:not(:disabled){border-color:var(--teal);background:var(--teal-soft)}
.opt .l{font:700 13px/1.4 var(--f-mono);color:var(--teal-ink)}
.opt:disabled{cursor:default}
.opt.chosen{border-width:2px}
.opt.r-best{border-color:var(--good)} .opt.r-acceptable{border-color:var(--warn)} .opt.r-harmful{border-color:var(--bad)}
.opt.dim{opacity:.55}
.fb{border-radius:8px;padding:12px 14px;margin-top:12px;border:1px solid var(--line);background:var(--chrome)}
.fb.best{background:var(--good-soft);border-color:transparent}
.fb.acceptable{background:var(--warn-soft);border-color:transparent}
.fb.harmful{background:var(--bad-soft);border-color:transparent}
.fb.neutral{background:var(--teal-soft);border-color:transparent}
.fb p{margin:6px 0 0}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font:700 11px/1.5 var(--f-mono);letter-spacing:.05em;text-transform:uppercase}
.pill.best{background:var(--good);color:var(--chrome)} .pill.acceptable{background:var(--warn);color:var(--chrome)} .pill.harmful{background:var(--bad);color:var(--chrome)}
.pill.plain{background:var(--chrome-2);color:var(--ink-2)}
.hint{margin-top:14px;font-size:13px;color:var(--ink-2)}
.hint button{border:0;background:none;color:var(--teal-ink);font-weight:600;padding:0;text-decoration:underline;text-underline-offset:3px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack{display:grid;gap:10px}
select{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--bg);color:var(--ink);font:inherit;min-height:44px}
input[type=text],textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:84px;resize:vertical}
.mono{font-family:var(--f-mono);font-size:12.5px}
.hashgrid{display:grid;gap:6px;margin:10px 0;font:12.5px/1.45 var(--f-mono)}
.hashgrid div{display:grid;grid-template-columns:92px minmax(0,1fr);gap:8px}
.hashgrid span:first-child{color:var(--ink-3);font-family:var(--f-ui);font-size:12px}
.hashgrid code{word-break:break-all}
.needs{display:grid;gap:6px;margin:10px 0;padding:0;list-style:none}
.needs li{display:flex;gap:8px;align-items:center;font-size:14px}
.needs li .box{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--ink-3);display:inline-grid;place-items:center;font-size:12px;flex:none}
.needs li.ok .box{background:var(--good);border-color:var(--good);color:var(--chrome)}
.callout{margin-top:16px;padding:12px 14px;border-radius:8px;background:var(--teal-soft);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
/* bench */
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tool{border:1px solid var(--line);background:var(--chrome);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--chrome);border-color:var(--ink)}
.tool:disabled{opacity:.45;cursor:not-allowed}
.tooldesc{font-size:13px;color:var(--ink-2);margin:0 0 12px}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font:600 11px var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);border-bottom:1px solid var(--line);padding:6px 6px}
.tbl td{border-bottom:1px solid var(--line);padding:7px 6px;vertical-align:top}
.tbl tr.del td{color:var(--bad)}
.tbl tr.vol td{color:var(--ink-3)}
.tbl .name{font-family:var(--f-mono);font-weight:600;white-space:nowrap}
.scroll{overflow-x:auto;max-width:100%}
.entry{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:4px}
.entry.del{border-color:var(--bad)}
.entry .name{font:700 14px var(--f-mono)}
.entry .meta{font:12px/1.5 var(--f-mono);color:var(--ink-2)}
.entry .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.sm{border:1px solid var(--line);background:var(--chrome);border-radius:6px;padding:3px 9px;font-size:12px;font-weight:600}
.sm.pin{border-color:var(--string);color:var(--string)}
.sm.pin[disabled]{border-color:var(--line);color:var(--ink-3)}
.hex{font:12px/1.55 var(--f-mono);white-space:pre;overflow-x:auto;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
.hex .z{color:var(--ink-3)} .hex .e5{background:var(--bad);color:var(--chrome);border-radius:2px} .hex .sig{background:var(--teal);color:var(--chrome);border-radius:2px} .hex .off{color:var(--teal-ink)}
.filetext{font:12.5px/1.55 var(--f-mono);white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;max-height:300px;overflow:auto}
.cmp mark{background:var(--warn-soft);color:var(--ink);border-bottom:2px solid var(--warn);padding:0 1px}
.cmpcols{display:grid;grid-template-columns:1fr;gap:10px}
.progress{height:6px;background:var(--chrome-2);border-radius:3px;overflow:hidden;margin:8px 0}
.progress i{display:block;height:100%;background:var(--teal);width:0;transition:width .5s}
.imgprev{border:1px solid var(--line);border-radius:8px;max-width:100%;display:block;margin-top:8px}
/* inbox & evidence lists */
.msg{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px;background:var(--chrome)}
.msg.unread{border-left:3px solid var(--string)}
.msg h4{margin:2px 0 6px;font:600 16px/1.3 var(--f-display)}
.msg p{margin:6px 0 0;color:var(--ink-2);font-size:14px}
.evi{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;display:grid;gap:3px}
.evi b{font-family:var(--f-display);font-size:16px}
.evi small{color:var(--ink-3);font:600 11px var(--f-mono);text-transform:uppercase;letter-spacing:.05em}
/* board svg */
.card{cursor:pointer}
.card:focus{outline:none}
.card:focus-visible .paper{stroke:var(--teal);stroke-width:4}
.card.sel .paper{stroke:var(--teal);stroke-width:4}
.card.pick .paper{stroke:var(--string);stroke-width:4}
.card.fresh{animation:fresh 1.2s ease-out 2}
@keyframes fresh{0%{opacity:.35}100%{opacity:1}}
.strings line{transition:opacity .3s}
@media (prefers-reduced-motion: reduce){.card.fresh{animation:none}.progress i{transition:none}}
/* overlays */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(8,18,19,.62);display:grid;place-items:start center;overflow:auto;
  padding-block:max(24px,env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{background:var(--chrome);color:var(--ink);border-radius:14px;width:min(980px,100%);padding:28px;box-shadow:0 30px 80px rgba(0,0,0,.35);margin-bottom:24px}
.sheet h1{font:700 44px/1 var(--f-display);letter-spacing:.06em;margin:0;color:var(--teal-ink)}
.sheet h2{font:600 26px/1.2 var(--f-display);margin:0 0 8px;text-wrap:balance}
.sheet h3{font:600 13px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:22px 0 10px}
.lede{font:500 17px/1.5 var(--f-display);color:var(--ink-2);max-width:62ch;margin:10px 0 0}
.ipar{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.ipar span{font:600 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--ink-2)}
.ipar span b{color:var(--string)}
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.case{border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:6px;align-content:start;background:var(--chrome)}
.case.live{border:2px solid var(--teal);background:var(--teal-soft)}
.case h4{margin:0;font:600 18px/1.25 var(--f-display)}
.case p{margin:0;font-size:13px;color:var(--ink-2)}
.case .meta{font:600 11px var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3)}
.case.soon{opacity:.72}
.modes{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.modes button{border:0;background:none;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;color:var(--ink-2)}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--chrome)}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:0;padding:0;list-style:none}
.howto li{font-size:14px;color:var(--ink-2)}
.howto li b{display:block;color:var(--ink);font-family:var(--f-display);font-size:16px}
.fine{font-size:12px;color:var(--ink-3);margin-top:20px}
.brief p{font:16px/1.6 var(--f-display);color:var(--ink);max-width:66ch}
.form{border:1px dashed var(--ink-3);border-radius:8px;padding:12px 14px;font:12.5px/1.6 var(--f-mono);margin-top:14px;display:grid;gap:2px}
.form b{font-family:var(--f-ui)}
.stars{font-size:30px;letter-spacing:4px;color:var(--warn)}
.stars .off{color:var(--chrome-2)}
.bars{display:grid;gap:8px;max-width:520px}
.bar{display:grid;grid-template-columns:110px 1fr 48px;gap:10px;align-items:center;font-size:13px}
.bar .t{height:10px;border-radius:5px;background:var(--chrome-2);overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--teal)}
.bar .v{font:600 12px var(--f-mono);text-align:right}
.path td:nth-child(3){white-space:nowrap}
.itabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.code{font:12px/1.5 var(--f-mono);white-space:pre;overflow:auto;max-height:52vh;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.checks li{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:14px}
.checks li .m{font-weight:700} .checks li.ok .m{color:var(--good)} .checks li.no .m{color:var(--bad)}
.checks small{display:block;color:var(--ink-3)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(30px);opacity:0;z-index:60;background:var(--ink);color:var(--chrome);padding:10px 16px;border-radius:8px;font-size:14px;font-weight:600;transition:all .25s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.links{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14px}
.links a{color:var(--teal-ink);font-weight:600}
.versions{margin:0;padding:0;list-style:none;display:grid;gap:10px;font-size:14px}
.versions b{font-family:var(--f-mono);font-size:12px}
.versions ul{margin:4px 0 0;padding-left:18px;color:var(--ink-2)}
.nojs{max-width:34em;margin:40px auto;padding:20px;font:17px/1.5 var(--f-ui);color:var(--ink)}
.nojs a{color:var(--teal-ink);word-break:break-all}
@media (pointer:coarse){.btn,.sm,.tool,.tab,.phase,.boardctl button,.modes button{min-height:44px}.sm{padding:6px 12px}.hint button{min-height:44px}}
/* narrow */
@media (max-width:900px){
  .app{height:auto;min-height:100%}
  .stage{grid-template-columns:1fr}
  .boardwrap{height:58vh;min-height:360px;padding:8px}
  .panel{border-left:0;border-top:1px solid var(--line)}
  .panelbody{overflow:visible;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .phases{order:3;flex-basis:100%;justify-content:flex-start}
  .sheet{padding:20px}
  .sheet h1{font-size:36px}
  #scoreChip{display:none}
  .phase{padding:6px 9px;letter-spacing:.02em}
  .top{gap:10px}
}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>


<div class="app" id="app">
  <header class="top">
    <div class="brand"><b>IPAR</b><span id="caseName">The Copied Lab</span></div>
    <nav class="phases" id="phases" aria-label="Investigation phases"></nav>
    <div class="status">
      <span id="integrity" class="chip good"><i></i>Chain intact</span>
      <span id="scoreChip" class="chip">Score —</span>
      <button class="btn" data-act="about">About</button>
      <button class="btn" data-act="instructor">Instructor</button>
      <button class="btn" data-act="cases">Cases</button>
    </div>
  </header>
  <main class="stage">
    <section class="boardwrap" aria-label="Case board">
      <div class="boardhead">
        <h2 id="boardTitle">Image board</h2>
        <div class="boardctl">
          <button data-act="zoomIn" aria-label="Zoom in">+</button>
          <button data-act="zoomOut" aria-label="Zoom out">−</button>
          <button data-act="fit">Fit</button>
          <button data-act="listview" id="listBtn" aria-pressed="false">List</button>
        </div>
      </div>
      <svg id="board" role="group" aria-label="Case board"></svg>
      <div id="boardList" class="boardlist" hidden></div>

<script type="application/json" id="case-data">{"schema":"ipar-case/1","id":"copied-lab","title":"The Copied Lab","version":"demo-0.1","level":100,"minutes":20,"outcomes":["Receive evidence and document chain of custody","Acquire a device with write blocking and a bit-stream image","Verify an image with cryptographic hashes","Find and recover a deleted FAT file, and explain the 0xE5 marker","Detect a file whose signature does not match its extension","Order file-system timestamps into a timeline","Tie evidence to claims and report without overstating"],"fiction":"Fictional case. People, courses and events are invented.","brief":{"from":"Dr. M. Alvarez, Academic Integrity Office","subject":"Case AI-2026-031: two Lab 3 reports","body":["Two CSEC 101 Lab 3 reports share whole sentences. Priya Shah submitted hers on Sunday, Oct 11 at 18:52. Jordan Lee submitted his on Tuesday, Oct 13 at 08:55.","Jordan says he never had Priya's report and that the overlap comes from the shared template. He signed a consent form for an examination of a USB drive he left in the lab. Campus Security bagged it and imaged it at seizure.","Your job: image and verify the drive, find out what it can and cannot show, and send me findings the board can rely on."]},"device":{"item":"Item 01","label":"USB drive, volume JLEE_USB","bag":"IA-2026-0417","from":"Ofc. D. Okafor, Campus Security","note":"A cheap promotional stick. To keep the demo small, its volume is a 1.44 MB FAT12 file system.","imageName":"JLEE-USB-01.dd","referenceHashes":{"md5":"5677325296e006f0e892122935e9aaff","sha256":"e2c8b4c695c51b7d5bb2a3bb68f664900b57492ad810913107e431303533e749"}},"boards":[{"id":"image","name":"Image","requires":["I1","I2","I3","I4"],"next":"preserve"},{"id":"preserve","name":"Preserve","requires":["P1","P2","P3","P4"],"next":"analyze"},{"id":"analyze","name":"Analyze","requires":["A1","A2","A3","A4","A5","A6"],"next":"report"},{"id":"report","name":"Report","requires":["R0","R1"],"next":null}],"nodes":[{"id":"I1","board":"image","x":50,"y":60,"card":"form","start":true,"title":"Evidence intake","body":"Item 01 arrives in evidence bag IA-2026-0417 from Ofc. D. Okafor. The custody form lists two reference hashes taken at seizure with a write blocker.","prompt":"The bag is sealed and the custody form is attached. What do you do first?","hint":"Every handoff is a link in a chain. Which link is this?","q":{"type":"mc","options":[{"t":"Check the seal and the form against the item, then sign for it with the date and time.","r":"best","fb":"Receipt is the first link in the chain of custody. A gap here is the first thing a defense attorney looks for."},{"t":"Open the bag and plug the drive into your laptop to see what's on it.","r":"harmful","effect":"alterDevice","fb":"Your laptop wrote to the drive the moment you browsed it: last-access dates changed. The drive no longer matches the reference hash, and that will follow you into Preserve."},{"t":"Start imaging now and do the paperwork later.","r":"harmful","retry":true,"fb":"An undocumented handoff is a broken link. Sign for the item before you touch it. Choose again."}]},"unlocks":["I2"]},{"id":"I2","board":"image","x":280,"y":300,"card":"note","title":"Connect the drive","body":"Your forensic workstation is ready. The drive has no write-protect switch.","prompt":"How do you connect it?","hint":"Operating systems write to drives on their own, even when you only read.","q":{"type":"mc","options":[{"t":"Through a hardware write blocker.","r":"best","fb":"The blocker passes reads and drops every write. The drive can't change while you image it."},{"t":"Directly, after turning on the operating system's USB write-protect setting.","r":"acceptable","fb":"Software write protection works when it's set correctly, but it depends on the OS and is harder to prove later. A hardware blocker is the stronger choice."},{"t":"Directly. You'll only be reading from it.","r":"harmful","effect":"alterDevice","fb":"The OS updated last-access dates and may add its own folders. Reading without a blocker still changed the drive."}]},"unlocks":["I3"]},{"id":"I3","board":"image","x":520,"y":70,"card":"note","title":"Acquire the evidence","body":"The drive is connected. Time to capture it.","prompt":"How do you capture the drive?","hint":"In a case about a file that may have been deleted, where would that file be?","q":{"type":"mc","options":[{"t":"Make a bit-stream image of the whole device: every sector, used or not.","r":"best","effect":"acquire","fb":"A bit-stream image copies every sector, including deleted entries and unallocated space, and its hash can be checked against the original."},{"t":"Copy the files you can see to your workstation.","r":"harmful","retry":true,"fb":"A file copy keeps only live files. Deleted entries and unallocated space stay behind, and in this case that may be the evidence. Choose again."},{"t":"Clone the drive onto a second USB stick and analyze that.","r":"acceptable","effect":"acquire","fb":"A clone copies every sector, but a second physical drive is harder to hash, store and share than an image file. Most labs image to a file."}]},"unlocks":["I4"]},{"id":"I4","board":"image","x":760,"y":300,"card":"index","title":"Why is it so big?","body":"JLEE-USB-01.dd is 1,474,560 bytes. The files you can see total under 8 KB.","prompt":"What fills the rest of the image?","hint":"A bit-stream image is the size of the volume, not the size of its files.","q":{"type":"mc","options":[{"t":"Every sector of the volume: boot sector, file allocation tables, directory, and unallocated space, deleted data included.","r":"best","fb":"Right. The image mirrors the volume sector for sector, which is why deleted data is still in it."},{"t":"Padding the imaging tool adds so the file is a round size.","r":"harmful","fb":"A raw image isn't padded. Every byte in it came from the device."},{"t":"Hidden system files installed by the drive's maker.","r":"harmful","fb":"There are no hidden files on this volume. The size comes from imaging every sector."}]},"unlocks":[]},{"id":"P1","board":"preserve","x":60,"y":230,"card":"note","start":true,"title":"Hash your image","body":"Open the Bench and run the Hash tool on JLEE-USB-01.dd.","prompt":"Compute MD5 and SHA-256 of your working image.","hint":"Bench → Hash → Compute.","q":{"type":"tool","needs":"hashDone"},"unlocks":["P2"]},{"id":"P2","board":"preserve","x":300,"y":60,"card":"form","title":"Compare with the reference","body":"The custody form lists the SHA-256 Campus Security recorded at seizure.","prompt":"Compare your SHA-256 with the reference. What do you record?","hint":"Compare every character, not just the ends.","showHashes":true,"q":{"type":"mc","dynamic":"hashMatch","options":[{"t":"They match. Record both values on the custody form.","r":{"match":"best","mismatch":"harmful"},"effect":{"mismatch":"integrityBroken"},"fb":{"match":"Verified. Your image is a faithful copy of the drive as seized, and you can prove it.","mismatch":"They don't match. Recording a match that isn't there falsifies the record, and everything after this is tainted."}},{"t":"They don't match. Stop and report the mismatch before going further.","r":{"match":"harmful","mismatch":"best"},"retry":{"match":true,"mismatch":false},"unlocks":{"mismatch":["P2R"],"match":[]},"fb":{"match":"Read them again, character by character. They match. Choose again.","mismatch":"Right call. A mismatch means the image and the seized drive differ. Stop, and work out why before anything else."}},{"t":"Close enough: the first and last characters agree.","r":{"match":"harmful","mismatch":"harmful"},"retry":{"match":true,"mismatch":false},"effect":{"mismatch":"integrityBroken"},"fb":{"match":"Hashes have no 'close enough'. One changed bit changes the whole value. Compare every character. Choose again.","mismatch":"They differ. One changed bit changes the whole hash, and calling it close enough leaves your evidence undefended."}}]},"unlocks":["P3"]},{"id":"P2R","board":"preserve","x":300,"y":330,"card":"note","title":"Mismatch: what now?","body":"Your image doesn't match the drive as it was seized. The drive changed after seizure.","prompt":"How do you recover?","hint":"The reference image was made before anything changed.","q":{"type":"mc","options":[{"t":"Write down exactly what happened, tell the case lead, and work from Campus Security's reference image.","r":"best","effect":"useReference","fb":"Disclosed and documented. Your error is on the record, and the reference image, made before the change, carries the case."},{"t":"Re-image the drive with a write blocker. The new hash will match.","r":"harmful","retry":true,"fb":"The drive itself changed. A new image would match the changed drive, not the reference. Choose again."},{"t":"Keep your image and leave the mismatch out of your notes. The files look the same.","r":"harmful","effect":"integrityBroken","fb":"Undisclosed changes are how evidence gets excluded. Everything you find from here carries that taint."}]},"unlocks":["P3"]},{"id":"P3","board":"preserve","x":560,"y":90,"card":"form","title":"Chain of custody","body":"The log travels with the evidence. Someone you'll never meet should be able to check every step.","prompt":"Which custody-log entry do you sign?","hint":"Who, what, when, how, and proof.","q":{"type":"mc","options":[{"t":"Nov 6, 14:20. Received Item 01 (bag IA-2026-0417, seal intact) from Ofc. D. Okafor. Imaged through a write blocker to JLEE-USB-01.dd. Hashes recorded. Initials.","r":"best","fb":"Complete: time, item, seal, source, method, and proof."},{"t":"Received Item 01 from Ofc. Okafor and imaged it.","r":"acceptable","fb":"Better than nothing, but there's no time, no seal check and no hash. A stranger couldn't verify it."},{"t":"Got the USB from security, made a copy, looks fine.","r":"harmful","retry":true,"fb":"Who, when and how are missing. This is the entry a defense attorney reads aloud. Choose again."}]},"unlocks":["P4"]},{"id":"P4","board":"preserve","x":790,"y":300,"card":"note","title":"Pick your working copy","body":"The original goes back in the sealed bag.","prompt":"What do you analyze?","hint":"The original should come out of the bag as rarely as possible.","q":{"type":"mc","options":[{"t":"A verified copy of the image, opened read-only.","r":"best","fb":"Verified, read-only, and repeatable. Anyone can redo your analysis from the same copy."},{"t":"The original drive, so nothing is lost in copying.","r":"harmful","retry":true,"fb":"Every analysis step risks changing the original. Work on a verified copy. Choose again."},{"t":"The image file, mounted read-write so the tools run faster.","r":"harmful","retry":true,"fb":"A read-write mount can change the image and its hash. Open it read-only. Choose again."}]},"unlocks":[]},{"id":"A1","board":"analyze","x":40,"y":50,"card":"note","start":true,"title":"What's on the drive?","body":"List every directory entry, including deleted ones.","prompt":"Open Bench → Directory. Find the entry that matters to this case and pin it to the board.","hint":"FAT keeps a deleted entry's size, dates and starting cluster. Only the first letter of its name is lost.","q":{"type":"pin","needs":["E_DEL"]},"unlocks":["A2","A3","M1"]},{"id":"A2","board":"analyze","x":40,"y":330,"card":"index","title":"Why the question mark?","body":"The deleted entry shows as ?SHAH_L3.TXT.","prompt":"Why does the name start with a question mark?","hint":"Open the root directory in the Hex tool and look at that entry's first byte.","q":{"type":"mc","options":[{"t":"FAT marks a deleted entry by overwriting the first byte of its name with 0xE5.","r":"best","fb":"Right. The rest of the entry survives, so tools show the lost letter as '?'. Here it was almost certainly P."},{"t":"The file was corrupted when it was deleted.","r":"harmful","fb":"Nothing was corrupted. One byte changed, and it changed to 0xE5, FAT's deleted marker."},{"t":"Jordan renamed it with a special character to hide it.","r":"harmful","fb":"No rename is needed. Deleting a FAT file changes the first byte to 0xE5, which tools display as '?'."}]},"unlocks":[]},{"id":"A3","board":"analyze","x":290,"y":190,"card":"note","title":"Bring it back","body":"The deleted file's clusters haven't been reused.","prompt":"Recover the deleted file (Directory → Recover). Whose lab report is it?","hint":"Read the second line of the recovered text.","q":{"type":"value","accept":["priya shah","priya","shah","p shah","p. shah","priya s"],"fbRight":"It's Priya Shah's Lab 3 report, sitting deleted on Jordan's drive. Pin the recovered file if you haven't.","fbWrong":"Not what the file says. Recover it from the Directory tool and read the name line."},"effectOnSolve":"pinRecovered","unlocks":["A4","A5"]},{"id":"M1","board":"analyze","x":290,"y":450,"card":"message","title":"Jordan's statement","body":"\"I never had Priya's report. We used the same template, so of course they look alike.\" — Jordan Lee, interview notes, Oct 15","q":{"type":"message"},"unlocks":[]},{"id":"A4","board":"analyze","x":540,"y":50,"card":"note","title":"A text file that isn't","body":"Extensions are labels. File signatures are contents.","prompt":"Run Bench → Signatures. Which file's contents don't match its extension? Pin it.","hint":"Look at the first eight bytes of each file.","q":{"type":"pin","needs":["E_SIG"]},"unlocks":["A6"]},{"id":"A5","board":"analyze","x":540,"y":330,"card":"note","title":"Read them side by side","body":"Jordan says the overlap comes from the template.","prompt":"Open Bench → Compare. Pin what the two reports share.","hint":"Compare needs the recovered file. Recover it first.","q":{"type":"pin","needs":["E_CMP"]},"unlocks":["A6"]},{"id":"A6","board":"analyze","x":790,"y":190,"card":"index","title":"Put it in order","body":"Bench → Timeline lists every created, modified and accessed time on the volume.","prompt":"On the evening of Oct 12, what happened first on this drive?","hint":"Sort by time and read the Created events.","q":{"type":"mc","options":[{"t":"Priya's report was copied onto the drive (created 21:14).","r":"best","effect":"pinJordan","fb":"Right. Priya's file arrived at 21:14, the screenshot followed, and Jordan's report wasn't created until 22:03."},{"t":"Jordan's report was created (22:03).","r":"harmful","fb":"Jordan's report came 49 minutes after Priya's file arrived. Check the Created column."},{"t":"The screenshot NOTES.TXT was taken (21:15).","r":"harmful","fb":"Close. The screenshot was taken at 21:15, one minute after Priya's file arrived at 21:14."}]},"unlocks":[]},{"id":"R0","board":"report","x":380,"y":40,"card":"note","start":true,"title":"String the board","body":"Each finding needs evidence behind it. Some claims on this board have none.","prompt":"Tap an evidence card, then a claim, and choose Supports or Contradicts. Give each finding you can back at least one string.","hint":"Test Jordan's statement too: what on the drive contradicts it?","q":{"type":"strings","needs":{"C1":"supports","C2":"supports","C3":"supports","C4":"contradicts"}},"unlocks":["R1"]},{"id":"R1","board":"report","x":380,"y":480,"card":"form","title":"File your findings","body":"Dr. Alvarez will put your findings in front of the integrity board.","prompt":"Choose the findings you'll sign, and add a summary if you like.","hint":"Report what the evidence shows, and only that.","q":{"type":"report"},"unlocks":[]},{"id":"C1","board":"report","x":700,"y":20,"card":"claim","kind":"claim","title":"Priya's report was on Jordan's drive before his own report existed."},{"id":"C2","board":"report","x":700,"y":140,"card":"claim","kind":"claim","title":"Jordan's report repeats Priya's wording."},{"id":"C3","board":"report","x":700,"y":260,"card":"claim","kind":"claim","title":"Copies of Priya's report on the drive were deleted or disguised."},{"id":"C4","board":"report","x":700,"y":380,"card":"claim","kind":"claim","title":"Jordan's statement: \"I never had Priya's report.\""},{"id":"C5","board":"report","x":700,"y":500,"card":"claim","kind":"claim","title":"Jordan broke into Priya's account to take her report."}],"evidence":[{"id":"E_DEL","from":"Directory","x":40,"y":190,"title":"Deleted entry ?SHAH_L3.TXT","detail":"Created on this drive Oct 12, 21:14:36. 859 bytes from cluster 3. Name byte 0xE5.","lead":"A1","glyph":"0xE5"},{"id":"E_REC","from":"Recover","x":300,"y":310,"title":"Recovered: Priya Shah's Lab 3","detail":"859 bytes read back from clusters 3–4. Name line: Priya Shah.","lead":"A3","glyph":"859 B"},{"id":"E_SIG","from":"Signatures","x":760,"y":40,"title":"NOTES.TXT is a PNG","detail":"Header 89 50 4E 47. A screenshot of Priya's report, saved Oct 12 21:15 under a .txt name.","lead":"A4","glyph":"PNG"},{"id":"E_CMP","from":"Compare","x":790,"y":420,"title":"4 sentences match word for word","detail":"Results and Discussion in Jordan's report repeat Priya's sentences exactly.","lead":"A5","glyph":"4 ="},{"id":"E_JLEE","from":"Directory","x":540,"y":190,"title":"JLEE_L3.TXT created 22:03","detail":"Jordan's report was created on this drive Oct 12, 22:03:10, after Priya's file arrived.","lead":"A6","glyph":"22:03"},{"id":"E_TPL","from":"Directory","x":40,"y":470,"title":"TEMPLATE.TXT","detail":"The course template, downloaded Sep 8. Every student has it.","lead":"A1","glyph":"TXT"},{"id":"E_HASH","from":"Hash","x":560,"y":340,"title":"Image verified","detail":"Working image hash checked against the seizure reference.","board":"preserve","lead":"P2","glyph":"SHA-256"}],"answerGraph":{"supports":{"E_DEL>C1":"Priya's file was created on the drive at 21:14, 49 minutes before Jordan's report.","E_JLEE>C1":"Jordan's report was created at 22:03, after Priya's file arrived.","E_REC>C1":"The recovered content shows the file on the drive really was Priya's report.","E_SIG>C1":"A screenshot of her report was saved at 21:15, also before 22:03.","E_CMP>C2":"Four sentences match word for word.","E_REC>C2":"Her recovered text is the source of the shared wording.","E_DEL>C3":"Her report was deleted from the drive.","E_SIG>C3":"A picture of her report was saved under a .txt name."},"contradicts":{"E_DEL>C4":"Her report was on his drive.","E_REC>C4":"The recovered file is her report, on his drive.","E_SIG>C4":"A screenshot of her report is on his drive.","E_CMP>C4":"Her exact sentences are in his report."},"wrong":{"E_TPL":"Every student got the template. It can't show copying, and it can't clear anyone either.","E_HASH":"The hash proves your image is faithful. It backs your method, not a finding.","C5":"Nothing on a USB drive shows how a file was obtained. Leave this claim unstrung.","default":"That string doesn't hold. Check what this evidence actually shows."}},"report":{"findings":[{"id":"F1","claim":"C1","text":"Priya Shah's Lab 3 report was on Jordan Lee's drive at 21:14 on Oct 12, before his report was created at 22:03.","valid":true},{"id":"F2","claim":"C2","text":"Four sentences in Jordan's report match Priya's word for word.","valid":true},{"id":"F3","claim":"C3","text":"Priya's report was deleted from the drive, and a screenshot of it was saved as NOTES.TXT.","valid":true},{"id":"F4","claim":"C4","text":"The drive's contents contradict Jordan's statement that he never had Priya's report.","valid":true},{"id":"F5","claim":"C5","text":"Jordan broke into Priya's account to take her report.","valid":false}]},"facts":[{"type":"entry","name":"PSHAH_L3.TXT","deleted":true,"why":"E_DEL says a deleted entry ?SHAH_L3.TXT exists"},{"type":"created","name":"PSHAH_L3.TXT","at":"2026-10-12 21:14:36","why":"E_DEL and A6 cite 21:14:36"},{"type":"created","name":"JLEE_L3.TXT","at":"2026-10-12 22:03:10","why":"E_JLEE and A6 cite 22:03:10"},{"type":"signature","name":"NOTES.TXT","expect":"PNG","why":"E_SIG says NOTES.TXT is a PNG"},{"type":"text","name":"PSHAH_L3.TXT","contains":"Name: Priya Shah","why":"A3 expects the recovered file to name Priya Shah"},{"type":"shared","a":"PSHAH_L3.TXT","b":"JLEE_L3.TXT","count":4,"why":"E_CMP says 4 sentences match"}]}</script>

  mail(CASE.brief.from, CASE.brief.subject, CASE.brief.body); S.inbox[0].unread = false; S.unread = 0;
  $('#ovStart').hidden = true; $('#ovDebrief').hidden = true;
  $('#briefSheet').innerHTML = `<p class="kicker">Inbox · ${esc(CASE.brief.from)}</p><h2>${esc(CASE.brief.subject)}</h2>${CASE.brief.body.map(p => `<p>${esc(p)}</p>`).join('')}
  <div class="form"><b>Custody form · ${esc(CASE.device.item)}</b><span>Item: ${esc(CASE.device.label)}</span><span>Bag: ${esc(CASE.device.bag)} · From: ${esc(CASE.device.from)}</span><span>Reference MD5: ${groupHash(ref.md5)}</span><span>Reference SHA-256: ${groupHash(ref.sha256)}</span></div>
  <p class="fine">${esc(CASE.device.note)} ${esc(CASE.fiction)}</p><div class="row" style="margin-top:14px"><button class="btn primary" data-act="takecase">Take the case</button></div>`;
  $('#ovBrief').hidden = false; render();
}
function validate() {
  const checks = [], add = (ok, t, d) => checks.push({ ok, t, d });
  const ids = new Set(CASE.nodes.map(n => n.id));
  const badUnlock = []; for (const n of CASE.nodes) { for (const u of (n.unlocks || [])) if (!ids.has(u)) badUnlock.push(`${n.id}→${u}`); for (const o of (n.q && n.q.options) || []) for (const u of [].concat(...Object.values(typeof o.unlocks === 'object' && o.unlocks && !Array.isArray(o.unlocks) ? o.unlocks : { x: o.unlocks || [] }))) if (!ids.has(u)) badUnlock.push(`${n.id}→${u}`); }
  add(!badUnlock.length, 'Every unlock points at a real node', badUnlock.join(', ') || `${CASE.nodes.length} nodes`);
  for (const b of CASE.boards) {
    const starts = CASE.nodes.filter(n => n.board === b.id && n.start);
    const seen = new Set(starts.map(s => s.id)), q = [...seen];
    while (q.length) { const n = NODE[q.shift()]; const nexts = [...(n.unlocks || [])]; for (const o of (n.q && n.q.options) || []) if (o.unlocks) nexts.push(...[].concat(...Object.values(Array.isArray(o.unlocks) ? { x: o.unlocks } : o.unlocks))); for (const u of nexts) if (!seen.has(u)) { seen.add(u); q.push(u); } }
    const unreached = b.requires.filter(r => !seen.has(r));
    add(starts.length === 1 && !unreached.length, `${b.name} board: one start, every required lead reachable`, unreached.length ? 'Unreachable: ' + unreached.join(', ') : `${b.requires.length} required leads`);
  }
  const badBest = []; for (const n of CASE.nodes) if (n.q && n.q.type === 'mc') for (const cond of (n.q.dynamic ? ['match', 'mismatch'] : [null])) { const c = n.q.options.filter(o => (cond ? (typeof o.r === 'object' ? o.r[cond] : o.r) : o.r) === 'best').length; if (c !== 1) badBest.push(n.id + (cond ? `/${cond}` : '')); }
  add(!badBest.length, 'Exactly one best answer per question', badBest.join(', ') || 'all multiple-choice leads');
  const evRefs = []; for (const n of CASE.nodes) if (n.q && n.q.type === 'pin') for (const e of n.q.needs) if (!EVI[e]) evRefs.push(e);
  for (const k of [...Object.keys(CASE.answerGraph.supports), ...Object.keys(CASE.answerGraph.contradicts)]) { const [e, c] = k.split('>'); if (!EVI[e] || !ids.has(c)) evRefs.push(k); }
  add(!evRefs.length, 'Pins and the answer graph use real evidence and claims', evRefs.join(', ') || `${Object.keys(CASE.answerGraph.supports).length + Object.keys(CASE.answerGraph.contradicts).length} valid strings`);
  const need = NODE.R0.q.needs, unmet = Object.entries(need).filter(([c, rel]) => !Object.keys(CASE.answerGraph[rel]).some(k => k.endsWith('>' + c)));
  add(!unmet.length, 'Every required string has at least one valid answer', unmet.map(x => x[0]).join(', ') || 'C1–C4');
  const m = md5(ORIGINAL), s = sha256(ORIGINAL);
  add(m === ref.md5 && s === ref.sha256, 'Reference hashes recomputed from the embedded image', `MD5 ${m.slice(0, 8)}… SHA-256 ${s.slice(0, 8)}…`);
  const v = parseVolume(ORIGINAL), find = nm => v.entries.find(e => !e.isLabel && (e.deleted ? 'P' + e.name.slice(1) : e.name) === nm);
  for (const f of CASE.facts) {
    const e = find(f.name || f.a); let ok = false;
    if (f.type === 'entry') ok = !!e && e.deleted === f.deleted;
    if (f.type === 'created') ok = !!e && e.created === f.at;
    if (f.type === 'signature') ok = !!e && sniff(readFile(ORIGINAL, v, e)).short === f.expect;
    if (f.type === 'text') ok = !!e && decodeText(readFile(ORIGINAL, v, e)).includes(f.contains);
    if (f.type === 'shared') { const b = find(f.b); ok = !!e && !!b && sharedSentences(decodeText(readFile(ORIGINAL, v, b)), decodeText(readFile(ORIGINAL, v, e))).length === f.count; }
    add(ok, `Image fact: ${f.why}`, `${f.type} · ${f.name || f.a}`);
  }
  return checks;
}
function twee() {
  const out = [`:: StoryTitle\n${CASE.title}\n`, `:: StoryData\n${JSON.stringify({ ifid: 'C0F1E5A2-5D2B-4E3A-9C1E-1A2B3C4D5E6F', format: 'IPAR', 'format-version': '0.1.0', start: 'I1', 'tag-colors': { image: 'teal', preserve: 'green', analyze: 'orange', report: 'red' }, zoom: 1 }, null, 2)}\n`];
  const ox = { image: 0, preserve: 1100, analyze: 2200, report: 3300 };
  for (const n of CASE.nodes) {
    const tags = [n.board, n.kind === 'claim' ? 'claim' : n.q ? n.q.type : 'card'].join(' ');
    const meta = { position: `${ox[n.board] + n.x},${n.y}`, size: '100,100' };
    let body = [n.title, n.body, n.prompt].filter(Boolean).join('\n\n');
    if (n.q && n.q.type !== 'message') { const q = { ...n.q }; body += '\n\n```ipar\n' + JSON.stringify(q, null, 1) + '\n```'; }
    if (n.unlocks && n.unlocks.length) body += '\n\n' + n.unlocks.map(u => `[[${u}]]`).join(' ');
    out.push(`:: ${n.id} [${tags}] ${JSON.stringify(meta)}\n${body}\n`);
  }
  return out.join('\n');
}
function renderInstructor(tab = 'validator') {
  const tabs = [['validator', 'Validator'], ['json', 'Case JSON'], ['twee', 'Twine (Twee 3)'], ['results', 'Results']];
  let body = '';
  if (tab === 'validator') { const c = validate(), pass = c.filter(x => x.ok).length; body = `<p class="pbody">The same checks will gate every case in the rebuild. These run live against this case's JSON and its embedded disk image.</p><p class="kicker">${pass} of ${c.length} checks pass</p><ul class="checks">${c.map(x => `<li class="${x.ok ? 'ok' : 'no'}"><span class="m">${x.ok ? '✓' : '✗'}</span><span>${esc(x.t)}<small>${esc(x.d)}</small></span></li>`).join('')}</ul>`; }
  if (tab === 'json') body = `<p class="pbody">This case is one JSON file. The engine reads it; nothing about the case lives in code. It includes the answers: a class build would keep this view for instructors.</p><div class="row" style="margin-bottom:8px"><button class="btn" data-act="copy" data-src="instrCode">Copy</button><button class="btn" data-act="savecode" data-name="${esc(CASE.id)}.ipar.json" data-type="application/json">Save as file</button></div><p class="pbody" id="instrMsg" role="status"></p><div class="code" id="instrCode">${esc(JSON.stringify(CASE, null, 2))}</div>`;
  if (tab === 'twee') body = `<p class="pbody">The same case as Twee 3: each lead is a passage, its board position becomes its place on Twine's story map, tags carry the phase and question type, and links are unlocks. Paste into Twine to see the board as a story map.</p><div class="row" style="margin-bottom:8px"><button class="btn" data-act="copy" data-src="instrCode">Copy</button><button class="btn" data-act="savecode" data-name="${esc(CASE.id)}.twee" data-type="text/plain">Save as file</button></div><p class="pbody" id="instrMsg" role="status"></p><div class="code" id="instrCode">${esc(twee())}</div>`;
  if (tab === 'results') body = S ? `<p class="pbody">What a student hands in: one JSON file with their path, attempts, hints, strings and report. A Reader page would grade it.</p><div class="row" style="margin-bottom:8px"><button class="btn" data-act="copy" data-src="instrCode">Copy</button><button class="btn" data-act="savecode" data-name="ipar-results-${esc(CASE.id)}-${today()}.json" data-type="application/json">Save as file</button></div><p class="pbody" id="instrMsg" role="status"></p><div class="code" id="instrCode">${esc(JSON.stringify(results(), null, 2))}</div>` : '<p class="pbody">Open the case to see results.</p>';
  $('#instrSheet').innerHTML = `<div class="row" style="justify-content:space-between"><div><p class="kicker">Instructor view</p><h2>${esc(CASE.title)} · Case Data</h2></div><button class="btn" data-act="closeov">Close</button></div><div class="itabs">${tabs.map(([k, l]) => `<button class="tool" data-act="itab" data-id="${k}" aria-pressed="${tab === k}">${l}</button>`).join('')}</div>${body}`;
  $('#ovInstructor').hidden = false;
}
async function copyText(text, el) {
  try { await navigator.clipboard.writeText(text); toast('Copied.'); }
  catch { if (el) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } toast('Selected. Press Ctrl+C or ⌘C to copy.'); }
}

/* ---------------- events ---------------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act, id = t.dataset.id;
  switch (act) {
    case 'open': openCase(); break;
    case 'takecase': $('#ovBrief').hidden = true; render(); break;
    case 'mode': MODE = id; storeSet(MODE_KEY, id); renderStart(); break;
    case 'resume': resumeCase(); break;
    case 'restart': confirmRestart = true; renderStart(); break;
    case 'restartyes': openCase(); break;
    case 'about': renderAbout(); break;
    case 'erase': storeDel(KEY); confirmRestart = false; renderStart(); renderAbout(); $('#aboutMsg').textContent = 'Saved progress erased.'; break;
    case 'saveresults': saveFile(`ipar-results-${CASE.id}-${today()}.json`, new Blob([JSON.stringify(results(), null, 2)], { type: 'application/json' }), $('#debriefMsg')); break;
    case 'savecode': saveFile(t.dataset.name, new Blob([$('#instrCode').textContent], { type: t.dataset.type }), $('#instrMsg')); break;
    case 'cases': $('#ovDebrief').hidden = true; $('#ovAbout').hidden = true; confirmRestart = false; renderStart(); $('#ovStart').hidden = false; break;
    case 'replay': MODE = S.mode; openCase(); break;
    case 'closeov': t.closest('.overlay').hidden = true; break;
    case 'board': S.board = id; S.pickE = null; S.pickC = null; fit(); { const first = CASE.nodes.find(n => n.board === id && n.start); if (first) S.sel = first.id; } S.tab = 'lead'; render(); break;
    case 'tab': S.tab = id; render(); break;
    case 'mc': answerMC(id, +t.dataset.i); break;
    case 'hint': S.hints.add(id); render(); break;
    case 'gotool': S.tab = 'bench'; S.tool = id; S.toolView = null; render(); break;
    case 'tool': S.tab = 'bench'; S.tool = id; S.toolView = null; render(); break;
    case 'hash': computeHash(); break;
    case 'hexview': S.toolView = { kind: id }; render(); break;
    case 'hexclus': S.tool = 'hex'; S.toolView = { kind: 'cluster', c: +id, label: t.dataset.label, sig: true }; render(); break;
    case 'view': S.toolView = { kind: 'file', i: +id }; render(); break;
    case 'recover': recoverPriya(); render(); break;
    case 'openpng': { const v = parseVolume(S.working), en = v.entries.find(x => x.i === +id); const url = URL.createObjectURL(new Blob([readFile(S.working, v, en)], { type: 'image/png' })); S.toolView = { kind: 'png', url }; render(); break; }
    case 'pin': if (id === 'E_REC' && !S.recovered) recoverPriya(); pin(id); render(); break;
    case 'select': {
      const want = EVI[id] ? (S.unlocked.has('report') ? 'report' : (EVI[id].board || 'analyze')) : NODE[id].board;
      if (S.board !== want && !(S.board === 'report' && EVI[id])) { S.board = want; fit(); }
      S.panTo = id; tapCard(id); break; }
    case 'string': addString(S.pickE, id, t.dataset.rel); break;
    case 'cancelpick': S.pickE = null; S.pickC = null; render(); break;
    case 'unstring': S.strings = S.strings.filter(s => s.id !== id); render(); break;
    case 'debrief': showDebrief(); break;
    case 'zoomIn': zoom(1.25); break;
    case 'zoomOut': zoom(0.8); break;
    case 'fit': fit(); break;
    case 'listview': S.listView = !S.listView; $('#listBtn').setAttribute('aria-pressed', S.listView); render(); break;
    case 'instructor': renderInstructor('validator'); break;
    case 'itab': renderInstructor(id); break;
    case 'copy': copyText($('#' + t.dataset.src).textContent, $('#' + t.dataset.src)); break;
    case 'copyresults': { const txt = JSON.stringify(results(), null, 2); const ta = $('#resultsOut'); ta.value = txt; ta.hidden = false; copyText(txt, null); ta.select(); break; }
    case 'theme': { const root = document.documentElement, cur = root.getAttribute('data-theme'); const dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; root.setAttribute('data-theme', dark ? 'light' : 'dark'); if (S) render(); if (!$('#ovAbout').hidden) renderAbout(); break; }
  }
});
document.addEventListener('submit', e => {
  const f = e.target; e.preventDefault();
  if (f.dataset.form === 'value') answerValue(f.dataset.id, f.querySelector('input').value);
  if (f.dataset.form === 'string') { const rel = e.submitter && e.submitter.value === 'contradicts' ? 'contradicts' : 'supports'; addString($('#strE').value, $('#strC').value, rel); }
  if (f.dataset.form === 'report') { const chosen = [...f.querySelectorAll('input[name=f]:checked')].map(x => x.value); fileReport(chosen, $('#summary').value.trim()); render(); }
});
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => S && renderBoard(), 150); });

window.IPAR = { get state() { return S; }, CASE, APP, md5, sha256, parseVolume, ORIGINAL, validate, twee, results, snapshot };
renderStart();
