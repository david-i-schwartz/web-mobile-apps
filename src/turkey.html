<!DOCTYPE html>
<html lang="en">

<title>Turkey Gets Away</title>
<!--
  Turkey Gets Away — v0.3.1, 2026-11-26
  Game idea by Evelyn: a turkey called Turkey runs across the forest, away from the hunters.
  One self-contained file: no outside code, fonts, pictures or sounds. All art is drawn
  and all sound is made in the browser. Built by Claude with Dave Schwartz. GPL-3.0.

<style>
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
--panel:#fffaf0;--ink:#2b1d12;--muted:#6b5a4a;--accent:#b93c0b;--btn:#2b1d12;--btnInk:#fffaf0;--line:rgba(43,29,18,.22);--chip:#f3e6cf;
--pad:rgba(255,250,240,.94);--padInk:#2b1d12;--padLine:rgba(43,29,18,.45);--eggFill:#fde047;--eggWait:#e7dcc6;--bg:#3f7d4a;
--font:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root{--panel:#211c17;--ink:#f6ecdd;--muted:#cbb9a5;--accent:#fdba74;--btn:#f6ecdd;--btnInk:#211c17;--line:rgba(246,236,221,.24);--chip:#2e2720;
--pad:rgba(36,30,25,.94);--padInk:#f6ecdd;--padLine:rgba(246,236,221,.45);--eggFill:#a16207;--eggWait:#3a322a;--bg:#15261c}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{position:fixed;inset:0;font:17px/1.45 var(--font);color:var(--ink)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid #2563eb;outline-offset:2px}
@media (prefers-color-scheme:dark){:focus-visible{outline-color:#93c5fd}}
.hide{visibility:hidden}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:0}

#hud{position:fixed;left:0;right:0;top:0;z-index:3;display:flex;align-items:center;gap:10px;max-width:560px;margin:0 auto;
padding:calc(8px + var(--sat)) calc(10px + var(--sar)) 6px calc(10px + var(--sal))}
.ib{flex:none;width:48px;height:48px;border-radius:15px;border:2px solid var(--padLine);background:var(--pad);color:var(--padInk);display:grid;place-items:center;padding:0}
#prog{flex:1;min-width:0}
#progLbl{margin:0 0 4px;font-weight:800;font-size:15px;line-height:1;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7)}
#bar{height:16px;border-radius:10px;background:rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.85);overflow:hidden}
#fill{height:100%;width:0;background:linear-gradient(90deg,#fde047,#fb923c);border-radius:8px}

#pad{position:fixed;left:0;right:0;bottom:0;z-index:3;display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;max-width:560px;margin:0 auto;
padding:8px calc(10px + var(--sar)) calc(10px + var(--sab)) calc(10px + var(--sal));touch-action:none}
.arrows{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pb{position:relative;overflow:hidden;min-height:64px;min-width:44px;border-radius:18px;border:2px solid var(--padLine);background:var(--pad);color:var(--padInk);
font-weight:800;font-size:20px;line-height:1;padding:0 6px;display:grid;place-items:center;touch-action:none;box-shadow:0 3px 0 rgba(0,0,0,.28)}
.pb.sm{min-height:52px;font-size:18px}
.pb.down{transform:translateY(3px);box-shadow:none;filter:brightness(.9)}
#bJ{background:#fbbf24;color:#2b1d12;border-color:rgba(43,29,18,.6)}
#bE .fb{position:absolute;inset:0;transform-origin:left center;transform:scaleX(var(--p,1));background:var(--eggFill)}
#bE span{position:relative}
#bE.wait{background:var(--eggWait)}
#bE.wait span{opacity:.8}
#bE.hot{animation:hot .45s ease-in-out infinite alternate}
@keyframes hot{to{transform:scale(1.05);border-color:#dc2626}}
.pb svg,.ib svg{display:block}

#overlay{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;
padding:calc(12px + var(--sat)) calc(14px + var(--sar)) calc(12px + var(--sab)) calc(14px + var(--sal));pointer-events:none}
#overlay[hidden]{display:none}
#overlay.top{align-items:flex-start;padding-top:calc(18px + var(--sat))}
.panel{pointer-events:auto;background:var(--panel);color:var(--ink);border-radius:22px;width:100%;max-width:460px;max-height:100%;overflow:auto;-webkit-overflow-scrolling:touch;
touch-action:pan-y;padding:20px 18px 16px;box-shadow:0 22px 60px rgba(0,0,0,.5);outline:none;-webkit-user-select:text;user-select:text}
h1,h2{margin:0 0 8px;font-weight:900;line-height:1.08;letter-spacing:.01em}
h1{font-size:clamp(30px,9.5vw,42px);color:var(--accent)}
h2{font-size:clamp(26px,8vw,34px)}
p{margin:0 0 12px}
.lead{font-size:18px}
.muted{color:var(--muted);font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 12px}
.b{flex:1 1 140px;min-height:52px;border-radius:16px;border:2px solid var(--btn);background:transparent;color:var(--ink);font-weight:800;font-size:18px;padding:8px 14px}
.b.go{background:var(--btn);color:var(--btnInk);font-size:21px;min-height:60px}
details{border-top:1px solid var(--line)}
summary{min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:800;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:24px;font-weight:700;color:var(--muted);width:24px;text-align:center}
details[open]>summary::after{content:"\2212"}
details>div{padding:0 0 6px}
ul{margin:0 0 12px;padding-left:22px}
li{margin:0 0 7px}
#seedBox{flex:none;margin:0;display:flex;align-items:center;gap:5px;min-width:56px;height:40px;padding:0 11px 0 8px;border-radius:14px;background:rgba(0,0,0,.42);border:2px solid rgba(255,255,255,.85);color:#fff;font-weight:800;font-size:17px;line-height:1}
.panel.lookp{padding-top:0}
.panel.lookp h2{margin:0;padding-top:20px}
.pvw{position:sticky;top:0;z-index:1;margin:0 0 10px;padding-top:10px;background:var(--panel)}
.pv{display:block;width:100%;height:196px;border-radius:16px;background:#84c06f;box-shadow:0 8px 10px -8px rgba(0,0,0,.4)}
@media (prefers-color-scheme:dark){.pv{background:#244431}}
fieldset{border:0;border-top:1px solid var(--line);margin:0;padding:8px 0 12px;min-width:0}
legend{font-weight:800;padding:0 8px 0 0}
.chips,.grid{display:flex;flex-wrap:wrap;gap:8px}
.grid{margin:0 0 12px}
.chip{min-height:48px;min-width:48px;display:inline-flex;align-items:center;gap:8px;border-radius:14px;border:2px solid var(--line);background:transparent;color:var(--ink);font-weight:700;font-size:16px;padding:6px 12px}
.chip[aria-pressed=true]{border-color:var(--accent);background:var(--chip)}
.chip.lock{border-style:dashed;color:var(--muted)}
.chip small{font-size:13px}
.dot{flex:none;width:18px;height:18px;border-radius:50%;border:1.5px solid rgba(0,0,0,.35)}
.lv{min-width:52px;min-height:48px;border-radius:14px;border:2px solid var(--btn);background:transparent;color:var(--ink);font-weight:800;font-size:18px}
.new{font-weight:800;color:var(--accent)}
#rot{position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:var(--panel);color:var(--ink);padding:24px;text-align:center;font-weight:800;font-size:22px}
#rot[hidden]{display:none}
@media (prefers-reduced-motion:reduce){#bE.hot{animation:none;border-color:#dc2626}}
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="A forest. Turkey runs up the screen and three hunters chase her."></canvas>

<div id="hud" class="hide">
  <button class="ib" id="bP" aria-label="Pause"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="4" y="3" width="5" height="16" rx="1.5" fill="currentColor"/><rect x="13" y="3" width="5" height="16" rx="1.5" fill="currentColor"/></svg></button>
  <div id="prog">
    <p id="progLbl">Forest 1</p>
    <div id="bar" role="progressbar" aria-label="How far across the forest" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="fill"></div></div>
  </div>
  <p id="seedBox"><span class="sr">Seeds: </span><svg width="16" height="20" viewBox="0 0 16 20" aria-hidden="true"><path d="M8 1C13 7 13 14 8 19C3 14 3 7 8 1Z" fill="#fde68a" stroke="#7a5a12" stroke-width="1.6"/><path d="M8 5.5v9" stroke="#7a5a12" stroke-width="1.4" stroke-linecap="round"/></svg><span id="seedN">0</span></p>
</div>

<div id="pad" class="hide">
  <button class="pb sm" id="bG">Gobble!</button>
  <button class="pb sm" id="bE"><i class="fb"></i><span id="eggTxt">Lay Egg</span></button>
  <div class="arrows">
    <button class="pb" id="bL" aria-label="Go left"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><path d="M19 5 8 15l11 10" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="pb" id="bR" aria-label="Go right"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><path d="m11 5 11 10-11 10" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
  <button class="pb" id="bJ">Jump</button>
</div>

<div id="overlay"><div class="panel" id="panel" tabindex="-1"></div></div>
<div id="rot" hidden><p>Turn your phone upright to play.</p></div>
<p id="live" class="sr" aria-live="polite"></p>
<noscript><p style="position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center">This game needs JavaScript. Open it in a web browser.</p></noscript>

<script>
(() => {
'use strict';
const VERSION = '0.3.1', DATE = '26 November 2026';
const EGG_WAIT = 10;            // seconds before Turkey can lay another egg
const JUMP = 0.62;              // seconds in the air
const $ = id => document.getElementById(id);
const cv = $('c'); let g = cv.getContext('2d');
const FONT = 'ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const mqDark = matchMedia('(prefers-color-scheme: dark)');
let dark = mqDark.matches;
if (mqDark.addEventListener) mqDark.addEventListener('change', e => { dark = e.matches; });

/* ---------- storage (best effort; every key starts with "turkey:") ---------- */
const store = {
  ok: true,
  get(k) { try { return localStorage.getItem('turkey:' + k); } catch (e) { this.ok = false; return null; } },
  set(k, v) { try { localStorage.setItem('turkey:' + k, String(v)); } catch (e) { this.ok = false; } }
};
store.set('v', VERSION);
let best = parseInt(store.get('best'), 10); if (!(best >= 0 && best < 1000)) best = 0;   // forests crossed
let soundOn = store.get('sound') !== '0';
let fold = { pick: false, how: true, facts: false, about: false, credits: false };
try { const f = JSON.parse(store.get('fold') || '{}'); for (const k in fold) if (typeof f[k] === 'boolean') fold[k] = f[k]; } catch (e) {}

/* ---------- Turkey's looks: each one opens at a number of seeds ---------- */
const TAILS = [
  { n: 'Classic', at: 0, c: ['#4f2b12', '#e9d4a3', '#8f4f24', '#5a3216'] },
  { n: 'Sunset', at: 25, c: ['#7c2d12', '#fdba74', '#ea580c', '#9a3412'] },
  { n: 'Bubblegum', at: 100, c: ['#9d174d', '#fbcfe8', '#ec4899', '#831843'] },
  { n: 'Snowy', at: 200, c: ['#8fa0b5', '#ffffff', '#dfe7f0', '#8fa0b5'] },
  { n: 'Peacock', at: 330, c: ['#134e4a', '#22d3ee', '#1d4ed8', '#0f766e'], eyes: true },
  { n: 'Rainbow', at: 495, c: ['#3b1d0f', '#facc15', '#fff7ed', '#5a3216'], rainbow: true },
  { n: 'Golden', at: 630, c: ['#a16207', '#fde047', '#eab308', '#854d0e'] }
];
const BODIES = [
  { n: 'Brown', at: 0, c: ['#6e3b1a', '#84481f', '#5a3216'] },
  { n: 'White', at: 45, c: ['#e8edf3', '#ffffff', '#c3ccd8'] },
  { n: 'Black', at: 130, c: ['#2b2b30', '#45454d', '#17171a'] },
  { n: 'Blue', at: 240, c: ['#1d4ed8', '#3b82f6', '#1e3a8a'] },
  { n: 'Pink', at: 380, c: ['#db2777', '#f472b6', '#9d174d'] },
  { n: 'Golden', at: 560, c: ['#ca8a04', '#facc15', '#a16207'] }
];
const HATS = [{ n: 'No Hat', at: 0 }, { n: 'Party Hat', at: 10 }, { n: 'Bow', at: 70 }, { n: 'Pilgrim Hat', at: 165 }, { n: 'Cowboy Hat', at: 285 }, { n: 'Crown', at: 435 }];
const PARTS = { tail: TAILS, body: BODIES, hat: HATS };
const UNLOCKS = [];
for (const k in PARTS) PARTS[k].forEach(p => { if (p.at > 0) UNLOCKS.push({ at: p.at, label: k === 'hat' ? p.n : p.n + ' ' + k }); });
UNLOCKS.sort((a, b) => a.at - b.at);
let seeds = parseInt(store.get('seeds'), 10); if (!(seeds >= 0 && seeds < 1e7)) seeds = 0;      // every seed ever picked up
const look = { tail: 0, body: 0, hat: 0 };
try { const l = JSON.parse(store.get('look') || '{}'); for (const k in look) { const i = l[k]; if (Number.isInteger(i) && PARTS[k][i] && PARTS[k][i].at <= seeds) look[k] = i; } } catch (e) {}
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
function seedLine() { const u = UNLOCKS.find(u => u.at > seeds); return plural(seeds, 'seed') + (u ? '. Next new look at ' + u.at + ' seeds.' : '. You have every look!'); }

/* ---------- sound: everything is made here, nothing is loaded ---------- */
const A = {
  ctx: null, master: null,
  init() {
    try {
      if (!this.ctx) {
        const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
        this.ctx = new C(); this.master = this.ctx.createGain(); this.master.gain.value = 0.55; this.master.connect(this.ctx.destination);
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) { this.ctx = null; }
  },
  tone(f0, f1, dur, type, vol, delay) {
    if (!soundOn || !this.ctx) return;
    try {
      const c = this.ctx, t = c.currentTime + (delay || 0), o = c.createOscillator(), gn = c.createGain();
      o.type = type || 'sine'; o.frequency.setValueAtTime(f0, t);
      if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
      gn.gain.setValueAtTime(0.0001, t); gn.gain.linearRampToValueAtTime(vol || 0.3, t + 0.012); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(gn); gn.connect(this.master); o.start(t); o.stop(t + dur + 0.04);
    } catch (e) {}
  },
  noise(dur, vol, freq, delay) {
    if (!soundOn || !this.ctx) return;
    try {
      const c = this.ctx, t = c.currentTime + (delay || 0), n = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const s = c.createBufferSource(), f = c.createBiquadFilter(), gn = c.createGain();
      s.buffer = buf; f.type = 'lowpass'; f.frequency.value = freq || 1000; gn.gain.value = vol || 0.3;
      s.connect(f); f.connect(gn); gn.connect(this.master); s.start(t);
    } catch (e) {}
  }
};
const sfx = {
  jump() { A.tone(300, 660, 0.16, 'sine', 0.28); },
  egg() { A.tone(540, 170, 0.13, 'sine', 0.36); A.tone(900, 620, 0.05, 'triangle', 0.14, 0.1); },
  slip() { A.tone(980, 170, 0.55, 'sine', 0.3); A.tone(210, 80, 0.25, 'triangle', 0.32, 0.5); A.noise(0.2, 0.22, 700, 0.5); },
  bonk() { A.tone(170, 70, 0.2, 'triangle', 0.45); A.noise(0.12, 0.25, 500); },
  gobble() { for (let i = 0; i < 8; i++) { const f = 580 - i * 27 + (i % 2 ? 45 : 0); A.tone(f, f * 0.76, 0.07, 'sawtooth', 0.15, i * 0.085); } },
  aim() { A.tone(880, 880, 0.07, 'square', 0.09); A.tone(880, 880, 0.07, 'square', 0.09, 0.15); },
  shot() { A.noise(0.14, 0.4, 900); A.tone(220, 60, 0.12, 'triangle', 0.28); },
  win() { [523, 659, 784, 1047].forEach((f, i) => A.tone(f, f, 0.24, 'triangle', 0.3, i * 0.13)); },
  caught() { A.tone(420, 150, 0.6, 'sawtooth', 0.16); },
  ready() { A.tone(1040, 1040, 0.12, 'sine', 0.16); },
  step() { A.tone(420, 520, 0.05, 'sine', 0.1); },
  seed() { A.tone(1180, 1580, 0.07, 'sine', 0.15); },
  unlock() { [784, 988, 1319].forEach((f, i) => A.tone(f, f, 0.16, 'triangle', 0.28, i * 0.09)); }
};

/* ---------- layout ---------- */
let W = 0, H = 0, DPR = 1, S = 1, fieldX = 0, fieldW = 0, laneW = 0, hudB = 60, padT = 500, maxGap = 160, ty = 300, ahead = 300, CATCH = 30;
const laneX = i => fieldX + laneW * (i + 0.5);
function layout() {
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  hudB = $('hud').getBoundingClientRect().bottom || 60;
  padT = $('pad').getBoundingClientRect().top || H - 150;
  fieldW = Math.min(W - 28, 440); laneW = fieldW / 3; fieldX = (W - fieldW) / 2;
  S = clamp(laneW / 117, 0.8, 1.25);
  maxGap = clamp((padT - hudB) * 0.3, 105, 190);
  ty = padT - maxGap - 30 * S;
  ahead = Math.max(120, ty - hudB);
  CATCH = 30 * S;
  if (G) { G.x = laneX(G.lane); if (G.state === 'run') tune(); }
  const tiny = W > H && H < 430;
  $('rot').hidden = !tiny;
  if (tiny && G && G.state === 'run') pause();
}

/* ---------- the game ---------- */
let G = null;
G = { state: 'menu', level: 1, t: 0, dist: 0, total: 1, speed: 200, slow: 0, lane: 1, x: 0, jumpT: -1, jbuf: 0, stumT: 0, inv: 0, runT: 0, gobT: 0, autoGob: 9,
  gap: 300, dGap: 300, hState: 'chase', hT: 0, slipLane: 1, slips: 0, eggCd: 0, eggs: [], obs: [], rowN: 0, nextRow: 0, pel: [], aim: null, shotT: 7,
  parts: [], texts: [], seedList: [], seedsRun: 0, newLooks: [], endT: 0, readyT: 0, shake: 0, runTime: 42, catchTime: 24, rowGap: [1.2, 1.65], shotGap: [6.5, 9.5], aimTime: 1.05 };

function tune() {                      // how hard this forest is
  const L = G.level;
  G.speed = ahead / Math.max(1.05, 1.75 - 0.1 * (L - 1));
  G.runTime = Math.min(70, 42 + 4 * (L - 1));
  G.catchTime = Math.max(13, 24 - 1.5 * (L - 1));
  G.rowGap = [Math.max(0.85, 1.2 - 0.05 * (L - 1)), Math.max(1.15, 1.65 - 0.07 * (L - 1))];
  G.shotGap = [Math.max(3, 6.5 - 0.6 * (L - 1)), Math.max(4.5, 9.5 - 0.8 * (L - 1))];
  G.aimTime = Math.max(0.7, 1.05 - 0.05 * (L - 1));
}
function start(level) {
  A.init();
  Object.assign(G, { state: 'run', level, dist: 0, slow: 0, lane: 1, jumpT: -1, jbuf: 0, stumT: 0, inv: 0, gobT: 0, autoGob: rnd(9, 15),
    hState: 'chase', hT: 0, slips: 0, eggCd: 0, eggs: [], obs: [], rowN: 0, pel: [], aim: null, parts: [], texts: [], seedList: [], seedsRun: 0, newLooks: [], endT: 0, readyT: 1.5, shake: 0 });
  layout(); tune();
  G.x = laneX(1); G.gap = G.dGap = maxGap + 90;
  G.total = G.speed * G.runTime;
  G.nextRow = ahead + G.speed * 1.3;
  G.shotT = rnd(6, 8);
  showPanel(null);
  $('progLbl').textContent = 'Forest ' + level; $('seedN').textContent = seeds;
  eggShown = ''; updEgg(); setProg(0, true);
  say('Forest ' + level + '. Ready, go!');
  sfx.ready();
}
const airborne = () => G.jumpT > 0.1 && G.jumpT < 0.9;

function moveLane(d) {
  if (G.state !== 'run') return;
  const n = clamp(G.lane + d, 0, 2);
  if (n !== G.lane) { G.lane = n; sfx.step(); }
}
function jump() {
  if (G.state !== 'run') return;
  if (G.jumpT >= 0) { G.jbuf = 0.18; return; }
  G.jumpT = 0; G.jbuf = 0; sfx.jump();
}
function gobble() {
  if (G.state !== 'run' || G.gobT > 0.4) return;
  G.gobT = 0.95; sfx.gobble();
}
function layEgg() {

function spawnRow() {
  const wy = G.nextRow, L = G.level, lanes = [0, 1, 2].sort(() => Math.random() - 0.5);
  const add = (type, lane) => {         // type is the rule (log: jump it, tree: go around it); look is the picture
    const r = Math.random(), look = type === 'tree' ? (r < 0.32 ? 'rock' : 'tree') : lane < 0 ? (r < 0.45 ? 'creek' : 'log') : (r < 0.38 ? 'mud' : 'log');

    else if (p === 2) { add('tree', lanes[0]); add('tree', lanes[1]); }
    else if (p === 3) add('log', -1);

function update(dt) {
  G.t += dt;
  for (const p of G.parts) { p.life += dt; p.vy += p.grav * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; }
  G.parts = G.parts.filter(p => p.life < p.max);
  for (const t of G.texts) { t.life += dt; t.y -= 34 * dt; }
  G.texts = G.texts.filter(t => t.life < t.max);
  G.shake = Math.max(0, G.shake - dt);

  if (G.state === 'menu') { G.dist += 70 * dt; G.runT += dt * 0.55; G.x += (laneX(1) - G.x) * Math.min(1, dt * 8); return; }
  if (G.state === 'caught') { G.endT += dt; if (G.endT > 1 && !panelName) showPanel('caught'); return; }
  if (G.state === 'won') {
    const sp = G.speed * (G.endT > 1.5 ? 0.45 : 1);
    G.endT += dt; G.dist += sp * dt; G.runT += dt * 0.8; G.gap += G.speed * 0.8 * dt; G.dGap = G.gap;
    G.x += (laneX(G.lane) - G.x) * Math.min(1, dt * 16);
    if (G.jumpT >= 0) { G.jumpT += dt / JUMP; if (G.jumpT >= 1) G.jumpT = -1; }
    else if (G.endT > 0.5 && !reduce) G.jumpT = 0;             // happy hops
    if (G.endT > 1.5 && !panelName) showPanel('win');
    return;
  }
  if (G.state !== 'run') return;

  if (G.readyT > 0) G.readyT -= dt;
  const v = G.speed * (G.slow > 0 ? 0.55 : 1);
  G.slow = Math.max(0, G.slow - dt);
  G.dist += v * dt; G.runT += dt * (v / G.speed);
  G.x += (laneX(G.lane) - G.x) * Math.min(1, dt * 16);
  if (G.jumpT >= 0) { G.jumpT += dt / JUMP; if (G.jumpT >= 1) { G.jumpT = -1; puff(G.x, ty + 12 * S); } }
  if (G.jbuf > 0) { G.jbuf -= dt; if (G.jumpT < 0) jump(); }
  G.stumT = Math.max(0, G.stumT - dt); G.inv = Math.max(0, G.inv - dt); G.gobT = Math.max(0, G.gobT - dt);
  G.autoGob -= dt; if (G.autoGob <= 0) { gobble(); G.autoGob = rnd(11, 18); }
  if (G.eggCd > 0) { G.eggCd -= dt; if (G.eggCd <= 0) { G.eggCd = 0; sfx.ready(); say('Egg ready.'); } }

  while (G.nextRow < G.dist + ahead + 260 && G.nextRow < G.total - ahead * 1.15) spawnRow();

  // logs and trees
  for (const o of G.obs) {
    if (o.hit) continue;
    const d = o.wy - G.dist;
    if (Math.abs(d) < (o.type === 'tree' ? 16 : 14) * S) {
      const inLane = o.wide || Math.abs(G.x - laneX(o.lane)) < laneW * 0.42;

        stumble(wet ? 'Splash!' : o.type === 'log' ? 'Tripped!' : 'Bonk!');
        if (wet) for (let i = 0; i < 10; i++) G.parts.push({ type: 'puff', x: G.x + rnd(-22, 22), y: ty + rnd(-6, 12), vx: rnd(-110, 110), vy: rnd(-230, -90), rot: 0, vr: 0, life: 0, max: rnd(0.4, 0.7), size: rnd(3, 5) * S, color: o.look === 'mud' ? '#7a5632' : '#7cc0f0', grav: 520 });
      }
    }
  }
  G.obs = G.obs.filter(o => o.wy > G.dist - (H - ty) - 140);

  // seeds
  for (const sd of G.seedList) if (Math.abs(sd.wy - G.dist) < 20 * S && Math.abs(G.x - laneX(sd.lane)) < laneW * 0.45) { sd.got = true; gotSeed(laneX(sd.lane)); }

  // eggs

    const ey = ty + (G.dist - e.wy);
    if (!e.splat && G.hState === 'chase' && ey >= hy - 14 * S) slip(e);
  }

  // hunters

function draw() {

  g.setLineDash([]);

  }

  }

  } else if (name === 'win') {
    h = '<h2 id="pt">Turkey got away!</h2><p class="lead">You crossed Forest ' + G.level + '. The hunters slipped ' + plural(G.slips, 'time') + ', and you picked up ' + plural(G.seedsRun, 'seed') + '.</p>' + fresh
      + '<div class="row"><button class="b go" data-a="next">Next Forest</button><button class="b" data-a="look">My Turkey</button><button class="b" data-a="menu">Menu</button></div><p class="muted">Saved. You have ' + seedLine() + ' The next forest is a little faster.</p>';
  } else if (name === 'caught') {
    h = '<h2 id="pt">Caught!</h2><p class="lead">The hunters caught up with Turkey. Try again, and remember your eggs!</p>' + fresh
      + '<div class="row"><button class="b go" data-a="again">Try Again</button><button class="b" data-a="look">My Turkey</button><button class="b" data-a="menu">Menu</button></div><p class="muted">You keep your seeds. You have ' + seedLine() + '</p>';
  } else if (name === 'look') {
    const chips = k => PARTS[k].map((p, i) => {
      const open = p.at <= seeds, dot = k === 'hat' ? '' : '<span class="dot" style="background:' + (p.rainbow ? 'linear-gradient(90deg,#ef4444,#facc15,#22c55e,#3b82f6,#a855f7)' : k === 'tail' ? p.c[1] : p.c[0]) + '"></span>';
      return '<button class="chip' + (open ? '' : ' lock') + '" data-a="part" data-k="' + k + '" data-i="' + i + '" aria-pressed="' + (open && look[k] === i) + '"' + (open ? '' : ' aria-disabled="true"') + '>' + dot + p.n + (open ? '' : ' <small>' + p.at + ' seeds</small>') + '</button>';
    }).join('');
    h = '<h2 id="pt">My Turkey</h2><div class="pvw"><canvas id="pv" class="pv" role="img" aria-label="Your turkey"></canvas></div><p class="muted" id="lookMsg">You have ' + seedLine() + '</p>'
      + '<fieldset><legend>Tail</legend><div class="chips">' + chips('tail') + '</div></fieldset>'
      + '<fieldset><legend>Body</legend><div class="chips">' + chips('body') + '</div></fieldset>'
      + '<fieldset><legend>Hat</legend><div class="chips">' + chips('hat') + '</div></fieldset>'
      + '<div class="row"><button class="b go" data-a="lookdone">Done</button></div>';
  } else if (name === 'paused') {
    h = '<h2 id="pt">Paused</h2><div class="row"><button class="b go" data-a="resume">Keep Playing</button></div>'
      + '<div class="row"><button class="b" data-a="sound" aria-pressed="' + soundOn + '">' + soundLabel() + '</button><button class="b" data-a="menu">Menu</button></div>';
  }
  pn.classList.toggle('lookp', name === 'look');
  pn.innerHTML = h; pn.setAttribute('role', 'dialog'); pn.setAttribute('aria-labelledby', 'pt'); pn.scrollTop = 0;
  const first = pn.querySelector('.go'); if (first) { try { first.focus({ preventScroll: true }); } catch (e) {} }
  if (name === 'look') drawPreview();
}
let lookBack = 'menu';
$('panel').addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a;
  if (a === 'cont') start(best + 1);
  else if (a === 'go') start(clamp(parseInt(b.dataset.n, 10) || 1, 1, best + 1));
  else if (a === 'look') { lookBack = panelName || 'menu'; showPanel('look'); }
  else if (a === 'lookdone') showPanel(lookBack);
  else if (a === 'part') {
    const k = b.dataset.k, i = parseInt(b.dataset.i, 10), part = PARTS[k] && PARTS[k][i]; if (!part) return;
    if (part.at > seeds) { const m = part.n + ' needs ' + part.at + ' seeds. You have ' + seeds + '.'; $('lookMsg').textContent = m; say(m); return; }
    look[k] = i; store.set('look', JSON.stringify(look));
    b.parentNode.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c === b));
    $('lookMsg').textContent = 'You have ' + seedLine(); say(part.n + ' picked.');
  }
  else if (a === 'next') start(G.level + 1);
  else if (a === 'again') start(G.level);
  else if (a === 'resume') resume();
  else if (a === 'menu') { G.state = 'menu'; G.obs = []; G.eggs = []; G.pel = []; G.seedList = []; G.newLooks = []; G.aim = null; G.jumpT = -1; G.stumT = 0; G.inv = 0; G.gobT = 0; G.lane = 1; showPanel('menu'); }
  else if (a === 'sound') { soundOn = !soundOn; store.set('sound', soundOn ? '1' : '0'); b.textContent = soundLabel(); b.setAttribute('aria-pressed', soundOn); if (soundOn) { A.init(); sfx.ready(); } }
});
$('panel').addEventListener('toggle', e => {
  const k = e.target && e.target.dataset && e.target.dataset.k;
  if (k && k in fold) { fold[k] = e.target.open; store.set('fold', JSON.stringify(fold)); }
}, true);

function pause() { if (G.state !== 'run') return; G.state = 'paused'; showPanel('paused'); say('Paused.'); }
function resume() { if (G.state !== 'paused') return; A.init(); G.state = 'run'; showPanel(null); last = 0; }

/* ---------- controls ---------- */
function bind(id, fn) {
  const b = $(id); let lastDown = -1e9;
  b.addEventListener('pointerdown', e => { e.preventDefault(); lastDown = performance.now(); b.classList.add('down'); fn(); });
  const up = () => b.classList.remove('down');
  b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('pointerleave', up);
  b.addEventListener('click', () => { if (performance.now() - lastDown > 700) fn(); });      // keyboard and switch users
  b.addEventListener('contextmenu', e => e.preventDefault());
}
bind('bL', () => moveLane(-1)); bind('bR', () => moveLane(1)); bind('bJ', jump); bind('bE', layEgg); bind('bG', gobble);
$('bP').addEventListener('click', pause);

let sw = null;
cv.addEventListener('pointerdown', e => { if (G.state === 'run') sw = { x: e.clientX, y: e.clientY, done: false, t: performance.now() }; });
cv.addEventListener('pointermove', e => {
  if (!sw || sw.done) return;
  const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
  if (Math.abs(dx) < 22 && Math.abs(dy) < 22) return;
  sw.done = true;
  if (Math.abs(dx) > Math.abs(dy)) moveLane(dx > 0 ? 1 : -1); else if (dy < 0) jump(); else layEgg();
});
cv.addEventListener('pointerup', () => { if (sw && !sw.done && performance.now() - sw.t < 350) jump(); sw = null; });
cv.addEventListener('pointercancel', () => { sw = null; });
cv.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('keydown', e => {
  const k = e.key, onBtn = e.target && e.target.closest && e.target.closest('button,summary,a');
  if (onBtn && (k === ' ' || k === 'Enter')) return;
  if (G.state === 'run') {
    let used = true;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') { if (!e.repeat) moveLane(-1); }
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') { if (!e.repeat) moveLane(1); }
    else if (k === 'ArrowUp' || k === 'w' || k === 'W' || k === ' ') { if (!e.repeat) jump(); }
    else if (k === 'ArrowDown' || k === 's' || k === 'S' || k === 'e' || k === 'E') { if (!e.repeat) layEgg(); }
    else if (k === 'g' || k === 'G') { if (!e.repeat) gobble(); }
    else if (k === 'p' || k === 'P' || k === 'Escape') pause();
    else used = false;
    if (used) e.preventDefault();
  } else if (G.state === 'paused' && (k === 'p' || k === 'P' || k === 'Escape')) { resume(); e.preventDefault(); }
});
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 250));
// some phones only allow sound after a finished tap
['pointerup', 'touchend', 'click', 'keydown'].forEach(ev => window.addEventListener(ev, () => { if (A.ctx && A.ctx.state === 'suspended') A.init(); }, { passive: true }));

/* ---------- go ---------- */
let last = 0;
function frame(ts) {
  const dt = last ? Math.min(0.05, (ts - last) / 1000) : 0; last = ts;
  if (G.state !== 'paused') update(dt);
  draw();
  if (panelName === 'look') drawPreview();
  requestAnimationFrame(frame);
}
layout(); G.x = laneX(1);
showPanel('menu');
requestAnimationFrame(frame);
window.__turkey = { G, maxGap: () => maxGap, seeds: () => seeds, look };     // for tests
})();
</script>
</body>
</html>
